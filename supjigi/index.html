<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더숲 워크룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 위 머리줄(이름 · 서점/아카데미 전환) → 지점 고르기 → 화면 탭 → 본문 1단(넓으면 2단 카드) */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface2:#eaeee8; --ink:#14221b; --muted:#5b6a61; --line:#d9e0d8;
  --pine:#1d6a49; --pine-ink:#ffffff; --pine-soft:#e1efe7;
  --warn:#b97400; --warn-soft:#fbf0d9; --crit:#b23a2b; --crit-soft:#f9e4e0; --ok:#1d7a4f; --info:#2a5f8f; --info-soft:#e3edf6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#8a5fd0; --s6:#cf4f8d;
  --display:"Gowun Batang","Noto Serif KR",serif; --body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:3px; --shadow:0 1px 2px rgba(20,34,27,.06),0 6px 18px rgba(20,34,27,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#111815; --surface:#19221d; --surface2:#222d27; --ink:#e9efe9; --muted:#9fb0a5; --line:#2f3c35;
  --pine:#4fb787; --pine-ink:#0c1511; --pine-soft:#1f3a2e;
  --warn:#e2a53a; --warn-soft:#3a2f17; --crit:#ec7c6c; --crit-soft:#40211c; --ok:#58c08f; --info:#7fb2e0; --info-soft:#1c2c3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9a78e0; --s6:#d9649c; --shadow:none;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111815; --surface:#19221d; --surface2:#222d27; --ink:#e9efe9; --muted:#9fb0a5; --line:#2f3c35;
  --pine:#4fb787; --pine-ink:#0c1511; --pine-soft:#1f3a2e;
  --warn:#e2a53a; --warn-soft:#3a2f17; --crit:#ec7c6c; --crit-soft:#40211c; --ok:#58c08f; --info:#7fb2e0; --info-soft:#1c2c3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9a78e0; --s6:#d9649c; --shadow:none;}
@font-face{font-family:"Pretendard";font-weight:800;font-display:swap;src:url(pretendard-800.woff) format("woff")}
@font-face{font-family:"Pretendard";font-weight:400;font-display:swap;src:url(pretendard-400.woff) format("woff")}
@font-face{font-family:"Pretendard";font-weight:600;font-display:swap;src:url(pretendard-600.woff) format("woff")}
@font-face{font-family:"Pretendard";font-weight:500;font-display:swap;src:url(pretendard-500.woff) format("woff")}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-text-size-adjust:100%}
body.big{font-size:17.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--pine)}

/* 잠금 */
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:16px}
.lockbox{width:min(320px,100%);display:grid;gap:18px;justify-items:center}
.lockbox h1{font-size:34px;letter-spacing:.04em}
.lockbox p{margin:0;color:var(--muted)}
.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pine)}.dots i.on{background:var(--pine)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pad button{height:58px;border-radius:3px;border:1px solid var(--line);background:var(--surface);font-size:21px;font-weight:600}
.pad button:active{background:var(--pine-soft)}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 머리 */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 12px var(--body);color:var(--muted)}
.mode{display:flex;background:var(--surface2);border-radius:3px;padding:3px;margin-left:auto}
.mode button{border:0;background:none;padding:7px 18px;border-radius:3px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 12px;font-size:13px;color:var(--muted)}
.row2{max-width:1160px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto}
.brchip{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 14px;white-space:nowrap;font-weight:500;display:flex;align-items:center;gap:6px}
.brchip i{width:9px;height:9px;border-radius:50%}
.brchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
nav.tabs{max-width:1160px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 13px;white-space:nowrap;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pine)}
nav.tabs button .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:3px;background:var(--crit);color:#fff;font-size:11px;line-height:18px}

main{max-width:1160px;margin:0 auto;padding:18px 16px 80px;display:grid;gap:18px}
.demo{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo b{color:var(--warn)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card>h3{font-size:17px;margin-bottom:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card>h3 small{font:400 12.5px var(--body);color:var(--muted)}
.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.sec h2{font-size:21px}.sec p{margin:0;color:var(--muted)}
.kpi span{display:block;color:var(--muted);font-size:13px}.kpi b{font-size:25px;font-family:var(--display)}.kpi small{display:block;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--crit)}
.note{color:var(--muted);font-size:13px;margin:0}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-none{background:var(--crit-soft);color:var(--crit)}.p-low{background:var(--warn-soft);color:var(--warn)}.p-ok{background:var(--pine-soft);color:var(--ok)}.p-info{background:var(--info-soft);color:var(--info)}.p-mute{background:var(--surface2);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--pine)}.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}.btn.sm{padding:4px 10px;font-size:13px}.btn.ghost{border-color:transparent;color:var(--pine)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:4px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--pine-soft);border-color:var(--pine);color:var(--pine);font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--muted)}
.list{display:grid}.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;overflow-wrap:anywhere}.li .t small{color:var(--muted)}
.al{border-left:4px solid var(--warn);padding:6px 10px;background:var(--warn-soft);border-radius:0 8px 8px 0}.al.crit{border-color:var(--crit);background:var(--crit-soft)}
[hidden]{display:none!important}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:28px;height:28px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}.qty b{min-width:26px;text-align:center}
.fld{display:grid;gap:4px}.fld label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.form{display:grid;gap:12px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{counter-reset:s;display:grid;gap:8px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:10px}.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--pine-soft);color:var(--pine);font-weight:700;display:grid;place-items:center;font-size:13px}
/* 차트 */
.hb{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;padding:4px 0}
.hb .tr{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--pine)}
.hb .v{font-variant-numeric:tabular-nums;font-size:13.5px;min-width:64px;text-align:right}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
.heat td.c{text-align:right;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:3px;font-size:12.5px;display:none;max-width:240px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:3px;z-index:70;display:none;font-weight:500;max-width:90vw}
/* 시트 */
#sheet{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .box{background:var(--surface);width:min(620px,100%);max-height:92%;overflow:auto;border-radius:3px 18px 0 0;padding:18px;display:grid;gap:14px}
@media(min-width:700px){#sheet{align-items:center}#sheet .box{border-radius:3px}}
/* 공간 */
.planwrap{background:var(--surface2);border-radius:var(--r);overflow:auto;touch-action:none}
.planwrap svg{display:block;min-width:520px;width:100%;height:auto}
.fx{cursor:grab}.fx.sel rect,.fx.sel circle{stroke:var(--pine);stroke-width:3}
/* 디자인 */
.stage{background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/18px 18px;border-radius:var(--r);padding:18px;display:grid;place-items:center;overflow:auto}
.stage svg{max-width:100%;height:auto;max-height:70vh;box-shadow:0 0 0 1px var(--line)}

.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}.sw[aria-pressed="true"]{outline:3px solid var(--pine);outline-offset:2px}
.theme{border-left:5px solid var(--pine)}
.theme h3{font-size:19px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:14px}.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
@media(max-width:520px){.f2{grid-template-columns:1fr}.brand small{display:none}.mode{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* 손질: 여백 넉넉히, 선은 가늘게, 제목은 명조로 크게 */
:root{--bg:#f6f5f0;--shadow:none;--r:16px}
.bar{padding:14px 20px 8px}.brand{gap:10px;align-items:center;font-size:20px}.blogo{display:block;height:20px;width:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blogo{filter:brightness(0) invert(1)}}:root[data-theme="dark"] .blogo{filter:brightness(0) invert(1)}
.row2{padding:0 20px 6px}.brchip{border-color:transparent;background:var(--surface2)}
nav.tabs{padding:0 20px;gap:6px}nav.tabs button{padding:12px 4px;margin-right:18px;font-size:16px}
main{padding:28px 20px 90px;gap:22px}
.hero{padding:10px 0 2px}.hero p{margin:0 0 6px;color:var(--muted);font-size:14px}.hero h2{font-size:clamp(26px,4.4vw,38px);letter-spacing:-.01em;line-height:1.25}
.sec h2{font-size:26px}
.pcard{display:grid;gap:14px;padding:22px}.phead{display:flex;gap:16px;align-items:center}.phead svg{width:72px;height:72px}.phead h3{font-size:23px;line-height:1.3}.phead p{margin:4px 0 0;color:var(--muted)}
.blist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}.blist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}.blist span{min-width:0}.blist small{color:var(--muted);margin-left:8px;font-size:13px}.blist em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}.blist em.in{color:var(--ok);font-weight:600}
details.fold{border-top:1px solid var(--line);padding:16px 0 0}details.fold>summary,details[data-o="dmore"]>summary{cursor:pointer;font-family:var(--display);font-size:19px;list-style:none;display:flex;gap:10px;align-items:baseline}details>summary::-webkit-details-marker{display:none}details.fold>summary::after,details[data-o="dmore"]>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-family:var(--body)}details[open].fold>summary::after,details[open][data-o="dmore"]>summary::after{content:"－"}details summary small{font:400 13px var(--body);color:var(--muted)}
details[data-o="dmore"]{border-top:1px solid var(--line);padding-top:14px}details[data-o="dmore"]>summary{font-size:16px}
details.menu{position:relative;margin-left:auto}details.menu>summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:3px;padding:8px 14px;font-weight:600}details.menu>div{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px;display:grid;min-width:190px;z-index:5;box-shadow:0 0 0 1px var(--line)}details.menu button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:3px}details.menu button:hover{background:var(--surface2)}
.pick{display:grid;gap:4px;text-align:left;padding:20px;cursor:pointer}.pick b{font-family:var(--display);font-size:21px}.pick small{color:var(--muted)}
.mrow{display:flex;width:100%;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 0;text-align:left}.mrow:last-child{border-bottom:0}.mrow>span:first-child{flex:1}.mrow b{display:block}.mrow small{color:var(--muted)}
.btn{border-radius:3px;padding:9px 18px}.btn.sm{padding:4px 12px}.mic.on{background:var(--crit);border-color:var(--crit);color:#fff}
.stage{padding:22px;border-radius:var(--r)}
@media(max-width:760px){.dz .stagecol{order:-1}}
.feel{display:grid;gap:8px}.feels{display:grid;grid-template-columns:repeat(3,minmax(0,120px));gap:10px}.feels button{background:none;border:0;padding:0;cursor:pointer;display:grid;gap:6px;justify-items:center;color:var(--muted);font:inherit}.feels svg{width:100%;height:auto;border-radius:3px;box-shadow:0 0 0 1px var(--line);outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s}.feels button[aria-pressed=true] svg{outline-color:var(--pine)}.feels button[aria-pressed=true] small{color:var(--ink);font-weight:700}
.auto{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:16px}.auto small{color:var(--muted)}.auto ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px}.auto .fc{display:grid;gap:2px;text-align:right;padding-left:24px;border-left:1px solid var(--line)}.auto .fc b{font-size:34px;font-family:var(--display);line-height:1.15}.auto .fc span{font-size:13px;color:var(--muted)}.auto .fc em{font-style:normal;font-size:12px;color:var(--muted)}@media(max-width:720px){.auto{grid-template-columns:1fr}.auto .fc{text-align:left;border-left:0;border-top:1px solid var(--line);padding:14px 0 0}}
.pthumb{flex:none;width:84px;padding:0;border:0;background:none;cursor:pointer}.pthumb svg{width:100%;height:auto;border-radius:3px;box-shadow:0 0 0 1px var(--line);display:block}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}.flow li{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:3px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:600}.flow li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);font-size:12.5px}.flow li.on{color:var(--ink);border-color:var(--pine)}.flow li.on b{background:var(--pine);color:#fff}.flow li.done b{background:var(--ok);color:#fff}.flow i{color:var(--muted);font-style:normal}
.sws{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmeta{display:flex;gap:6px;flex-wrap:wrap;margin:0}.cmeta span{font-size:12.5px;padding:3px 10px;border-radius:3px;background:var(--surface2);color:var(--muted);font-weight:600}
.blist i.no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);font-style:normal;font-size:11.5px;font-weight:700;margin-right:8px;color:var(--muted)}.blist small.role{color:var(--pine);font-weight:700}
details.cnote{margin:0;border:0;padding:0}details.cnote>summary{font-size:14px;color:var(--muted);padding:2px 0}details.cnote ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.brand span,.lockbox h1,.pick b,.card h3,.chip{font-family:"Pretendard",sans-serif!important;font-weight:800!important;letter-spacing:-.01em}
.pick b,.card h3{font-weight:800!important}.chip{font-weight:600!important;letter-spacing:0}
.btn.fresh{border-color:var(--pine);color:var(--pine);font-weight:700}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}.tpl button{display:grid;gap:2px;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:3px;background:var(--surface);cursor:pointer;font:inherit;color:var(--ink)}.tpl button b{font-weight:800;font-size:15px}.tpl button small{color:var(--muted);font-size:12px}.tpl button[aria-pressed=true]{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.todo{padding:6px 18px;margin-bottom:16px}.todo .li{align-items:center}
#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;padding:14mm 16mm;background:#fff}@page{size:A4;margin:0}}.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.frows{display:grid;gap:6px;margin-top:8px}.frow{display:grid;grid-template-columns:1fr 1.4fr 70px 110px auto;gap:6px;align-items:center}.frow input{min-width:0}@media(max-width:560px){.frow{grid-template-columns:1fr 1fr}}
body{word-break:keep-all;overflow-wrap:anywhere}h1,h2,h3,.hero h2,.pcard h3{text-wrap:balance}p,li,small{text-wrap:pretty}.lnk{border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 4px}
.subnav{display:flex;width:fit-content;max-width:100%;gap:4px;padding:4px;border-radius:3px;background:var(--surface2);margin:0 0 18px}.subnav button{border:0;background:none;padding:8px 16px;border-radius:3px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}.subnav button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

button.brand{border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px;font:inherit;color:inherit}.homeb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:7px 12px;margin-left:12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}.homeb:hover{background:var(--surface2)}
/* 더 단순하게 */
.hero p{display:none}.card:has(>.grid>.al){display:none}.pcard .phead p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sec p{display:none}.kpi small{color:var(--muted)}
.lkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 28px;align-items:start}.lkhead{display:flex;gap:8px;align-items:baseline;padding-bottom:8px;border-bottom:2px solid var(--ink)}.lkhead b{font-size:16px;font-weight:800}.lkhead small{color:var(--muted)}.lkrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.lkrow>div{min-width:0;display:grid;gap:1px}.lkrow b{font-weight:600}.lkrow small{color:var(--muted);font-size:12.5px}.lkrow em{font-style:normal;font-size:12px;color:var(--pine)}.cartgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:0 28px}
.qadd{padding:14px 16px;margin-bottom:8px}.qrow{display:flex;gap:8px}.qrow input{flex:1;min-width:0;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-family:inherit}.qrow input:focus{outline:2px solid #1a1a1a;outline-offset:1px}.qadd small{display:block;margin-top:8px}
.qsrc{margin:0 2px 14px;font-size:12.5px}.qday{margin-bottom:12px}.qday h3 small{font-weight:500;color:var(--muted);margin-left:6px}.qt{flex:0 0 52px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--muted)}

.oph{margin-bottom:14px}.qq{display:inline-flex;align-items:center;gap:8px}.qq button{width:28px;height:28px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-size:16px;cursor:pointer}.qq b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}

.d3f{transform-origin:bottom;transform:translateY(-100%) rotateX(-78deg);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),4px 0 0 #f4eedd}.d3f.pp{background:#fffdf7;color:#555;font:700 12px Pretendard,sans-serif;box-shadow:inset 0 0 0 1px #cfc6b0}.d3f.vs{background:linear-gradient(#8fa98b 55%,#cfd8d2 55%);border-radius:40% 40% 12% 12%;box-shadow:none}
.dprd{background:#f6f4ee;border-radius:3px;padding:12px 14px;margin-bottom:10px;font-size:14px}.dprd small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 6px}.dprd p{margin:4px 0}.dprd ul{margin:4px 0;padding-left:18px}
.tabs .tg{align-self:center;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding:0 2px 0 0;margin-right:-4px;white-space:nowrap}.tabs .tg:not(:first-child){margin-left:14px;padding-left:16px;border-left:1px solid var(--line)}
.akx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 16px}
.gbar{padding:12px 16px;margin-bottom:14px}
#scan{position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column}#scan video{flex:1;min-height:0;width:100%;object-fit:cover}.scanF{position:absolute;left:10%;right:10%;top:28%;height:22%;border:2px solid rgba(255,255,255,.85);border-radius:3px;pointer-events:none;transition:border-color .2s}#scan.ok .scanF{border-color:#5fd08a;box-shadow:0 0 0 4px rgba(95,208,138,.35)}#scanList{background:#111;color:#fff;padding:12px 16px;display:grid;gap:6px;font-size:14px;max-height:34vh;overflow:auto}#scanList small{color:#bbb}#scan .btn{margin:10px 16px 18px}
.tkr{display:grid;grid-template-columns:1fr 1.4fr 1.6fr auto;gap:8px}.tkr input{min-width:0;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-family:inherit}@media(max-width:720px){.tkr{grid-template-columns:1fr 1fr}.tkr input:nth-child(3),.tkr button{grid-column:1/-1}}
.tkh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.tkh b{font-size:18px;display:block}.tkh small{color:var(--muted)}.tkb{display:flex;gap:10px;align-items:center}
.tkc{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid #999;background:none;cursor:pointer;padding:0}.tkc[aria-pressed="true"]{background:#1a1a1a;border-color:#1a1a1a;box-shadow:inset 0 0 0 4px #fff}.tkl.done b{color:var(--muted);text-decoration:line-through;font-weight:500}.tkl small.late{color:#b3402a;font-weight:600}.tkq{margin:12px 0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.dpsel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 10px}.dpsel select{width:auto;flex:0 1 auto;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.vwb{margin-left:6px}body.vm{background:#e9e7e1}body.vm #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg,#f5f5f2);box-shadow:0 0 0 1px var(--line)}body.vm .f2,body.vm .auto,body.vm .g2,body.vm .g3,body.vm .g4{grid-template-columns:1fr}body.vm .tkr{grid-template-columns:1fr 1fr}body.vm .tkr input:nth-child(3),body.vm .tkr button{grid-column:1/-1}body.vm .dz .stagecol{order:-1}body.vm .brand small{display:none}body.vm .mode{margin-left:0}body.vm .tabs,body.vm .brs{overflow-x:auto}body.vm #sheet{align-items:flex-end}body.vm #sheet .box{max-width:430px}
.spf .spw{display:block!important;margin:0 0 6px;font-size:16.5px;line-height:1.6}.spw{display:block!important}.spf ul{margin:12px 0 0;padding-left:18px;display:grid;gap:5px;font-size:14.5px}.spf dl{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14px}.spf dt{color:var(--muted)}.spf dd{margin:0}.spf textarea{width:100%;margin-top:8px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:3px}
.plf{margin-bottom:12px}.plf label{display:block;margin-bottom:5px}.plf input{width:100%;font:inherit;font-size:15.5px;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.pr2{grid-template-columns:1fr 1fr 2fr auto}.pr2 select{min-width:0;font:inherit;font-size:15px;padding:11px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}@media(max-width:720px){.pr2{grid-template-columns:1fr 1fr}}body.vm .pr2{grid-template-columns:1fr 1fr}
.sact .li small{display:block!important}.sact .pill{flex:0 0 auto}

/* ══ 잠금 화면 v2 ══ */
#lock{position:fixed;inset:0;z-index:50;padding:0;display:block;background:#003128;color:#f2eee3;overflow:hidden;transition:opacity .5s ease,transform .5s ease}
#lock.out{opacity:0;transform:translateY(-14px);pointer-events:none}
#lock::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 18% 0%,rgba(46,128,100,.42),transparent 60%),linear-gradient(180deg,transparent 55%,rgba(0,20,15,.5))}
.lkf{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(52vh,460px);display:block}
.lkf .sp{transform-box:fill-box;transform-origin:50% 100%;animation:lkrise 1.1s cubic-bezier(.16,.8,.24,1) both}
@keyframes lkrise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.lkf .sp{animation:none}#lock{transition:none}}
.lk{position:relative;height:100%;max-width:1120px;margin:0 auto;padding:clamp(28px,6vh,64px) clamp(22px,5vw,56px);display:grid;grid-template-columns:1fr auto;gap:40px;align-items:start}
.lkl img{display:block;height:26px;width:auto}
.lkd{margin:clamp(28px,7vh,72px) 0 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.lkd b{font:800 clamp(46px,8.4vw,104px)/1 "Pretendard",sans-serif;letter-spacing:-.035em}
.lkd span{font:500 clamp(16px,1.8vw,22px) "Pretendard",sans-serif;color:#d9b45b}
.lkt{margin:14px 0 0;font:500 clamp(15px,1.5vw,18px) "Pretendard",sans-serif;color:rgba(242,238,227,.72)}
.lkr{width:264px;padding-top:6px;justify-self:end}
#lkMsg{margin:0 0 16px;font:500 14.5px "Pretendard",sans-serif;color:rgba(242,238,227,.8)}
#lock .dots{display:flex;gap:12px;margin-bottom:26px}
#lock .dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(242,238,227,.55);transition:background .15s,border-color .15s,transform .15s}
#lock .dots i.on{background:#d9b45b;border-color:#d9b45b;transform:scale(1.12)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 24px;width:auto}
#lock .pad button{width:72px;height:72px;border-radius:50%;border:1px solid rgba(242,238,227,.26);background:rgba(0,49,40,.35);color:#f2eee3;font:500 25px "Pretendard",sans-serif;display:grid;place-items:center;backdrop-filter:none;backdrop-filter:none;transition:background .12s,border-color .12s,transform .08s}
#lock .pad button:hover{background:rgba(242,238,227,.1);border-color:rgba(242,238,227,.5)}
#lock .pad button:active{background:#d9b45b;border-color:#d9b45b;color:#003128;transform:scale(.95)}
#lock .pad button:focus-visible{outline:2px solid #d9b45b;outline-offset:3px}
#lock .pad button[data-n="x"]{border-color:transparent;background:none}
@media(max-width:760px){.lk{grid-template-columns:1fr;gap:0;align-content:space-between;padding-bottom:max(22px,env(safe-area-inset-bottom))}.lkr{justify-self:center;width:auto;text-align:center}#lock .dots{justify-content:center}.lkf{height:36vh;opacity:.5}.lkd{margin-top:26px}#lock .pad{gap:12px 26px}}
@media(max-height:640px){#lock .pad{grid-template-columns:repeat(3,60px);gap:10px 20px}#lock .pad button{width:60px;height:60px;font-size:22px}.lkd b{font-size:44px}}

/* ══ 워크룸 v2: 종이 · 숲 · 금빛 한 점. 상자를 줄이고, 글과 여백으로 ══ */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f6f2;--surface:#ffffff;--surface2:#ecece6;--ink:#17201c;--muted:#6c726d;--line:#e2e2da;--pine:#003128;--pine-ink:#ffffff;--pine-soft:#e3ece7;--gold:#b98a2b;--shadow:none}}
:root[data-theme="light"]{--bg:#f6f6f2;--surface:#ffffff;--surface2:#ecece6;--ink:#17201c;--muted:#6c726d;--line:#e2e2da;--pine:#003128;--pine-ink:#ffffff;--pine-soft:#e3ece7;--gold:#b98a2b;--shadow:none}
:root{--gold:#d9b45b}
body{font-size:15.5px;line-height:1.6;letter-spacing:-.005em}
header.top{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:none;backdrop-filter:none}
.bar{padding:12px 20px}main{padding:26px 20px 96px;gap:20px}nav.tabs,.row2{padding-left:20px;padding-right:20px}
nav.tabs button{padding:11px 12px;font-weight:600;border-bottom-width:2px;color:var(--muted);transition:color .15s}nav.tabs button:hover{color:var(--ink)}nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pine)}
.mode{background:var(--surface2);padding:3px}.mode button{padding:7px 18px;transition:background .18s,color .18s}body .mode button[aria-pressed="true"]{background:var(--pine);color:#fff}
body .brchip{border-color:transparent;background:var(--surface2);padding:6px 14px}body .brchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{margin:4px 0 20px}body .hero h2{font:800 clamp(30px,4.6vw,44px)/1.14 "Pretendard",sans-serif;letter-spacing:-.03em}
body .sec{margin-top:10px}body .sec h2{font:700 19px/1.3 "Pretendard",sans-serif;letter-spacing:-.015em}
body .card{border:0;box-shadow:none;border-radius:3px;padding:22px}body .card>h3{font:700 16.5px/1.3 "Pretendard",sans-serif;margin-bottom:12px}
body .btn{border-radius:3px;padding:10px 16px;font-weight:600;border-color:var(--line);background:var(--surface);transition:background .12s,border-color .12s,transform .06s}body .btn:hover{border-color:var(--ink)}body .btn:active{transform:scale(.98)}
body .btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}body .btn.pri:hover{background:#064436;border-color:#064436}body .btn.sm{padding:6px 12px;border-radius:3px;font-size:13.5px}body .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
body .homeb{border-color:transparent;background:var(--surface2);border-radius:3px;padding:7px 13px}
body .chip{border-color:transparent;background:var(--surface2);padding:6px 13px;font-size:14px;transition:background .12s}body .chip[aria-pressed="true"]{background:var(--pine);color:#fff;border-color:var(--pine)}
body .subnav{background:var(--surface2)}body .subnav button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.li{padding:13px 0;border-bottom-color:var(--line)}.note{font-size:13px;color:var(--muted)}
.pill{padding:2px 10px;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border-radius:3px;padding:11px 13px;border-color:var(--line);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pine);box-shadow:0 0 0 3px color-mix(in srgb,var(--pine) 16%,transparent)}
/* 한 줄 입력: 상자가 아니라 밑줄 위에 적는다 — 이 앱의 얼굴 */
body .card.qadd{background:none;padding:2px 0 0;border-radius:0}
body .qadd .qrow{gap:10px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:8px;transition:border-color .15s}body .qadd .qrow:focus-within{border-bottom-color:var(--pine)}
body .qadd .qrow input{border:0;background:none;border-radius:0;padding:8px 2px;font-size:clamp(18px,2.4vw,23px);font-weight:500;letter-spacing:-.015em;box-shadow:none;outline:0}body .qadd .qrow input::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent);font-weight:400}
body .qadd .qrow .btn,body .qadd .qrow label.btn{border-radius:3px;padding:9px 16px}body .qadd small{margin-top:10px}
body .tkr{border-bottom:0}body .tkf .tkr input{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:12px 13px;font-size:16px}
details.fold{border-top:1px solid var(--line)}
.tabs .tg{color:var(--gold);font-weight:700}
body.vm{background:#dedfd8}
/* ══ 모바일 다이얼 ══ */
.dialw{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,430px);z-index:40;padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,transparent,var(--bg) 34%);pointer-events:none}
body:not(.vm) .dialw{width:100%}

.gbarx input[type=text]:focus{outline:0;box-shadow:none}.gbarx input::placeholder{color:var(--muted);opacity:.75}

/* 보관함 */
.mkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;margin-bottom:18px}
.mki{display:grid;gap:8px;align-content:start}.mkt{border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer;display:block}.mkt svg{display:block;width:100%;height:auto}.mkt:hover{border-color:var(--ink)}

/* 매출: 자세한 것은 접어 둔다 */
.anaf{margin-top:26px;border-top:1px solid var(--ink)}.anaf>summary{cursor:pointer;padding:16px 0;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between}.anaf>summary::after{content:"+";font-weight:400;font-size:20px;line-height:1}.anaf[open]>summary::after{content:"–"}.anaf>summary::-webkit-details-marker{display:none}.anaf>*+*{margin-top:18px}
/* 글씨: 가장 작은 글씨도 13px, 흐린 글씨는 한 단계 진하게 */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--muted:#5d5d57}}:root[data-theme="light"]{--muted:#5d5d57}
main small,main .note,main .pill,main th{font-size:max(13px,1em)}
main small,main .note{font-size:13px;line-height:1.55}main .pill{font-size:12.5px}
.card h3{margin-bottom:12px}.card>*+h3{margin-top:22px}

/* 곳 고르기: 한 줄, 글자만 */

.row2.places .brchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media(min-width:900px){body:not(.dialon) header.top .row2.places{order:1;padding:0;margin:16px 18px 0!important}body:not(.dialon) nav.tabs{order:2}}
body.dialon .row2.places{margin:10px 20px 14px!important}body.dialon .row2.places .brchip{flex:1 1 16.6%;font-size:13.5px!important;padding:9px 2px!important}

/* 다른 지점 큐레이션 */
.pks{margin-top:44px;padding-top:22px;border-top:1px solid var(--ink)}.pkc{margin-bottom:8px}
.pkl{border-top:1px solid var(--line)}.pkr{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.pkr>div{flex:1;min-width:0}.pkr b{font-size:17px;letter-spacing:-.01em}.pkr p{margin:3px 0 4px;font-size:14.5px}.pkr small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pkr .btn{flex:0 0 auto}
@media(max-width:720px){.pkr{flex-wrap:wrap}.pkr>div{flex:1 1 100%}.pkr small{white-space:normal}}body.vm .pkr{flex-wrap:wrap}body.vm .pkr>div{flex:1 1 100%}body.vm .pkr small{white-space:normal}

.menu .mrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}.menu .mrow3 button{text-align:center;border:1px solid var(--line);padding:8px 4px;font-size:13.5px}

/* 가이드: 화면 안내 / 서점 기초 */
.gdtab{display:flex;justify-self:center;border:1px solid rgba(242,238,227,.5);margin:2px 0 10px}.gdtab button{border:0;background:none;color:#f2eee3;padding:8px 18px;font:600 14.5px "Pretendard",sans-serif}.gdtab button[aria-pressed="true"]{background:#f2eee3;color:#003128}

.bsnav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 4px;border-top:2px solid #1c1c1a}.bsnav button{border:1px solid #c9c6ba;background:none;padding:6px 11px;font:600 13.5px "Pretendard",sans-serif;color:#1c1c1a;border-radius:2px}

.bsf{display:flex;align-items:stretch;gap:0;margin:18px 0 6px}.bsf span{flex:1;border:1px solid #1c1c1a;padding:16px 8px;text-align:center;font:700 16px "Pretendard",sans-serif;display:grid;align-content:center}.bsf span.on{background:#003128;color:#f2eee3;border-color:#003128}.bsf span small{display:block;font:500 12.5px "Pretendard",sans-serif;opacity:.8;margin-top:2px}

.bsn{display:grid;gap:18px;margin:16px 0 8px}.bsg>b{display:block;font:700 13.5px "Pretendard",sans-serif;color:#6a6a64;margin-bottom:6px}
.bsc{display:flex;flex-wrap:wrap;border:1px solid #1c1c1a}.bsc>div{flex:1 1 110px;padding:12px 10px 12px;border-right:1px solid #d9d6ca;border-bottom:1px solid #d9d6ca;margin:0 -1px -1px 0}.bsc code{display:block;font:800 24px/1.1 "Pretendard",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#003128}.bsc em{display:block;font:700 13.5px "Pretendard",sans-serif;font-style:normal;margin:6px 0 2px}.bsc small{display:block;font-size:13px;line-height:1.5;color:#55554f}
@media(max-width:600px){.bsd>div{grid-template-columns:1fr;gap:3px}.bsf{flex-direction:column}.bsf i{flex:0 0 40px;padding:0}.bsf i::after,.bsf i::before{display:none}}

/* 큐레이션 카드 버튼: 큰 것 하나, 작은 것 셋 */

/* ══ v5: 흰 종이, 굵은 먹줄, 색은 책이 맡는다. 상자 대신 굵은 윗줄 하나 ══ */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#fcfcfa;--surface:#ffffff;--surface2:#efeee9;--ink:#111111;--muted:#5a5a55;--line:#deddd6}}
:root[data-theme="light"]{--bg:#fcfcfa;--surface:#ffffff;--surface2:#efeee9;--ink:#111111;--muted:#5a5a55;--line:#deddd6}
body .card{border:0;border-top:3px solid var(--ink);background:none;padding:16px 0 6px;border-radius:0}
body .card.kpi,body .kpi.card{border-top-width:3px}
body .card.empty{border-top:1px solid var(--line);color:var(--muted);padding:28px 0}
body .card.todo .li,body .card .li{border-color:var(--line)}
body .hero{border-bottom:0;margin:6px 0 26px;padding:0}

body .hero h2{font-size:clamp(36px,5.2vw,60px);font-weight:800;letter-spacing:-.045em;line-height:1.04}
body .sec{margin-top:44px}body .sec h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.gbarx{border-bottom-width:3px;margin-bottom:34px}
body .subnav{border-bottom:0;gap:0;margin-bottom:22px}body .subnav button{font-size:15.5px;padding:6px 0;margin-right:22px;border-bottom:3px solid transparent}body .subnav button[aria-pressed="true"]{border-bottom-color:var(--ink)}
@media(min-width:900px){body:not(.dialon) header.top{border-right:3px solid var(--ink);background:var(--bg)}body:not(.dialon) nav.tabs::after{border-top-width:3px}}
body .btn{border-width:1.5px}
.hpd{background:none;border-left:3px solid var(--ink);padding:2px 0 2px 14px}
.pks{border-top:3px solid var(--ink)}
.anaf{border-top:3px solid var(--ink)}

/* 면진열 벽 */

.cv{display:grid;grid-template-rows:auto 1fr auto;aspect-ratio:3/4;padding:0;border:0;background:#fff;color:#111;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1.5px #111;transition:transform .18s cubic-bezier(.2,.8,.2,1);font:inherit;overflow:hidden;border-radius:0}

@media(max-width:720px){.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}.cvt i{font-size:26px}.cvm b{font-size:19px}.cvm small{-webkit-line-clamp:2;font-size:13px}.cvt,.cvm,.cvb{padding-left:12px;padding-right:12px}}
body.vm .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}body.vm .cvt i{font-size:26px}body.vm .cvm b{font-size:19px}body.vm .cvm small{-webkit-line-clamp:2}

/* 버튼 줄이기: 머리줄은 로고(=처음으로)와 곳 고르기만. 가이드 · 화면 전환은 작은 글씨로 */
.railf{display:flex;gap:14px;padding:18px 18px 0}.railf button{border:0;background:none;padding:0;font:500 13px "Pretendard",sans-serif;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}.railf button:hover{color:var(--ink)}

/* 한 줄 입력: 글자 버튼 대신 그림 셋 */
.gbarx{gap:2px}.gbarx .gi{flex:0 0 auto;display:grid;place-items:center;width:42px;height:42px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%;padding:0}.gbarx .gi:hover{color:var(--ink)}.gbarx .gi[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gbarx .gi.go{color:var(--ink)}.gbarx:has(#gIn:not(:placeholder-shown)) .gi.go{background:var(--pine);color:#fff}

/* 큐레이션: 갈래는 색 네모가 붙은 작은 글씨 */

/* ══ 잠금 화면 v3: 표지 한 장. 위 초록 띠에 날짜, 가운데 흰 종이에 숫자판, 아래 금색 띠 ══ */
#lock{background:#fcfcfa;color:#111;padding:0;display:block}

#lock .lk{max-width:none;height:100%;margin:0;padding:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;gap:0;align-content:stretch;align-items:stretch}

#lock .lkl img{grid-column:1;height:24px;width:auto}

#lock .pad button:hover{background:#efeee9;border-color:#111}#lock .pad button:active{background:#111;color:#fcfcfa;transform:none}

@media(max-height:640px){#lock .pad{grid-template-columns:repeat(3,84px)}#lock .pad button,#lock .pad span{height:48px;width:auto}#lock .lkd{margin-top:10px}#lock .lkd b{font-size:54px}}

/* 휴대폰 다이얼 = 선반에 꽂힌 책등. 컴퓨터의 책 쌓기와 같은 색. 고른 책이 위로 뽑힌다 */
.dial button{--bk:#003128;--bt:#f2eee3}
.dial button:nth-of-type(7n+2){--bk:#c9a24a;--bt:#1c1c1a}.dial button:nth-of-type(7n+3){--bk:#1f6b57}.dial button:nth-of-type(7n+4){--bk:#ece5d3;--bt:#1c1c1a}.dial button:nth-of-type(7n+5){--bk:#7d3a2b}.dial button:nth-of-type(7n+6){--bk:#12493b}.dial button:nth-of-type(7n+7){--bk:#2b2b28}
.dialw{border-bottom:3px solid var(--ink)}
.dial{align-items:flex-end;gap:0;height:66px;padding-top:0;background:none}
.dial button{background:var(--bk);color:var(--bt)!important;height:40px;padding:0 15px;font:700 15.5px/40px "Pretendard",sans-serif;letter-spacing:-.01em;border-radius:0;box-shadow:inset 7px 0 0 rgba(0,0,0,.14),inset 9px 0 0 rgba(255,255,255,.16),inset -5px 0 0 rgba(0,0,0,.1);transform:none!important;opacity:.8!important;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s;margin:0}
.dial button:nth-of-type(3n+2){height:34px;line-height:34px}.dial button:nth-of-type(4n){height:46px;line-height:46px}
.dial button.on{opacity:1!important;transform:translateY(-10px)!important;font-weight:800}
.dialm{width:0;height:0;background:none;border:6px solid transparent;border-bottom:8px solid var(--ink);border-top:0;margin-left:-6px;bottom:0;top:auto}
body.dialon #app{padding-top:calc(69px + env(safe-area-inset-top))}

/* 오늘의 소식 한 줄 */

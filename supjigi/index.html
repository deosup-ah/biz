}

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9a78e0; --s6:#d9649c; --shadow:none;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111815; --surface:#19221d; --surface2:#222d27; --ink:#e9efe9; --muted:#9fb0a5; --line:#2f3c35;
  --pine:#4fb787; --pine-ink:#0c1511; --pine-soft:#1f3a2e;
  --warn:#e2a53a; --warn-soft:#3a2f17; --crit:#ec7c6c; --crit-soft:#40211c; --ok:#58c08f; --info:#7fb2e0; --info-soft:#1c2c3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#9a78e0; --s6:#d9649c; --shadow:none;}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-text-size-adjust:100%}

button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--pine)}

/* 잠금 */
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:16px}
.lockbox{width:min(320px,100%);display:grid;gap:18px;justify-items:center}

.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pine)}.dots i.on{background:var(--pine)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pad button{height:58px;border-radius:3px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.pad button:active{background:var(--pine-soft)}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 머리 */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}

.mode button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 12px;font-size:13px;color:var(--muted)}

nav.tabs button .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:3px;background:var(--crit);color:#fff;font-size:12px;line-height:18px}

.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.card>h3 small{font:400 12.5px var(--body);color:var(--muted)}
.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.sec h2{font-size:22px}.sec p{margin:0;color:var(--muted)}
.kpi span{display:block;color:var(--muted);font-size:13px}.kpi b{font-size:25px;font-family:var(--display)}.kpi small{display:block;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--crit)}

.btn:hover{border-color:var(--pine)}.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}.btn.sm{padding:4px 10px;font-size:13px}.btn.ghost{border-color:transparent;color:var(--pine)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip[aria-pressed="true"]{background:var(--pine-soft);border-color:var(--pine);color:var(--pine);font-weight:600}
.tw{overflow-x:auto}

textarea{resize:vertical}
.form{display:grid;gap:12px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 시트 */
#sheet{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}

/* 공간 */
.planwrap{background:var(--surface2);border-radius:var(--r);overflow:auto;touch-action:none}

.fx{cursor:grab}.fx.sel rect,.fx.sel circle{stroke:var(--pine);stroke-width:3}
/* 디자인 */
.stage{background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/18px 18px;border-radius:var(--r);padding:18px;display:grid;place-items:center;overflow:auto}

.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}.sw[aria-pressed="true"]{outline:3px solid var(--pine);outline-offset:2px}

/* 보관함 */

@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--muted:#5d5d57}}:root[data-theme="light"]{--muted:#5d5d57}

@media(min-width:900px){body:not(.dialon) header.top .row2.places{order:1;padding:0;margin:16px 18px 0!important}body:not(.dialon) nav.tabs{order:2}}
body.dialon .row2.places{margin:10px 20px 14px!important}body.dialon .row2.places .brchip{flex:1 1 16.6%;font-size:14px!important;padding:9px 2px!important}

.pkl{border-top:1px solid var(--line)}.pkr{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.pkr>div{flex:1;min-width:0}.pkr b{font-size:18px;letter-spacing:-.01em}.pkr p{margin:3px 0 4px;font-size:14px}.pkr small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pkr .btn{flex:0 0 auto}
@media(max-width:720px){.pkr{flex-wrap:wrap}.pkr>div{flex:1 1 100%}.pkr small{white-space:normal}}body.vm .pkr{flex-wrap:wrap}body.vm .pkr>div{flex:1 1 100%}body.vm .pkr small{white-space:normal}

.menu .mrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}.menu .mrow3 button{text-align:center;border:1px solid var(--line);padding:8px 4px;font-size:14px}

/* 가이드: 화면 안내 / 서점 기초 */
.gdtab{display:flex;justify-self:center;border:1px solid rgba(242,238,227,.5);margin:2px 0 10px}.gdtab button{border:0;background:none;color:#f2eee3;padding:8px 18px;font:600 14.5px "Pretendard",sans-serif}.gdtab button[aria-pressed="true"]{background:#f2eee3;color:#003128}

.bsn{display:grid;gap:18px;margin:16px 0 8px}.bsg>b{display:block;font:700 13.5px "Pretendard",sans-serif;color:#6a6a64;margin-bottom:6px}
.bsc{display:flex;flex-wrap:wrap;border:1px solid #1c1c1a}.bsc>div{flex:1 1 110px;padding:12px 10px 12px;border-right:1px solid #d9d6ca;border-bottom:1px solid #d9d6ca;margin:0 -1px -1px 0}.bsc code{display:block;font:800 24px/1.1 "Pretendard",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#003128}.bsc em{display:block;font:700 13.5px "Pretendard",sans-serif;font-style:normal;margin:6px 0 2px}.bsc small{display:block;font-size:13px;line-height:1.5;color:#55554f}
@media(max-width:600px){.bsd>div{grid-template-columns:1fr;gap:3px}.bsf{flex-direction:column}.bsf i{flex:0 0 40px;padding:0}.bsf i::after,.bsf i::before{display:none}}

/* 큐레이션 카드 버튼: 큰 것 하나, 작은 것 셋 */

/* ══ v5: 흰 종이, 굵은 먹줄, 색은 책이 맡는다. 상자 대신 굵은 윗줄 하나 ══ */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#fcfcfa;--surface:#ffffff;--surface2:#efeee9;--ink:#111111;--muted:#5a5a55;--line:#deddd6}}
:root[data-theme="light"]{--bg:#fcfcfa;--surface:#ffffff;--surface2:#efeee9;--ink:#111111;--muted:#5a5a55;--line:#deddd6}
body .card{border:0;border-top:3px solid var(--ink);background:none;padding:16px 0 6px;border-radius:0}

body .card.empty{border-top:1px solid var(--line);color:var(--muted);padding:28px 0}

body .subnav{border-bottom:0;gap:0;margin-bottom:22px}body .subnav button{font-size:16px;padding:6px 0;margin-right:22px;border-bottom:3px solid transparent}body .subnav button[aria-pressed="true"]{border-bottom-color:var(--ink)}
@media(min-width:900px){body:not(.dialon) header.top{border-right:3px solid var(--ink);background:var(--bg)}body:not(.dialon) nav.tabs::after{border-top-width:3px}}
body .btn{border-width:1.5px}
.hpd{background:none;border-left:3px solid var(--ink);padding:2px 0 2px 14px}

body.vm .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}body.vm .cvt i{font-size:28px}body.vm .cvm b{font-size:20px}body.vm .cvm small{-webkit-line-clamp:2}

/* 버튼 줄이기: 머리줄은 로고(=처음으로)와 곳 고르기만. 가이드 · 화면 전환은 작은 글씨로 */

.gbarx{gap:2px}.gbarx .gi{flex:0 0 auto;display:grid;place-items:center;width:42px;height:42px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%;padding:0}.gbarx .gi:hover{color:var(--ink)}.gbarx .gi[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ══ 잠금 화면 v3: 표지 한 장. 위 초록 띠에 날짜, 가운데 흰 종이에 숫자판, 아래 금색 띠 ══ */
#lock{background:#fcfcfa;color:#111;padding:0;display:block}

#lock .pad button:hover{background:#efeee9;border-color:#111}#lock .pad button:active{background:#111;color:#fcfcfa;transform:none}

/* 휴대폰 다이얼 = 선반에 꽂힌 책등. 컴퓨터의 책 쌓기와 같은 색. 고른 책이 위로 뽑힌다 */
.dial button{--bk:#003128;--bt:#f2eee3}
.dial button:nth-of-type(7n+2){--bk:#c9a24a;--bt:#1c1c1a}.dial button:nth-of-type(7n+3){--bk:#1f6b57}.dial button:nth-of-type(7n+4){--bk:#ece5d3;--bt:#1c1c1a}.dial button:nth-of-type(7n+5){--bk:#7d3a2b}.dial button:nth-of-type(7n+6){--bk:#12493b}.dial button:nth-of-type(7n+7){--bk:#2b2b28}
.dialw{border-bottom:3px solid var(--ink)}
.dial{align-items:flex-end;gap:0;height:66px;padding-top:0;background:none}
.dial button{background:var(--bk);color:var(--bt)!important;height:40px;padding:0 15px;font:700 15.5px/40px "Pretendard",sans-serif;letter-spacing:-.01em;border-radius:0;box-shadow:inset 7px 0 0 rgba(0,0,0,.14),inset 9px 0 0 rgba(255,255,255,.16),inset -5px 0 0 rgba(0,0,0,.1);transform:none!important;opacity:.8!important;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s;margin:0}
.dial button:nth-of-type(3n+2){height:34px;line-height:34px}.dial button:nth-of-type(4n){height:46px;line-height:46px}
.dial button.on{opacity:1!important;transform:translateY(-10px)!important;font-weight:800}

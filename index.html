<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>더숲 단체 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d4636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="더숲 일정">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first app — sticky top bar, one column of sections, fixed bottom tab bar; sheets slide up for detail and input. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --sunk:#e9ece4; --line:#d9ded3; --line-2:#c6cdbf;
  --ink:#17201b; --mute:#5b665f; --faint:#8a948c;
  --pine:#1d4636; --pine-2:#2e6a52; --pine-soft:#dfeae3; --on-pine:#ffffff;
  --hi:#b23a2f; --hi-soft:#f8e3e0; --mid:#a86a12; --mid-soft:#f7ecd9; --ok:#2e7d55; --ok-soft:#e0f0e6; --info:#2d5d89; --info-soft:#e2ebf4;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-disp:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --sunk:#141a17; --line:#2b352f; --line-2:#3a463f;
  --ink:#e8eee9; --mute:#a3afa7; --faint:#77837b;
  --pine:#6fbf98; --pine-2:#8fd3b0; --pine-soft:#20352b; --on-pine:#0e1a14;
  --hi:#f08a7e; --hi-soft:#3a201d; --mid:#e2b25c; --mid-soft:#352a17; --ok:#7fcfa2; --ok-soft:#1b3326; --info:#8db8e3; --info-soft:#1b2a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --sunk:#141a17; --line:#2b352f; --line-2:#3a463f;
  --ink:#e8eee9; --mute:#a3afa7; --faint:#77837b;
  --pine:#6fbf98; --pine-2:#8fd3b0; --pine-soft:#20352b; --on-pine:#0e1a14;
  --hi:#f08a7e; --hi-soft:#3a201d; --mid:#e2b25c; --mid-soft:#352a17; --ok:#7fcfa2; --ok-soft:#1b3326; --info:#8db8e3; --info-soft:#1b2a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--pine)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pine-2);outline-offset:2px;border-radius:8px}
a{color:var(--pine)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pine);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#16302a}}
:root[data-theme="dark"] .top{background:#16302a}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font:700 18px/1 var(--f-disp);letter-spacing:-.3px;white-space:nowrap}
.brand img{width:28px;height:28px}
.fresh{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:#d8e8de;min-width:0}
.fresh b{color:#fff;font-weight:600}
.fresh.stale b{color:#ffd28a}
.fresh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.ibtn:active{background:rgba(255,255,255,.22)}
.ibtn svg{width:20px;height:20px}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--faint);text-align:center;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pine)}
.tab[aria-current="page"] b{font-weight:700}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--hi);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* sections */
main{padding-top:14px}
.view{display:grid;gap:18px}
.sec{display:grid;gap:8px}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{margin:0;font:700 17px/1.3 var(--f-disp);letter-spacing:-.2px}
.sec-h .cnt{color:var(--mute);font-size:13px}
.sec-h .more{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--pine);padding:4px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:18px;color:var(--mute);text-align:center;font-size:14px}
.note{color:var(--mute);font-size:12.5px;margin:0}

/* today hero */
.dayline{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dayline h1{margin:0;font:700 26px/1.15 var(--f-disp);letter-spacing:-.6px}
.dayline .wx{color:var(--mute);font-size:14px;padding-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:2px}
.stat span{font-size:12.5px;color:var(--mute)}
.stat b{font:700 22px/1.1 var(--f-disp)}
.stat.alert b{color:var(--hi)}
.stat small{font-size:11.5px;color:var(--faint)}

/* group card */
.g{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px;width:100%;border-bottom:1px solid var(--line)}
.g:last-child{border-bottom:0}
.g:active{background:var(--sunk)}
.dt{width:46px;text-align:center;border-radius:10px;background:var(--sunk);padding:6px 0 5px;line-height:1.1}
.dt .m{display:block;font-size:11px;color:var(--mute)}
.dt .d{display:block;font:700 20px/1.1 var(--f-disp)}
.dt .w{display:block;font-size:11px;color:var(--mute)}
.dt.now{background:var(--pine);color:var(--on-pine)}
.dt.now .m,.dt.now .w{color:inherit;opacity:.85}
.dt.none .d{font-size:13px;padding:6px 0}
.g .body{min-width:0;display:grid;gap:4px}
.g .nm{font-weight:700;font-size:16px;line-height:1.3;word-break:keep-all}
.g .nm small{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:5px}
.g .sub{font-size:13px;color:var(--mute);word-break:keep-all}
.g .flags{display:flex;flex-wrap:wrap;gap:4px}
.g .side{display:grid;justify-items:end;gap:6px}
.pax{display:inline-block;background:var(--pine);color:var(--on-pine);font-weight:700;font-size:12.5px;border-radius:6px;padding:1px 7px;line-height:1.5;white-space:nowrap}
.own{display:inline-block;background:var(--hi);color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px;line-height:1.5;white-space:nowrap}
.own.none{background:var(--sunk);color:var(--mute)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--sunk);color:var(--mute)}
.p-conf{background:var(--ok-soft);color:var(--ok)}
.p-hold{background:var(--mid-soft);color:var(--mid)}
.p-mix{background:var(--info-soft);color:var(--info)}
.p-quote{background:var(--sunk);color:var(--mute)}
.p-done{background:var(--sunk);color:var(--faint)}
.dd{font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.dd.now{color:var(--pine)}
.flag{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--sunk);color:var(--mute)}
.flag.hi{background:var(--hi-soft);color:var(--hi)}
.flag.mid{background:var(--mid-soft);color:var(--mid)}
.flag.money{background:var(--info-soft);color:var(--info)}

/* today big card */
.tg{padding:14px;display:grid;gap:10px;width:100%;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tg .nm{font:700 18px/1.3 var(--f-disp);letter-spacing:-.3px;word-break:keep-all}
.tg .slots{display:grid;gap:4px}
.slot{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px}
.slot .t{font-weight:700;color:var(--pine);font-variant-numeric:tabular-nums}
.slot .s{color:var(--ink);word-break:keep-all}
.hold-tag{font-size:11px;font-weight:700;color:var(--mid);margin-left:4px}

/* timeline */
.tl{padding:12px 14px;display:grid;gap:7px;overflow-x:auto}
.tl-axis,.tl-row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;min-width:420px}
.tl-axis .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}
.tl-row .sp{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:26px;background:var(--sunk);border-radius:6px}
.bar{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--pine);color:var(--on-pine);font-size:11.5px;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.bar.hold{background:var(--mid);color:#fff}
.nowline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--hi);border-radius:1px}

/* actions */
.act{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 0;width:100%;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act i{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line-2)}
.act.hi i{background:var(--hi)}
.act.mid i{background:var(--mid)}
.act .t{font-weight:700;font-size:14.5px;display:block;word-break:keep-all}
.act .w{font-size:12.5px;color:var(--mute);display:block}
.okline{padding:16px;color:var(--ok);font-weight:600;font-size:14px}

/* week list */
.wkday{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.wkday:last-child{border-bottom:0}
.wkday .h{font-weight:700;font-size:14px;line-height:1.25}
.wkday .h small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.wkday.sun .h{color:var(--hi)}
.wkday.sat .h{color:var(--info)}
.wkday .items{display:grid;gap:4px;min-width:0}
.wkday .it{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;text-align:left}
.wkday .it b{font-weight:600}
.wkday .none{color:var(--faint);font-size:13px}

/* controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{text-align:center;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip b{margin-left:5px;color:var(--mute);font-weight:700}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:inherit;padding:11px 0;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line);background:var(--surface);text-align:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.grp{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mute);padding:6px 2px 0}

/* calendar */
.cal{padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}
.cal-h b{font:700 17px var(--f-disp)}
.cal-h button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-size:18px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-g .wh{font-size:11.5px;text-align:center;color:var(--mute);padding:2px 0}
.cd{min-height:64px;border-radius:8px;padding:4px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;overflow:hidden;text-align:left}
.cd.out{opacity:.35}
.cd.today{outline:2px solid var(--pine);outline-offset:-2px}
.cd.pick{background:var(--pine-soft)}
.cd .n{font-size:12px;font-weight:700}
.cd.sun .n{color:var(--hi)}
.cd.sat .n{color:var(--info)}
.cd .e{font-size:10.5px;line-height:1.25;background:var(--surface);border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .e.h{color:var(--mid)}
.cd .more{font-size:10px;color:var(--mute)}

/* space */
.sp-blk{padding:12px 14px;border-bottom:1px solid var(--line)}
.sp-blk:last-child{border-bottom:0}
.sp-blk h3{margin:0 0 6px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between}
.sp-blk h3 span{color:var(--mute);font-weight:500;font-size:12.5px}
.sp-it{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13.5px;padding:3px 0;width:100%}
.sp-it .d{font-weight:700;font-variant-numeric:tabular-nums}

/* money */
.mhero{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mhero span{display:block;font-size:12.5px;color:var(--mute)}
.mhero b{display:block;font:700 22px/1.25 var(--f-disp)}
.mhero .late b{color:var(--hi)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;width:100%;border-bottom:1px solid var(--line);align-items:center}
.mrow:last-child{border-bottom:0}
.mrow .n{font-weight:700;display:block}
.mrow .s{font-size:12.5px;color:var(--mute);display:block}
.mrow .a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mrow .a small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.mrow.late .a{color:var(--hi)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font:700 18px var(--f-disp)}
.monthnav button{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.stot{padding:16px;display:grid;gap:12px}
.stot .big{font:700 28px/1.1 var(--f-disp);letter-spacing:-.5px}
.stot .lab{font-size:12.5px;color:var(--mute)}
.dbar{display:grid;grid-template-columns:72px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.dbar .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.dbar .tr{display:flex}
.dbar .tr i{display:block;height:100%;background:var(--pine)}
.dbar .tr i.pp{background:var(--line-2)}
.mo{display:grid;grid-template-columns:64px 1fr 84px;gap:8px;align-items:center;padding:9px 14px;width:100%;border-bottom:1px solid var(--line);font-size:13.5px}
.mo:last-child{border-bottom:0}
.mo[aria-pressed="true"]{background:var(--pine-soft)}
.mo .tr{display:flex;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.mo .tr i{background:var(--pine)}.mo .tr i.pp{background:var(--line-2)}
.mo .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv2 span{display:block;font-size:12.5px;color:var(--mute)}.kv2 b{font:700 17px var(--f-disp)}
.up{color:var(--ok)}.dn{color:var(--hi)}
.dbar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);width:100%}
.srow:last-child{border-bottom:0}
.srow .dv{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.srow .t{min-width:0}
.srow .t b{display:block;font-size:14px;word-break:keep-all}
.srow .t small{display:block;font-size:12px;color:var(--mute)}
.srow .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.banner{padding:12px 14px;border-radius:12px;background:var(--info-soft);color:var(--info);font-size:13.5px;display:grid;gap:8px}
.banner b{color:inherit}
.banner.warn{background:var(--mid-soft);color:var(--mid)}

/* info */
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lk{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:14.5px;display:grid;gap:2px}
.lk small{font-weight:500;font-size:12px;color:var(--mute)}
.fac{padding:4px 14px}
.fac h3{margin:12px 0 4px;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fac h3 small{font-weight:500;color:var(--mute);font-size:11.5px;text-align:right}
.fr{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.fr b{display:block}
.fr small{color:var(--mute);font-size:12px}
.fr .p{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.fr .p em{font-style:normal;color:var(--mute);font-size:11.5px;margin-right:3px}
.rule{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.rule:last-child{border-bottom:0}
.rule span{color:var(--mute)}
.steps{margin:0;padding:12px 14px 12px 32px;display:grid;gap:6px;font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
.sh-top{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:6px}
.sh-bar{display:flex;align-items:center;gap:8px;padding-block:8px}
.sh-bar h2{margin:0;font:700 20px/1.3 var(--f-disp);letter-spacing:-.4px;flex:1;min-width:0;word-break:keep-all}
.xbtn{width:38px;height:38px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:18px;flex:none}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.fact span{display:block;font-size:12px;color:var(--mute)}
.fact b{font:700 17px/1.3 var(--f-disp)}
.fact.due b{color:var(--hi)}
.stages{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.stages i{height:6px;border-radius:3px;background:var(--line)}
.stages i.on{background:var(--pine-2)}
.stages i.cur{background:var(--pine)}
.stg-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.h4{font-size:13px;font-weight:700;color:var(--mute);margin:4px 2px -2px}
.al{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.al:last-child{border-bottom:0}
.al i{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--line-2)}
.al.hi i{background:var(--hi)}.al.mid i{background:var(--mid)}
.al b{display:block;font-size:14px}
.al small{display:block;color:var(--mute);font-size:12.5px}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.li:last-child{border-bottom:0}
.li small{display:block;color:var(--mute);font-size:12px}
.li .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.li.neg .a{color:var(--hi)}
.mtop{padding:14px 0;display:grid;gap:8px}
.mtop .big{font:700 24px var(--f-disp)}
.mbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.mleg{display:flex;justify-content:space-between;font-size:12.5px}
.mleg .p{color:var(--ok);font-weight:600}.mleg .d{color:var(--hi);font-weight:600}
.prog{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.prog span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--mute)}
.prog span.done{background:var(--ok-soft);color:var(--ok)}
.prog span.now{background:var(--pine);color:var(--on-pine);font-weight:700}
.hist .day{font-size:12px;font-weight:700;color:var(--mute);padding:10px 0 2px}
.hist .it{padding:6px 0 6px 10px;border-left:2px solid var(--line);margin-left:3px}
.hist .it.money{border-color:var(--info)}.hist .it.stage{border-color:var(--pine)}
.hist .t{font-weight:600;font-size:13.5px}
.hist .d{font-size:12.5px;color:var(--mute);word-break:break-all}
.hist .w{font-size:11.5px;color:var(--faint)}
.rooms-g{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:8px}
.rooms-g span{font-size:12px;padding:2px 7px;border-radius:5px;background:var(--sunk);font-variant-numeric:tabular-nums}
textarea.msg{width:100%;min-height:240px;border:1px solid var(--line);border-radius:10px;padding:10px;font:13.5px/1.6 var(--f-body);background:var(--bg);color:var(--ink);resize:vertical}
.chk{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;padding:10px 0}

/* form */
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px}
.fld label{font-size:13px;font-weight:700;color:var(--mute)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.fld .amt{font:700 22px var(--f-disp);text-align:right}
.divs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.divs button{padding:11px 4px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);text-align:center;font-weight:600;font-size:14px}
.divs button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:6px 10px;border-radius:8px;background:var(--sunk);font-size:13px;font-weight:600}
.err{color:var(--hi);font-size:13px;font-weight:600}
.confirm{padding:12px;border-radius:12px;background:var(--hi-soft);color:var(--hi);display:grid;gap:8px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){.g .nm{font-size:16.5px}.dayline h1{font-size:30px}}
@media (max-width:380px){.slot{grid-template-columns:84px 1fr}.stats .stat b{font-size:19px}.dbar{grid-template-columns:60px 1fr 80px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="logo.png" alt="">더숲 단체 일정</div>
  <div class="fresh" id="fresh"><span id="freshT">불러오는 중</span></div>
  <button class="ibtn" id="btnRefresh" aria-label="지금 업데이트" title="지금 업데이트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
</div></header>

<main class="wrap"><div id="view" class="view"></div></main>

<nav class="tabs" aria-label="메뉴"><div class="in">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><b>오늘</b></button>
  <button class="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><b>일정</b></button>
  <button class="tab" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="2.6"/><path d="M6 9.5h.01M18 15.5h.01"/></svg><b>돈</b></button>
  <button class="tab" data-tab="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5h.01"/></svg><b>안내</b></button>
</div></nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="grab"></div><div class="wrap" id="sheetIn"></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="sales.js"></script>
<script src="rev.js" onerror="void 0"></script>
<script>
"use strict";
/* ===== settings ===== */
const TRIGGER_ID="trig_01Y4ZUpeG1niG593SaxXABs6";
const ART_URL="https://claude.ai/artifact/3dtU9hamwcaPMCPMcVram1";
const PUB_URL="https://deosup-ah.github.io/biz/";
const DIVS=["대관","스테이","연수객실","다이닝","카페","베이커리","기타"];

/* ===== helpers ===== */
const WD="일월화수목금토";
let now=new Date(), TODAY=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let TODAY_S=ymd(TODAY);
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const diff=s=>Math.round((pd(s)-TODAY)/864e5);
const md=s=>{if(!/^\d{4}-\d{2}-\d{2}/.test(s||""))return String(s||"");const d=pd(s.slice(0,10));return `${d.getMonth()+1}/${d.getDate()}`};
const mdw=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const won=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("ko-KR");
const manwon=n=>{n=Number(n)||0;const a=Math.abs(n),s=n<0?"−":"";if(a>=1e8)return s+(a/1e8).toFixed(1).replace(/\.0$/,"")+"억";if(a>=1e4)return s+Math.round(a/1e4).toLocaleString("ko-KR")+"만";return s+won(a)};
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const STAGES=["문의","상담","가예약","견적","계약","확정","이용","정산","매출"];
const ST={conf:["확정","p-conf"],hold:["가예약","p-hold"],mix:["확정+가예약","p-mix"],quote:["견적 중","p-quote"]};
const ownName=o=>({"":"","SALES":"영업","KIM-YW":"김영우","JIN-IJ":"진인주"}[o]??o);
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2400)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("복사했습니다");return true}catch(e){return false}}

/* ===== data ===== */
let D={cases:[],asOf:""}, CASES=[];
function prep(){
  D=window.APP_DATA||{cases:[],asOf:""};
  now=new Date();TODAY=new Date(now.getFullYear(),now.getMonth(),now.getDate());TODAY_S=ymd(TODAY);
  CASES=(D.cases||[]).map((c0,i)=>{const c=JSON.parse(JSON.stringify(c0));
    c.id=c.no||("X"+i); c.sch=c.sch||[]; c.rooms=c.rooms||[]; c.al=(c.al||[]).map(a=>({lv:a[0],t:a[1],n:a[2]||""}));
    c.amt=c.amt||{}; c.hist=c.hist||[]; c.todo=c.todo||[]; c.own=ownName(c.owner||"");
    c.past=!!(c.e&&diff(c.e)<0) || !!(!c.e&&c.s&&diff(c.s)<0);
    if(c.hold&&(c.st==="hold"||c.st==="mix"||c.st==="quote")&&!c.past){const h=diff(c.hold),soon=c.s?diff(c.s):999;
      if(h<0)c.al.unshift({lv:soon<=14?"hi":"mid",t:`가예약 기한 지남 (${md(c.hold)})`,n:"연장하거나 자리를 풀어야 합니다"});
      else if(h===0)c.al.unshift({lv:"hi",t:"가예약 기한 오늘",n:"연장 · 확정 · 해제 중 결정"});
      else if(h<=3)c.al.unshift({lv:"mid",t:`가예약 기한 ${h}일 남음 (${md(c.hold)})`,n:""});}
    if(c.past)c.al.forEach(a=>{if(a.lv==="hi"&&!/입금/.test(a.t))a.lv="mid"});
    c.sev=c.al.some(a=>a.lv==="hi")?"hi":c.al.some(a=>a.lv==="mid")?"mid":"";
    c.spaces=[...new Set([...c.sch.map(s=>s[2]),...c.rooms.map(r=>"연수객실 "+r[2].length+"실")])];
    c.due=Number(c.amt.due)||0;c.final=Number(c.amt.final)||0;c.paid=Number(c.amt.paid)||0;
    c.late=c.al.some(a=>/입금 지연/.test(a.t));
    return c;});
}
const on=(c,ds)=>c.s&&c.s<=ds&&(c.e||c.s)>=ds;
const byDate=(a,b)=>(a.s||"9999").localeCompare(b.s||"9999")||a.name.localeCompare(b.name,"ko");
function dday(c){if(!c.s)return "날짜 미정";const a=diff(c.s),b=diff(c.e||c.s);if(b<0)return "끝남";if(a<=0)return "오늘";if(a===1)return "내일";return "D-"+a}
function stPill(c){if(c.past)return `<span class="pill p-done">끝남</span>`;const s=ST[c.st]||ST.quote;return `<span class="pill ${s[1]}">${s[0]}</span>`}
const ownTag=c=>c.own?`<span class="own">담당 ${esc(c.own)}</span>`:`<span class="own none">담당 없음</span>`;
const paxTag=c=>c.pax?`<span class="pax">${c.pax}명</span>`:"";
function parseAsOf(s){const m=(s||"").match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);if(!m)return null;let d=new Date(now.getFullYear(),+m[1]-1,+m[2],+m[3],+m[4]);if(d-now>864e5*30)d.setFullYear(d.getFullYear()-1);return d}
function ago(d){const m=Math.round((now-d)/6e4);if(m<1)return "방금";if(m<60)return m+"분 전";const h=Math.round(m/60);if(h<24)return h+"시간 전";return Math.round(h/24)+"일 전"}

/* ===== sales ===== */
let SALES=[], salesMode="snapshot", salesAsOf="", DB=null, USER=null, MCP=null, salesErr="";
function loadSnapshot(){const S=window.SALES_DATA||{rows:[],asOf:""};salesAsOf=S.asOf||"";if(salesMode==="snapshot")SALES=(S.rows||[]).slice()}

/* ===== state ===== */
let tab=LS.get("ds-tab","today"); if(!["today","plan","money","info"].includes(tab))tab="today";
let planView=LS.get("ds-plan","list"), filter="up", q="", dayPick=null, moneyView=LS.get("ds-money","due");
let calM=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
let sMonth=TODAY_S.slice(0,7);

/* ===== top bar ===== */
function paintFresh(){
  const d=parseAsOf(D.asOf);const el=$("fresh");
  el.classList.toggle("stale",!!d&&(now-d)>864e5*1.1);
  $("freshT").innerHTML=d?`<b>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</b> 기준 · ${ago(d)}`:"데이터 없음";
}

/* ===== TODAY ===== */
const WMO={0:"맑음",1:"대체로 맑음",2:"구름 조금",3:"흐림",45:"안개",48:"안개",51:"이슬비",53:"이슬비",55:"이슬비",61:"비",63:"비",65:"강한 비",71:"눈",73:"눈",75:"많은 눈",80:"소나기",81:"소나기",82:"강한 소나기",95:"뇌우"};
let WX=null;
async function loadWeather(){try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.66&longitude=127.0&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1");if(!r.ok)return;const j=await r.json();WX={t:j.current.temperature_2m,code:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0],pop:j.daily.precipitation_probability_max[0]};const el=$("wx");if(el)el.textContent=wxText()}catch(e){}}
const wxText=()=>WX?`수유동 ${WMO[WX.code]||""} ${Math.round(WX.t)}° · 최고 ${Math.round(WX.hi)}° 최저 ${Math.round(WX.lo)}°${WX.pop!=null?" · 비 "+WX.pop+"%":""}`:"";
function actions(){const L=CASES.filter(c=>c.late||(!c.past&&(!c.s||diff(c.s)<=45)));const a=[];L.forEach(c=>c.al.forEach(x=>{if(x.lv!=="lo")a.push({c,a:x})}));
  a.sort((x,y)=>(x.a.lv==="hi"?0:1)-(y.a.lv==="hi"?0:1)||((x.c.s?diff(x.c.s):999)-(y.c.s?diff(y.c.s):999)));return a}
function actRow({c,a}){return `<button class="act ${a.lv}" data-id="${esc(c.id)}"><i></i><span><span class="t">${esc(a.t)}</span><span class="w">${esc(c.name)}${a.n?" · "+esc(a.n):""}</span></span><span class="dd">${dday(c)}</span></button>`}
function slotsFor(c,ds){const out=c.sch.filter(s=>s[0]===ds).map(s=>`<div class="slot"><span class="t">${esc(s[1])}</span><span class="s">${esc(s[2])}${s[3]==="hold"?`<span class="hold-tag">가예약</span>`:""}</span></div>`);
  c.rooms.forEach(r=>out.push(`<div class="slot"><span class="t">숙박</span><span class="s">연수객실 ${r[2].length}실 · ${esc(r[1])}</span></div>`));return out.join("")}
function todayCard(c,ds){return `<button class="tg" data-id="${esc(c.id)}"><div class="row1"><span class="nm">${esc(c.name)}</span>${paxTag(c)}${stPill(c)}</div>
  <div class="slots">${slotsFor(c,ds)||`<div class="slot"><span class="t">—</span><span class="s">공간 미정</span></div>`}</div>
  <div class="row1">${ownTag(c)}${c.al.filter(a=>a.lv==="hi").slice(0,2).map(a=>`<span class="flag hi">${esc(a.t)}</span>`).join("")}${c.due>0?`<span class="flag money">받을 돈 ${manwon(c.due)}</span>`:""}</div></button>`}
function timeline(list,ds){
  const rows={};list.forEach(c=>c.sch.filter(s=>s[0]===ds).forEach(s=>(rows[s[2]]=rows[s[2]]||[]).push({c,s})));
  if(!Object.keys(rows).length)return "";
  const H0=7,H1=23,span=H1-H0,toH=t=>{const m=t.match(/(\d{1,2}):(\d{2})/);return m?+m[1]+(+m[2])/60:null};
  const nh=now.getHours()+now.getMinutes()/60;
  return `<div class="card tl"><div class="tl-axis"><span></span><div class="ticks">${[7,10,13,16,19,22].map(h=>`<span>${h}시</span>`).join("")}</div></div>`+
   Object.entries(rows).map(([sp,arr])=>`<div class="tl-row"><span class="sp">${esc(sp)}</span><div class="track">${arr.map(({c,s})=>{const m=s[1].match(/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})/);let a=H0,b=H1;if(m){a=toH(m[1]);b=toH(m[2]);if(b<=a)b=H1}
     const l=Math.max(0,(a-H0)/span*100),w=Math.max(5,(Math.min(b,H1)-Math.max(a,H0))/span*100);
     return `<button class="bar ${s[3]==="hold"?"hold":""}" data-id="${esc(c.id)}" style="left:${l}%;width:${w}%" title="${esc(c.name+" "+s[1])}">${esc(c.name)}</button>`}).join("")}${ds===TODAY_S&&nh>=H0&&nh<=H1?`<span class="nowline" style="left:${(nh-H0)/span*100}%"></span>`:""}</div></div>`).join("")+`</div>`;
}
function renderToday(){
  const todays=CASES.filter(c=>on(c,TODAY_S)).sort(byDate);
  const A=actions(), hiN=A.filter(x=>x.a.lv==="hi").length;
  const wk=CASES.filter(c=>c.s&&diff(c.e||c.s)>=0&&diff(c.s)<=6);
  const paxToday=todays.reduce((a,c)=>a+(c.pax||0),0);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(TODAY);d.setDate(d.getDate()+i+1);return d});
  return `
  <div class="sec"><div class="dayline"><h1>${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 ${WD[TODAY.getDay()]}요일</h1><span class="wx" id="wx">${esc(wxText())}</span></div></div>
  <div class="stats">

function readForm(){const f=sForm;f.amt=Number(($("sfAmt").value||"").replace(/[^\d-]/g,""))||0;f.date=$("sfDate").value||TODAY_S;f.memo=$("sfMemo").value.trim();
  const v=$("sfCase").value.trim();const c=CASES.find(c=>c.name===v||c.no===v);f.name=c?c.name:v;f.no=c?c.no:(/^GS-/.test(v)?v:"");return f}
async function saveSales(){const f=readForm();if(!f.amt){$("sfErr").textContent="금액을 넣어 주세요.";$("sfAmt").focus();return}
  if(!DB){$("sfErr").textContent="저장소에 연결되지 않았습니다. Claude 앱 링크에서 열어 주세요.";return}
  const btn=$("sfSave");btn.disabled=true;btn.textContent="저장 중…";
  const doc={date:f.date,div:f.div,amt:f.amt,no:f.no||"",name:f.name||"",memo:f.memo||"",at:new Date().toISOString()};
  try{ if(USER){try{doc.by=await USER.id()}catch(e){}}
    if(f.id)await DB.collection("sales").doc(f.id).set(doc);else await DB.collection("sales").add(doc);
    sMonth=f.date.slice(0,7);closeSheet();toast(f.id?"고쳤습니다":`저장했습니다 · ${won(f.amt)}원`);
  }catch(e){btn.disabled=false;btn.textContent="저장";$("sfErr").textContent=e&&(e.code==="not_granted"||e.code==="revoked")?"이 링크에서는 입력 권한이 없습니다. 링크 주인에게 편집 권한을 요청하세요.":"저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요."}}
async function delSales(){if(!DB||!sForm.id)return;try{await DB.collection("sales").doc(sForm.id).delete();closeSheet();toast("지웠습니다")}catch(e){$("sfErr").textContent="지우지 못했습니다. 잠시 뒤 다시 눌러 주세요."}}

     <button class="btn pri block" data-copymsg>안내문 복사</button>
     <p class="note">${msgKind==="guest"?"이 단체 정보만 들어갑니다. 내부 체크 · 이력은 빠집니다.":"금액은 빠집니다. 프론트 · F&B에 그대로 붙여 넣으세요."} 보내기 전에 위 칸에서 고칠 수 있습니다.</p>`}}
function buildMsg(c){const L=[];const when=c.s?(c.s===c.e||!c.e?mdw(c.s):`${mdw(c.s)} ~ ${mdw(c.e)}`):"일정 협의 중";
  const byDay={};c.sch.forEach(s=>(byDay[s[0]]=byDay[s[0]]||[]).push(s));const sched=Object.keys(byDay).sort().map(d=>`· ${mdw(d)} ${byDay[d].map(s=>`${s[2].replace(/ 통합$/,"")} ${s[1]}`).join(", ")}`);
  if(msgKind==="front"){L.push(`[현장 전달] ${c.name} (${c.no})`,`일정: ${when}${c.pax?` · ${c.pax}명`:""}${c.own?` · 담당 ${c.own}`:""}`);if(sched.length)L.push("","공간",...sched);
    c.rooms.forEach(r=>L.push("",`연수객실 ${r[2].length}실 (${r[1]}) 입실 16:00 · 퇴실 11:00`,r[2].join(", ")));
    const meal=(c.amt.items||[]).filter(r=>/식|조식|중식|석식|다이닝|커피|다과/.test(r[0]));if(meal.length)L.push("","식음",...meal.map(r=>`· ${r[0]} ${r[1]||""}${r[2]?" "+r[2]:""}`));if(c.memo)L.push("","메모: "+c.memo);return L.join("\n")}
  L.push("안녕하세요, 더숲 아카데미하우스입니다.",`${c.name} 이용 안내드립니다.`,"",`■ 일정  ${when}${c.pax?` · ${c.pax}명`:""}`);if(sched.length)L.push("■ 공간",...sched);
  c.rooms.forEach(r=>L.push(`■ 숙박  ${r[2].length}실 (${r[1]})`,"  입실 16:00 · 퇴실 11:00"));
  if(msgOpt.amt&&c.final){L.push("",`■ 이용 금액  ${won(c.final)}원 (부가세 포함)`);if(c.paid)L.push(`  받은 금액  ${won(c.paid)}원`);if(c.due>0){const np=(c.amt.pay||[]).find(p=>!/확인|입금/.test(p[4]||""));L.push(`  남은 금액  ${won(c.due)}원${np&&np[1]?` (${md(np[1])}까지)`:""}`)}}
  if(msgOpt.park)L.push("","■ 오시는 길  서울 강북구 4.19로 135 (수유동, 아카데미하우스)","■ 주차  이용금액 1만 원당 1시간, 최대 3시간 무료");
  L.push("","문의  02-904-0206 · biz@deosup.com","감사합니다.");return L.join("\n")}

/* ===== sheet ===== */
let sheetKind="";
function openSheet(html,kind){sheetKind=kind;$("sheetIn").innerHTML=html;$("sheet").scrollTop=0;$("sheet").classList.add("on");$("scrim").classList.add("on");document.body.style.overflow="hidden";
  if(kind==="detail"){try{history.replaceState(null,"","#"+cur.id)}catch(e){}}}
function closeSheet(){$("sheet").classList.remove("on");$("scrim").classList.remove("on");document.body.style.overflow="";if(sheetKind==="detail"){cur=null;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}sheetKind=""}

/* ===== render ===== */
function render(){
  document.querySelectorAll(".tab").forEach(b=>{b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false");b.querySelector(".badge")?.remove()});
  const hiN=actions().filter(x=>x.a.lv==="hi").length;if(hiN){const b=document.querySelector('.tab[data-tab="today"]');b.insertAdjacentHTML("beforeend",`<span class="badge">${hiN}</span>`)}
  $("view").innerHTML=tab==="today"?renderToday():tab==="plan"?renderPlan():tab==="money"?renderMoney():renderInfo();
  paintFresh();
}

/* ===== update buttons ===== */
let busy=false;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=()=>{s.remove();ok()};s.onerror=()=>{s.remove();no()};document.head.appendChild(s)})}
async function pullLatest(silent){
  const before=D.asOf;
  try{await loadScript("data.js?t="+Date.now());prep();try{await loadScript("sales.js?t="+Date.now())}catch(e){}loadSnapshot();render();if(cur){const c=CASES.find(x=>x.id===cur.id);if(c){cur=c;$("sheetIn").innerHTML=detailHTML();drawPane()}}
    if(!silent)toast(D.asOf!==before?"새 데이터로 바꿨습니다":"이미 최신 데이터입니다 · "+(parseAsOf(D.asOf)?ago(parseAsOf(D.asOf)):""));return true}
  catch(e){if(!silent)toast("불러오지 못했습니다. 인터넷 연결을 확인해 주세요");return false}}
async function runUpdate(){
  if(busy)return;busy=true;const b=$("btnRefresh");b.classList.add("spin");
  try{
    if(MCP){
      try{await MCP.callTool("Claude Code Remote","fire_trigger",{trigger_id:TRIGGER_ID,text:"화면의 「지금 업데이트」 버튼으로 실행됨."});
        LS.set("ds-fired",String(Date.now()));toast("업데이트를 시작했습니다 · 10~15분 뒤 저절로 바뀝니다");return}
      catch(e){const code=e&&e.code;
        if(code==="approval_required"||code==="not_granted"){toast("실행하려면 이 페이지에 권한을 허락해 주세요")}
        else if(code==="server_not_connected"||code==="needs_reauth"){toast("Claude Code Remote 연결이 필요합니다 (설정 → 커넥터)")}
        else if(code==="blocked_by_policy"){toast("이 계정에서는 업데이트 실행이 막혀 있습니다")}
        else if(code==="tool_error"){toast("업데이트 작업을 찾지 못했습니다. 관리자에게 알려 주세요")}
        else toast("업데이트 요청 결과를 확인하지 못했습니다. 10분 뒤 화면을 확인해 주세요");
        return}
    }
    await pullLatest(false);
  }finally{busy=false;b.classList.remove("spin")}
}

/* ===== events ===== */
document.addEventListener("click",async e=>{const t=e.target;
  if(t.closest("#btnRefresh")){runUpdate();return}
  if(t.closest("[data-close]")||t===$("scrim")){closeSheet();return}
  const tb=t.closest("[data-tab]");if(tb){tab=tb.dataset.tab;dayPick=null;LS.set("ds-tab",tab);render();window.scrollTo(0,0);return}
  const go=t.closest("[data-go]");if(go){const [tb2,f]=go.dataset.go.split(":");tab=tb2;planView="list";if(f){filter=f;dayPick=null}LS.set("ds-tab",tab);render();window.scrollTo(0,0);return}
  const sc=t.closest("[data-scroll]");if(sc){$(sc.dataset.scroll)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.closest("[data-allact]")){$("actList").innerHTML=actions().map(actRow).join("");t.closest("[data-allact]").remove();return}
  const pv=t.closest("[data-pv]");if(pv){planView=pv.dataset.pv;LS.set("ds-plan",planView);render();return}
  const f=t.closest("[data-f]");if(f){filter=f.dataset.f;dayPick=null;render();return}
  if(t.closest("[data-dayclear]")){dayPick=null;render();return}
  const cm=t.closest("[data-calm]");if(cm){calM=new Date(calM.getFullYear(),calM.getMonth()+(+cm.dataset.calm),1);render();return}
  const cd=t.closest("[data-calday]");if(cd){dayPick=dayPick===cd.dataset.calday?null:cd.dataset.calday;render();return}
  const rg=t.closest("[data-range]");if(rg){spaceRange=rg.dataset.range;LS.set("ds-space",spaceRange);render();return}
  const wc=t.closest("[data-wkcopy]");if(wc){const txt=wkText(+(wc.dataset.wkcopy||0));if(!await copyText(txt))toast("복사가 막혀 있습니다");return}
  const mv=t.closest("[data-mv]");if(mv){moneyView=mv.dataset.mv;LS.set("ds-money",moneyView);render();return}
  const ss=t.closest("[data-smset]");if(ss){sMonth=ss.dataset.smset;render();window.scrollTo(0,0);return}
  const sm=t.closest("[data-sm]");if(sm){sMonth=shiftMonth(sMonth,+sm.dataset.sm);render();return}
  if(t.closest("[data-salesadd]")){openSalesForm(null);return}
  const se=t.closest("[data-salesedit]");if(se){openSalesForm(se.dataset.salesedit);return}
  const dv=t.closest("[data-div]");if(dv){readForm();sForm.div=dv.dataset.div;document.querySelectorAll("[data-div]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.div===sForm.div));return}
  const aa=t.closest("[data-addamt]");if(aa){const el=$("sfAmt");const v=Number((el.value||"").replace(/[^\d]/g,""))||0;el.value=+aa.dataset.addamt?won(v+(+aa.dataset.addamt)):"";return}
  if(t.closest("[data-delask]")){readForm();sConfirmDel=true;$("sheetIn").innerHTML=salesFormHTML();return}
  if(t.closest("[data-delno]")){readForm();sConfirmDel=false;$("sheetIn").innerHTML=salesFormHTML();return}
  if(t.closest("[data-delyes]")){delSales();return}
  if(t.closest("[data-faccopy]")){if(!await copyText(facCopy()))toast("복사가 막혀 있습니다");return}
  if(t.closest("[data-copylink]")){if(!await copyText(PUB_URL))toast(PUB_URL);return}
  if(t.closest("[data-install]")&&installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render();return}
  const pn=t.closest("#sheetIn [data-pane]");if(pn){pane=pn.dataset.pane;drawPane();return}
  const k=t.closest("[data-kind]");if(k){msgKind=k.dataset.kind;drawPane();return}
  const cn=t.closest("[data-copyno]");if(cn){if(!await copyText(cn.dataset.copyno))toast(cn.dataset.copyno);return}
  if(t.closest("[data-copymsg]")){const ta=$("msg");if(!await copyText(ta.value)){ta.focus();ta.select();toast("선택했습니다 · 길게 눌러 복사하세요")}return}
  const card=t.closest("[data-id]");if(card){openDetail(card.dataset.id,card.dataset.pane);return}
});
document.addEventListener("submit",e=>{if(e.target.id==="sf"){e.preventDefault();saveSales()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.trim().toLowerCase();const pos=e.target.selectionStart;render();const n=$("q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  if(e.target.id==="sfAmt"){const v=e.target.value.replace(/[^\d]/g,"");e.target.value=v?won(+v):""}});
document.addEventListener("change",e=>{const id=e.target.id;if(id==="oAmt"||id==="oPark"){msgOpt[id==="oAmt"?"amt":"park"]=e.target.checked;$("msg").value=buildMsg(cur)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetKind)closeSheet()});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(tab==="info")render()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&/^https?:/.test(location.protocol)&&!window.claude){const d=parseAsOf(D.asOf);if(!d||Date.now()-d>3*36e5)pullLatest(true)}});

/* ===== boot ===== */
prep();loadSnapshot();render();loadWeather();
{const h=(location.hash||"").slice(1);if(h&&CASES.some(c=>c.id===h))openDetail(h)}
if("serviceWorker" in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
(async()=>{
  const cl=window.claude;if(!cl||typeof cl.use!=="function")return;
  try{
    const [db,user,mcp]=await Promise.all([cl.use("db").catch(()=>null),cl.use("user").catch(()=>null),cl.use("mcp").catch(()=>null)]);
    USER=user;MCP=mcp;if(tab==="info")render();
    if(db){DB=db;salesMode="live";let got=false;const timer=setTimeout(()=>{if(!got){salesErr="매출 기록을 불러오는 데 시간이 걸립니다. 잠시 뒤 다시 열어 주세요.";if(tab==="money")render()}},10000);
      db.collection("sales").onSnapshot(snap=>{got=true;clearTimeout(timer);salesErr="";SALES=snap.docs.map(d=>({id:d.id,...d.data()}));if(tab==="money"&&sheetKind!=="sales")render()},
        err=>{got=true;clearTimeout(timer);salesErr="매출 기록을 불러오지 못했습니다. 페이지를 다시 열어 주세요.";if(tab==="money")render()});
      if(tab==="money")render();}
  }catch(e){}
})();

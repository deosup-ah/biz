<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4a3b">
<meta name="robots" content="noindex,nofollow">
<title>더숲 단체 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 사유의숲: 칠판 같은 깊은 숲빛 초록 + 분필 흰 선 그림, 조용한 명조 제목.
   Layout: phone app shell (max 520px) — 앱 바 + 담당자 스위치, 탭 5개(홈·일정·할 일·수금·공간), 아래서 올라오는 상세 화면(요약·금액·이력·안내문) */
:root{
  --bg:#edf0eb; --surface:#fbfcfa; --surface-2:#f1f4ef; --line:#d9e0d8; --line-2:#c9d3c8;
  --fg:#17261f; --muted:#5b6b62; --faint:#8a978f;
  --brand:#1d4a3b; --brand-2:#2c6650; --brand-fg:#f4f6f1; --brand-soft:#dfe9e3; --chalk:#f4f6f1;
  --red:#c2392b; --red-soft:#fbeae7; --amber:#b16a0a; --amber-soft:#fbf0de; --blue:#2a5d9f; --blue-soft:#e6eef8;
  --ok:#1f7a45; --ok-soft:#e2f2e8; --gold:#a8822a; --gold-soft:#f7f0dc;
  --f-head:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --shadow:0 1px 0 rgba(23,38,31,.04),0 6px 18px -12px rgba(23,38,31,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1612; --surface:#14211b; --surface-2:#1a2a22; --line:#27392f; --line-2:#33493c;
  --fg:#e7eee9; --muted:#9aaba0; --faint:#6f8076;
  --brand:#1f4d3e; --brand-2:#2c6650; --brand-fg:#eef2ec; --brand-soft:#1d3326;
  --red:#ff7a6b; --red-soft:#3a1d19; --amber:#f0a947; --amber-soft:#382a14; --blue:#7fb0f0; --blue-soft:#18273a;
  --ok:#5cc98a; --ok-soft:#173022; --gold:#e3c06b; --gold-soft:#332a14; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1612; --surface:#14211b; --surface-2:#1a2a22; --line:#27392f; --line-2:#33493c;
  --fg:#e7eee9; --muted:#9aaba0; --faint:#6f8076;
  --brand:#1f4d3e; --brand-2:#2c6650; --brand-fg:#eef2ec; --brand-soft:#1d3326;
  --red:#ff7a6b; --red-soft:#3a1d19; --amber:#f0a947; --amber-soft:#382a14; --blue:#7fb0f0; --blue-soft:#18273a;
  --ok:#5cc98a; --ok-soft:#173022; --gold:#e3c06b; --gold-soft:#332a14; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── app bar ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--brand-fg);padding-block:8px 8px;overflow:hidden}
.bar::after{content:"";position:absolute;right:-22px;top:-14px;width:150px;height:150px;background:url(logo.png) no-repeat center/contain;opacity:.12;pointer-events:none}
.bar>*{position:relative;z-index:1}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;flex:none}
.brand small{display:block;white-space:nowrap;font-size:11px;opacity:.75;letter-spacing:.3px}
.brand h1{margin:0;font-family:var(--f-head);font-size:21px;line-height:1.15;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.quick{display:flex;gap:2px;flex:none}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;white-space:nowrap;text-decoration:none;color:var(--brand-fg);opacity:.92;min-width:42px}
.qbtn span.i{width:33px;height:33px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:16px}
.qbtn{color:var(--brand-fg)}
.qbtn:active span.i{background:rgba(255,255,255,.22)}
.owners{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;padding-bottom:2px}
.owners::-webkit-scrollbar{display:none}
.ow{flex:none;border-radius:999px;padding:5px 11px;font-size:13px;background:rgba(255,255,255,.1);color:var(--brand-fg);white-space:nowrap}
.ow[aria-pressed="true"]{background:var(--chalk);color:#1d4a3b;font-weight:600}
.ow small{opacity:.7;margin-left:3px}

main{flex:1;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.sec{margin-top:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h2{margin:0;font-family:var(--f-head);font-size:17px;font-weight:700}
.go-btn{background:var(--brand);color:var(--brand-fg);font-size:13px;font-weight:700;border-radius:999px;padding:6px 13px;box-shadow:var(--shadow)}
.go-btn:active{transform:scale(.97)}
.sec-h{align-items:center}
.sec-h .more{font-size:13px;color:var(--brand-2);font-weight:600}
.dark .go-btn{background:var(--brand);color:var(--brand-fg);font-size:13px;font-weight:700;border-radius:999px;padding:6px 13px;box-shadow:var(--shadow)}
.go-btn:active{transform:scale(.97)}
.sec-h{align-items:center}
.sec-h .more{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ── today strip: weather + fortunes ── */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:14px 2px}
.strip::-webkit-scrollbar{display:none}
.wx,.ft{flex:none;scroll-snap-align:start;border-radius:18px;padding:12px 14px;min-height:118px;display:flex;flex-direction:column;text-align:left}
.wx{text-decoration:none;width:152px;background:linear-gradient(160deg,#2a6a8f,#1f4d6b);color:#f1f6fa}
.wx .t{font-size:34px;font-weight:600;line-height:1;margin-top:6px;letter-spacing:-1px}
.wx .d{font-size:13px;opacity:.9;margin-top:4px}
.wx .s{font-size:11.5px;opacity:.8;margin-top:auto}
.wx .ico{font-size:24px;line-height:1}
.ft{width:200px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.ft .ani{position:absolute;right:8px;top:6px;font-size:40px;opacity:.9}
.ft .nm{font-family:var(--f-head);font-weight:700;font-size:16px}
.ft .tt{font-size:12px;color:var(--muted)}
.ft p{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ft.open p{-webkit-line-clamp:unset}
.ft .lk{margin-top:auto;padding-top:6px;font-size:11.5px;color:var(--gold)}
.ft-title{font-size:11px;letter-spacing:.4px;color:var(--faint);margin-top:2px}

/* ── compact today strip ── */
.tstrip{display:grid;grid-template-columns:2.3fr 1fr 1fr;gap:6px;padding-block:12px 0}
.tstrip::-webkit-scrollbar{display:none}
.tchip{min-width:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 6px;min-height:40px;padding:5px 10px;border-radius:14px;text-align:center;line-height:1.25;background:var(--surface);border:1px solid var(--line);font-size:13px;text-decoration:none;color:var(--fg)}
.tchip.w{background:#245a7a;border-color:#245a7a;color:#f1f6fa}
.tchip b{font-weight:700}
.tchip .e{font-size:17px;line-height:1}
.tchip small{color:var(--muted);font-size:11.5px}
.tchip.w small{color:#d4e4ee}
.tchip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.ftbox{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font-size:13.5px;line-height:1.5}
.ftbox b{font-weight:700}
.ftbox small{display:block;color:var(--gold);font-size:12px;margin-top:2px}
.ftbox a{color:inherit}
.fp{padding:6px 0;border-top:1px dashed rgba(168,130,42,.35)}
.fp:first-of-type{border-top:0;padding-top:0}
.fp summary{cursor:pointer;list-style:none}
.fp summary::-webkit-details-marker{display:none}
.fp .sx{font-size:11px;color:var(--gold);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:2px}
.fr{display:grid;grid-template-columns:34px 1fr;gap:6px;margin-top:4px;font-size:13px}
.fr span{color:var(--gold);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tcard{aspect-ratio:2/3;max-width:100%;border-radius:8px;background:linear-gradient(160deg,#1d4a3b,#2c6650);color:#f0d68a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid #c9a94f;transition:transform .25s}
.tcard:active{transform:scale(.96)}
.tcard .tb{font-size:18px;opacity:.85}
.tcard.up{background:#fbf6e6;color:#5a4410;border-color:#c9a94f}
.tcard .tn{font-family:var(--f-head);font-size:11px;font-weight:700}
.tcard .te{font-size:18px;line-height:1}
.tcard .tt{font-size:9.5px;font-weight:600;text-align:center;line-height:1.1;padding:0 2px}
.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mbti-grid button{padding:7px 0;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.mbti-grid button[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.ftbox>div:first-child{margin-top:0!important}

/* ── compact home ── */
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tl-head b{font-family:var(--f-head);font-size:15px}
.tl-head span{font-size:11.5px;color:var(--muted)}
#v-home .week{margin-top:4px}
#v-home .tl-head b{font-size:14px}
#v-home .sec{margin-top:10px}
#v-home .sec-h{margin-bottom:6px}
#v-home .sec-h h2{font-size:16px}
#v-home .go-btn{padding:4px 11px;font-size:12.5px}
#v-home .tl-card{padding:8px 12px}
#v-home .tline{margin-top:2px}
#v-home .tl-axis{margin-bottom:2px;font-size:10px}
#v-home .tl-row{margin-top:3px}
#v-home .tl-track{height:20px}
#v-home .tl-bar{top:2px;bottom:2px;font-size:10.5px}
#v-home .tl-empty{padding:2px 0;font-size:13px}
#v-home .stay-row{margin-top:5px;font-size:11.5px}
#v-home .week{gap:4px}
#v-home .wd{padding:2px 2px 3px;border-radius:8px;gap:0}
#v-home .wd .d{font-size:14px;line-height:1.2}
#v-home .wd .w{font-size:10px}
#v-home .wd .c{height:6px;margin-top:1px}
#v-home .wd .c i{width:5px;height:5px}
#v-home .act{padding:8px 10px 8px 0}
#v-home .act .t{font-size:13.5px}
#v-home .act .w{font-size:12px}
.cc.cmp{padding:9px 10px;gap:10px;grid-template-columns:44px 1fr auto;margin-bottom:6px}
.cc.cmp .date{padding-block:4px}
.cc.cmp .date .d{font-size:17px}
.cc.cmp .nm{font-size:15px}
.cc.cmp .meta{margin-top:4px}
#v-home .tstrip{padding-block:8px 0}
#v-home .tchip{min-height:30px;padding:2px 6px;font-size:12px;gap:3px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
#v-home .tchip b{overflow:hidden;text-overflow:ellipsis}
/* ── kpis ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:1px}
.kpi b{font-size:21px;font-weight:700;line-height:1.15;white-space:nowrap}
.kpi.amb b{font-size:17px;padding-top:3px}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.red b{color:var(--red)} .kpi.amb b{color:var(--amber)}
.kpi small{font-size:10.5px;color:var(--faint)}

/* ── today timeline ── */
.tl-card{padding:12px 14px}
.tl-day{display:flex;align-items:baseline;gap:8px}
.tl-day b{font-family:var(--f-head);font-size:18px}
.tl-day span{color:var(--muted);font-size:13px}
.tline{position:relative;margin-top:10px}
.tl-axis{display:grid;grid-template-columns:repeat(8,1fr);font-size:10.5px;color:var(--faint);font-family:var(--f-mono);margin-bottom:4px}
.tl-row{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin-top:6px}
.tl-row .sp{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:26px;background:var(--surface-2);border-radius:8px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:12.5% 100%}
.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--brand-2);color:#fff;font-size:11px;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:6px}
.tl-bar.hold{background:repeating-linear-gradient(45deg,var(--blue),var(--blue) 6px,#3a6fb3 6px,#3a6fb3 12px)}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);border-radius:2px}
.tl-empty{color:var(--muted);font-size:14px;padding:6px 0}
.stay-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.stay-row b{color:var(--fg);font-weight:600}

/* ── week strip ── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{padding:8px 4px 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd .w{font-size:11px;color:var(--muted)}
.wd .d{font-size:17px;font-weight:700}
.wd .c{display:flex;gap:2px;height:7px;margin-top:2px}
.wd .c i{width:6px;height:6px;border-radius:50%;background:var(--brand-2)}
.wd .c i.h{background:var(--blue)}
.wd.today{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.wd.today .w{color:var(--brand-fg);opacity:.8}
.wd.today .c i{background:var(--chalk)}
.wd.sun .w{color:var(--red)} .wd.today.sun .w{color:#ffc9c2}
.wd[aria-pressed="true"]{outline:2px solid var(--brand-2);outline-offset:1px}

/* ── action list ── */
.act{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px 11px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .bar4{align-self:stretch;border-radius:0 4px 4px 0;background:var(--amber)}
.act.hi .bar4{background:var(--red)}
.act .t,.act .w{display:block}
.act .t{font-size:14.5px;font-weight:600;line-height:1.35}
.act .w{font-size:12.5px;color:var(--muted);margin-top:1px}
.act .dd{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* ── search / chips ── */
.search{position:relative;margin-top:14px}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 38px;font:inherit;font-size:15px;background:var(--surface);color:var(--fg)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-weight:600;margin-left:3px}

.fchips{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:8px 2px}
.fchips .chip{padding:4px 0;font-size:11.5px;border-radius:9px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0;white-space:nowrap}
.fchips .chip b{margin:0;font-size:12.5px}
.fchips .chip.day{grid-column:1/-1;flex-direction:row;justify-content:center;gap:6px}
#v-list .search{margin-top:10px}
#v-list .search input{padding:9px 12px 9px 36px}
/* ── case cards ── */
.grp{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.3px;padding-block:16px 8px;display:flex;align-items:center;gap:10px}
.grp::before{content:"";order:2;flex:1;border-top:1.5px dashed var(--line-2)}
.grp span:last-child{order:3}
.cc{width:100%;display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;position:relative;box-shadow:var(--shadow)}
.cc:active{transform:scale(.99)}
.cc.sev-hi{box-shadow:inset 4px 0 0 var(--red),var(--shadow)}
.cc.sev-mid{box-shadow:inset 4px 0 0 var(--amber),var(--shadow)}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);border-radius:12px;padding-block:6px}
.date .m{font-size:10.5px;color:var(--muted)}
.date .d{font-size:20px;font-weight:700;line-height:1.1}
.date .w{font-size:10.5px;color:var(--muted)}
.date.now{background:var(--brand);color:var(--brand-fg)}
.date.now .m,.date.now .w{color:var(--brand-fg);opacity:.85}
.date.none .d{font-size:15px;color:var(--faint)}
.mid{min-width:0}
.nm{font-family:var(--f-head);font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--faint);margin-left:4px}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dday{font-size:12px;font-weight:600;font-family:var(--f-mono);color:var(--muted)}
.dday.now{color:var(--brand-2)}
.pill{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
.p-conf{background:var(--ok-soft);color:var(--ok)}
.p-hold{background:var(--blue-soft);color:var(--blue)}
.p-mix{background:var(--amber-soft);color:var(--amber)}
.p-quote{background:var(--surface-2);color:var(--muted)}
.p-done{background:var(--surface-2);color:var(--faint)}
.flag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag.hi{background:var(--red-soft);color:var(--red)}
.flag.mid{background:var(--amber-soft);color:var(--amber)}
.flag.money{background:var(--gold-soft);color:var(--gold)}
.own{font-size:11.5px;color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* ── money tab ── */

<script>
"use strict";
const D = window.APP_DATA || {cases:[],asOf:"",fortune:null,weather:null};
const WD="일월화수목금토";
const now=new Date(); const TODAY=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY_S=ymd(TODAY);
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const diff=s=>Math.round((pd(s)-TODAY)/864e5);
const md=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}`};
const mdw=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`};
const won=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("ko-KR");
const manwon=n=>{n=Number(n)||0;if(n>=1e8)return (n/1e8).toFixed(1).replace(/\.0$/,"")+"억";if(n>=1e4)return Math.round(n/1e4).toLocaleString("ko-KR")+"만";return won(n)};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAGES=["문의","상담","가예약","견적","계약","확정","이용","정산","매출"];
const ST={conf:["확정","p-conf"],hold:["가예약","p-hold"],mix:["확정+가예약","p-mix"],quote:["견적 중","p-quote"]};
const OWN={"최형근 부장":"최형근","":"미지정","SALES":"영업"};
const ownName=o=>OWN[o]!==undefined?OWN[o]:o;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- prepare cases ---------- */
const CASES=D.cases.map((c,i)=>{
  c.id=c.no||("X"+i);
  c.sch=c.sch||[]; c.rooms=c.rooms||[]; c.al=(c.al||[]).map(a=>({lv:a[0],t:a[1],n:a[2]||""}));
  c.amt=c.amt||{}; c.hist=c.hist||[]; c.todo=c.todo||[];
  c.past=!!(c.e && diff(c.e)<0);
  if(c.hold && (c.st==="hold"||c.st==="mix"||c.st==="quote") && !c.past){
    const h=diff(c.hold), soon=c.s?diff(c.s):999;
    if(h<0) c.al.unshift({lv:soon<=14?"hi":"mid",t:`가예약 기한 지남 (${md(c.hold)})`,n:"자리가 계속 막혀 있음 — 연장하거나 풀기"});
    else if(h===0) c.al.unshift({lv:"hi",t:"가예약 기한 오늘",n:"오늘 연장·확정·해제 결정"});
    else if(h<=3) c.al.unshift({lv:"mid",t:`가예약 ${h}일 뒤 기한 (${md(c.hold)})`,n:""});
  }
  if(c.past) c.al.forEach(a=>{if(a.lv==="hi"&&!/입금/.test(a.t))a.lv="mid"});
  c.sev=c.al.some(a=>a.lv==="hi")?"hi":c.al.some(a=>a.lv==="mid")?"mid":"";
  c.spaces=[...new Set([...c.sch.map(s=>s[2]),...c.rooms.map(r=>"내일을위한집 "+r[2].length+"실")])];
  c.due=Number(c.amt.due)||0; c.final=Number(c.amt.final)||0; c.paid=Number(c.amt.paid)||0;
  c.late=c.al.some(a=>/입금 지연/.test(a.t));
  return c;
});

/* ---------- state ---------- */
let tab=LS.get("gs2-tab","home"), owner="전체", filter="up", q="", dayPick=null;
const mine=c=>owner==="전체"||ownName(c.owner)===owner;
const live=()=>CASES.filter(c=>!c.past&&mine(c));

/* ---------- owners ---------- */
function renderOwners(){
  const counts={};CASES.filter(c=>!c.past).forEach(c=>{const o=ownName(c.owner);counts[o]=(counts[o]||0)+1});
  const order=["최형근","허윤정","신효근","KIM-YW","JIN-IJ","영업","미지정"];
  const list=["전체",...order.filter(o=>counts[o]),...Object.keys(counts).filter(o=>!order.includes(o))];
  if(!list.includes(owner))owner="전체";
  document.getElementById("owners").innerHTML=list.map(o=>`<button class="ow" data-owner="${esc(o)}" aria-pressed="${o===owner}">${o==="전체"?"전체 담당":esc(o)}<small>${o==="전체"?CASES.filter(c=>!c.past).length:counts[o]}</small></button>`).join("");
}

/* ---------- weather & fortune ---------- */
const WMO={0:["맑음","☀️"],1:["대체로 맑음","🌤️"],2:["구름 조금","⛅"],3:["흐림","☁️"],45:["안개","🌫️"],48:["안개","🌫️"],51:["이슬비","🌦️"],53:["이슬비","🌦️"],55:["이슬비","🌦️"],61:["비","🌧️"],63:["비","🌧️"],65:["강한 비","🌧️"],71:["눈","🌨️"],73:["눈","🌨️"],75:["많은 눈","❄️"],80:["소나기","🌦️"],81:["소나기","🌧️"],82:["강한 소나기","⛈️"],95:["뇌우","⛈️"]};
let WX=D.weather&&D.weather.date===TODAY_S?D.weather:null;
function wxHTML(){return ""}
function paintWx(){const i=document.getElementById("wxi"),t=document.getElementById("wxt");if(!i)return;if(WX){const w=WMO[WX.code]||["","🌤️"];i.textContent=w[1];t.textContent=Math.round(WX.t)+"° "+w[0].replace(/^대체로 /,"")}}
function wxBox(){
  if(!WX) return `<div class="ftbox">날씨를 불러오지 못했습니다. <a href="https://www.weather.go.kr/w/index.do" target="_blank" rel="noopener">기상청 날씨 보기 ›</a></div>`;
  const w=WMO[WX.code]||[WX.desc||"",""];
  return `<div class="ftbox"><b>수유동 · ${esc(w[0])} ${Math.round(WX.t)}°</b> 최고 ${Math.round(WX.hi)}° · 최저 ${Math.round(WX.lo)}° · 비 올 확률 ${WX.pop??"—"}%<small><a href="https://www.weather.go.kr/w/index.do" target="_blank" rel="noopener">기상청에서 자세히 ›</a></small></div>`;
}
async function loadWeather(){
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.66&longitude=127.0&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1");
    if(!r.ok) return; const j=await r.json();
    WX={date:TODAY_S,t:j.current.temperature_2m,code:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0],pop:j.daily.precipitation_probability_max[0]};
    paintWx();
  }catch(e){}
}
let pop="";
function fortuneHTML(){
  const F=D.fortune; if(!F||!F.items) return "";
  return `<button class="tchip" data-pop="ft" aria-pressed="${pop==="ft"}"><b>${F.items.map(f=>esc(f.name)).join("·")}</b> 운세</button>`
   +(F.mbti?`<button class="tchip" data-pop="mbti" aria-pressed="${pop==="mbti"}"><b>MBTI</b> 운세</button>`:"")
   +`<button class="tchip" data-pop="tarot" aria-pressed="${pop==="tarot"}"><b>타로점</b></button>`;
}
function ftBox(){
  const F=D.fortune; if(!F||!F.items) return "";
  const stale=F.date!==TODAY_S;
  const row=(k,v)=>v?`<div class="fr"><span>${k}</span>${esc(v)}</div>`:"";
  return `<div class="ftbox">${stale?`<small style="margin:0 0 4px">${esc(md(F.date))} 운세</small>`:""}${F.items.map(f=>`<details class="fp" ${F.items.length===1?"open":""}><summary><b>${esc(f.name)}</b> <span class="sx">${esc(f.sex||"")}</span> ${esc(f.total||f.text||"")}</summary>${row("일",f.work)}${row("돈",f.money)}${row("사람",f.people)}${row("건강",f.health)}<small>행운 · ${esc(f.lucky)}</small></details>`).join("")}<small style="color:var(--muted)">이름을 누르면 일·돈·사람·건강 운세가 펼쳐집니다.</small></div>`;
}
const MBTIS=["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];
let myMbti=LS.get("gs2-mbti","");
function mbtiBox(){
  const M=(D.fortune||{}).mbti||{};
  return `<div class="ftbox"><div class="mbti-grid">${MBTIS.map(t=>`<button data-mbti="${t}" aria-pressed="${myMbti===t}">${t}</button>`).join("")}</div>${myMbti&&M[myMbti]?`<div style="margin-top:8px"><b>${myMbti}</b> ${esc(M[myMbti])}</div>`:`<small style="color:var(--muted)">내 MBTI를 누르면 오늘의 운세가 나옵니다. 한 번 고르면 기억합니다.</small>`}</div>`;
}
const TAROT=[
 ["0","바보","🎒","새 출발. 계획보다 마음이 먼저 가는 쪽으로 한 걸음 내디뎌 보세요. 오늘 시작한 일은 생각보다 가볍게 굴러갑니다."],
 ["I","마법사","🪄","가진 도구로 충분한 날. 망설이던 제안을 먼저 꺼내면 일이 내 쪽으로 기웁니다."],
 ["II","여사제","🌙","답은 이미 내 안에 있습니다. 서두르지 말고 한 번 더 확인한 뒤 움직이세요."],
 ["III","여황제","🌾","풍성함의 카드. 손님을 넉넉하게 대하면 그만큼 좋은 소식으로 돌아옵니다."],
 ["IV","황제","🏛️","질서와 책임. 기준을 분명히 세우면 흔들리던 일이 자리를 잡습니다."],
 ["V","교황","📜","조언을 구하면 길이 보입니다. 경험 많은 사람의 한마디를 놓치지 마세요."],
 ["VI","연인","💞","선택의 날. 마음이 끌리는 쪽과 옳은 쪽이 같다면 망설일 이유가 없습니다."],
 ["VII","전차","🛞","밀고 나갈 때. 방향만 정해지면 속도는 저절로 붙습니다."],
 ["VIII","힘","🦁","부드러움이 이기는 날. 큰소리보다 차분한 설명이 사람을 움직입니다."],
 ["IX","은둔자","🏮","혼자 생각할 시간이 필요합니다. 잠깐 멈추면 놓친 것이 보입니다."],
 ["X","운명의 수레바퀴","☸️","흐름이 바뀌는 날. 막혀 있던 일이 갑자기 풀릴 수 있으니 준비해 두세요."],
 ["XI","정의","⚖️","공정함이 답입니다. 숫자와 약속을 정확히 지키면 신뢰가 쌓입니다."],
 ["XII","매달린 사람","🙃","관점을 바꾸면 보이는 날. 오늘 기다림은 손해가 아니라 준비입니다."],
 ["XIII","죽음","🍂","끝과 시작. 붙잡고 있던 일을 정리하면 새 자리가 생깁니다."],
 ["XIV","절제","🫖","균형의 카드. 서두름과 미룸 사이 딱 알맞은 속도를 찾으세요."],
 ["XV","악마","⛓️","미루던 습관을 하나 끊어 내기 좋은 날. 작은 것부터 시작하세요."],
 ["XVI","탑","⚡","예상 밖 변화가 생겨도 당황하지 마세요. 무너진 자리에서 더 단단한 것이 섭니다."],
 ["XVII","별","⭐","희망의 카드. 지친 일에 다시 힘이 붙고, 좋은 소식이 다가옵니다."],
 ["XVIII","달","🌕","애매한 일은 확인부터. 짐작으로 움직이지 말고 한 번 더 물어보세요."],
 ["XIX","태양","☀️","밝고 시원하게 풀리는 날. 웃는 얼굴이 가장 큰 무기입니다."],
 ["XX","심판","📯","다시 부름을 받는 날. 예전에 미뤄 둔 연락이 좋은 기회로 돌아옵니다."],
 ["XXI","세계","🌍","마무리의 카드. 진행 중인 일이 깔끔하게 끝나고 다음 단계가 열립니다."]];
let tarotPick=-1;
function tarotCard(i){const seed=[...(TODAY_S+"tarot"+i)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);return TAROT[seed%TAROT.length]}
function tarotBox(){
  const backs=[0,1,2,3,4,5].map(i=>`<button class="tcard ${tarotPick===i?"up":""}" data-tarot="${i}" aria-label="${i+1}번째 카드">${tarotPick===i?`<span class="tn">${tarotCard(i)[0]}</span><span class="te">${tarotCard(i)[2]}</span><span class="tt">${tarotCard(i)[1]}</span>`:`<span class="tb">✦</span>`}</button>`).join("");
  const c=tarotPick>=0?tarotCard(tarotPick):null;
  return `<div class="ftbox"><div class="tgrid">${backs}</div>${c?`<div style="margin-top:8px"><b>${c[0]} · ${c[1]}</b> ${esc(c[3])}</div>`:`<small style="color:var(--muted)">마음을 가다듬고 카드 한 장을 고르세요.</small>`}</div>`;
}
function popBox(){return pop==="wx"?wxBox():pop==="ft"?ftBox():pop==="mbti"?mbtiBox():pop==="tarot"?tarotBox():""}
/* ---------- helpers ---------- */
function dday(c){
  if(!c.s) return "날짜 미정";
  const a=diff(c.s), b=diff(c.e||c.s);
  if(b<0) return "끝남"; if(a<=0) return "오늘·진행"; if(a===1) return "내일"; return "D-"+a;
}
function stPill(c){ if(c.past) return `<span class="pill p-done">끝남</span>`; const s=ST[c.st]||ST.quote; return `<span class="pill ${s[1]}">${s[0]}</span>`; }
function card(c,compact){
  const d=c.s?pd(c.s):null, isNow=c.s&&diff(c.s)<=0&&diff(c.e||c.s)>=0;
  const span=c.s&&c.e&&c.s!==c.e?`~${md(c.e)}`:"";
  const flags=c.al.slice(0,compact?1:2).map(a=>`<span class="flag ${a.lv}">${esc(a.t)}</span>`).join("")+(c.al.length>(compact?1:2)?`<span class="flag">+${c.al.length-(compact?1:2)}</span>`:"")+(c.due>0?`<span class="flag money">받을 돈 ${manwon(c.due)}</span>`:"");
  return `<button class="cc ${compact?"cmp":""} ${c.sev?"sev-"+c.sev:""}" data-id="${esc(c.id)}">

function pick(){

/* ---------- CALENDAR ---------- */
let calM=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
function renderCal(){
  const y=calM.getFullYear(),m=calM.getMonth();
  const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d)}
  const rows=cells.slice(35).every(d=>d.getMonth()!==m)?35:42;
  const on=s=>CASES.filter(c=>c.s&&c.s<=s&&(c.e||c.s)>=s&&!(c.e&&diff(c.e)<-40)).sort((a,b)=>(a.st==="conf"?0:1)-(b.st==="conf"?0:1));
  let h=`<div class="cal-h"><button data-calm="-1" aria-label="이전 달">‹</button><b>${y}년 ${m+1}월</b><button data-calm="1" aria-label="다음 달">›</button></div>
  <div class="cal-g">${WD.split("").map((w,i)=>`<span class="cw ${i===0?"sun":""}">${w}</span>`).join("")}`;
  cells.slice(0,rows).forEach(d=>{const ds=ymd(d),cs=on(ds),out=d.getMonth()!==m,isT=ds===TODAY_S;
    h+=`<button class="cd ${out?"out":""} ${isT?"today":""} ${d.getDay()===0?"sun":""}" data-day="${ds}"><span class="n">${d.getDate()}</span>${cs.slice(0,3).map(c=>`<span class="ev ${c.st==="conf"?"c":"h"} ${c.sev==="hi"?"x":""}">${esc(c.name)}</span>`).join("")}${cs.length>3?`<span class="more">+${cs.length-3}</span>`:""}</button>`});
  h+=`</div><div class="cal-leg"><span><i class="c"></i>확정</span><span><i class="h"></i>가예약·견적</span><span><i class="x"></i>급한 일</span><span>날짜를 누르면 그날 일정</span></div>`;
  document.getElementById("v-cal").innerHTML=h;
}

function loadH2C(){return window.html2canvas?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
function capFrame(title,inner){
  const f=document.createElement("div");f.className="cap-frame";
  f.innerHTML=`<div class="cap-top"><img src="logo.png" alt=""><div><small>더숲 아카데미하우스</small><b>${esc(title)}</b></div><span>${esc(mdw(TODAY_S))} 기준</span></div><div class="cap-body">${inner}</div><div class="cap-foot">${esc(D.asOf||"")}</div>`;
  document.body.appendChild(f);return f;
}
async function doCapture(kind,id){
  if(capBusy)return;capBusy=true;toast("이미지를 만드는 중…");
  let f=null;
  try{
    await loadH2C();
    let node;
    if(kind==="home"){node=document.getElementById("v-home");if(tab!=="home"){tab="home";render()}}
    else if(kind==="detail"){node=document.querySelector("#detail .sheet-cap")||document.getElementById("detail")}
    else{
      let list=[],title="";
      if(kind==="week"){list=CASES.filter(c=>!c.past&&c.s&&diff(c.s)<=7).sort(byDate);title="7일 안 단체 일정"}
      else if(kind==="all"){list=CASES.filter(c=>!c.past&&c.s).sort(byDate).slice(0,40);title="다가오는 단체 일정"}
      else if(kind==="sel"){list=CASES.filter(c=>capSel.has(c.id)).sort(byDate);title="단체 일정"}
      if(kind==="month"){const keep=calM;calM=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);renderCal();f=capFrame("이번 달 단체 달력",document.getElementById("v-cal").innerHTML);calM=keep;if(tab==="cal")renderCal()}
      else f=capFrame(title,list.map(c=>card(c)).join("")||`<p class="empty">해당 건이 없습니다.</p>`);
      node=f;
    }
    const bg=getComputedStyle(document.body).backgroundColor;
    const cv=await html2canvas(node,{backgroundColor:bg,scale:Math.min(2,window.devicePixelRatio||2),useCORS:true,logging:false,windowWidth:node.scrollWidth});
    showShot(cv.toDataURL("image/png"),kind);
  }catch(e){toast("캡처를 만들지 못했습니다")}
  finally{if(f)f.remove();capBusy=false}
}
function showShot(url,kind){
  let m=document.getElementById("shot");if(!m){m=document.createElement("div");m.id="shot";m.className="shot";document.body.appendChild(m)}
  const name=`더숲단체일정_${TODAY_S}_${kind}.png`;
  m.innerHTML=`<div class="shot-in"><div class="shot-bar"><b>캡처 이미지</b><button data-shotclose>닫기</button></div><img src="${url}" alt="캡처 이미지"><div class="shot-act"><a class="btn pri" href="${url}" download="${name}">저장</a><button class="btn sec" data-shotshare>공유</button></div><p class="note">저장이 안 되면 이미지를 길게 눌러 「사진에 저장」을 고르세요.</p></div>`;
  m.dataset.url=url;m.dataset.name=name;m.hidden=false;
}
async function shareShot(){
  const m=document.getElementById("shot");try{const b=await (await fetch(m.dataset.url)).blob();const file=new File([b],m.dataset.name,{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"더숲 단체 일정"});return}}catch(e){}
  toast("이 화면에서는 공유가 안 됩니다 · 길게 눌러 저장");
}

}
function buildMsg(c){
  const L=[]; const when=c.s?(c.s===c.e||!c.e?mdw(c.s):`${mdw(c.s)} ~ ${mdw(c.e)}`):"일정 협의 중";
  const byDay={};c.sch.forEach(s=>(byDay[s[0]]=byDay[s[0]]||[]).push(s));
  const sched=Object.keys(byDay).sort().map(d=>`· ${mdw(d)} ${byDay[d].map(s=>`${s[2].replace(/ 통합$/,"")} ${s[1]}`).join(", ")}`);
  if(msgKind==="front"){
    L.push(`[현장 전달] ${c.name} (${c.no})`,`일정: ${when}${c.pax?` · ${c.pax}명`:""}`);
    if(sched.length)L.push("","공간",...sched);
    c.rooms.forEach(r=>L.push("",`객실 ${r[2].length}실 (${r[1]}) 입실 16:00 · 퇴실 11:00`,r[2].join(", ")));
    const meal=(c.amt.items||[]).filter(r=>/식|조식|중식|석식|다이닝|커피|다과/.test(r[0]));
    if(meal.length)L.push("","식음",...meal.map(r=>`· ${r[0]} ${r[1]||""}${r[2]?" "+r[2]:""}`));
    if(c.memo)L.push("","메모: "+c.memo);
    return L.join("\n");
  }
  L.push(`안녕하세요, 더숲 아카데미하우스입니다.`,`${c.name} 이용 안내드립니다.`,"",`■ 일정  ${when}${c.pax?` · ${c.pax}명`:""}`);
  if(sched.length)L.push("■ 공간",...sched);
  c.rooms.forEach(r=>L.push(`■ 숙박  ${r[2].length}실 (${r[1]})`,"  입실 16:00 · 퇴실 11:00"));
  if(msgOpt.amt&&c.final){
    L.push("",`■ 이용 금액  ${won(c.final)}원 (부가세 포함)`);
    if(c.paid)L.push(`  받은 금액  ${won(c.paid)}원`);
    if(c.due>0){const np=(c.amt.pay||[]).find(p=>!/확인|입금/.test(p[4]));L.push(`  남은 금액  ${won(c.due)}원${np&&np[1]?` (${md(np[1])}까지)`:""}`);}
  }
  if(msgOpt.park)L.push("",`■ 오시는 길  서울 강북구 4.19로 135 (수유동, 아카데미하우스)`,`■ 주차  10분당 1,300원`,`  주차 혜택: 카페 이용 시 2시간(주말 1시간 30분) · 다이닝 이용 시 2시간 · 도서 구매 시 1시간`);
  L.push("",`문의  02-904-0206 · biz@deosup.com`,`감사합니다.`);
  return L.join("\n");
}
function setMailto(){const a=document.getElementById("mailto");if(!a)return;const t=document.getElementById("msg").value;a.href=`mailto:?subject=${encodeURIComponent("[더숲 아카데미하우스] "+cur.name+" 이용 안내")}&body=${encodeURIComponent(t)}`}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target;
  const cm=t.closest("[data-calm]"); if(cm){calM=new Date(calM.getFullYear(),calM.getMonth()+(+cm.dataset.calm),1);renderCal();return}
  const cp=t.closest("[data-cap]"); if(cp){doCapture(cp.dataset.cap);return}
  const ph=t.closest("[data-ph]");if(ph){const [k,n]=ph.dataset.ph.split("|");const g=FAC.find(x=>x.k===k),r=g.rows.find(x=>x[0]===n);openGal(n,phOf(g,r));return}
  if(t.closest("[data-galclose]")){document.getElementById("gal").hidden=true;return}
  const fc=t.closest("[data-faccopy]");if(fc){copyText(FAC.map(facText).join("\n\n"));return}
  if(t.closest("[data-capclear]")){capSel.clear();renderCap();return}
  if(t.closest("[data-shotclose]")){document.getElementById("shot").hidden=true;return}
  if(t.closest("[data-shotshare]")){shareShot();return}
  const tc=t.closest("[data-tarot]"); if(tc){tarotPick=+tc.dataset.tarot;renderHome();return}
  const mb=t.closest("[data-mbti]"); if(mb){myMbti=mb.dataset.mbti;LS.set("gs2-mbti",myMbti);renderHome();return}
  const pp=t.closest("[data-pop]"); if(pp){pop=pop===pp.dataset.pop?"":pp.dataset.pop;if(tab!=="home"){tab="home";render()}else renderHome();window.scrollTo(0,0);return}
  if(t.closest("[data-close]")){closeDetail();return}
  const cn=t.closest("[data-copyno]"); if(cn){if(!await copyText(cn.dataset.copyno))toast(cn.dataset.copyno);return}
  if(t.closest("[data-copymsg]")){const ta=document.getElementById("msg");if(!await copyText(ta.value)){ta.focus();ta.select();toast("선택했습니다 · 길게 눌러 복사")}return}
  const pn=t.closest(".seg [data-pane]"); if(pn){pane=pn.dataset.pane;drawDetail();return}
  const k=t.closest("[data-kind]"); if(k){msgKind=k.dataset.kind;drawPane();return}
  const card=t.closest("[data-id]"); if(card){openDetail(card.dataset.id,card.dataset.pane);return}
  const ow=t.closest("[data-owner]"); if(ow){owner=ow.dataset.owner;LS.set("gs2-owner",owner);render();return}
  const go=t.closest("[data-go]"); if(go){const [tb,f]=go.dataset.go.split(":");tab=tb;if(f){filter=f;dayPick=null}LS.set("gs2-tab",tab);render();window.scrollTo(0,0);return}
  const dy=t.closest("[data-day]"); if(dy){dayPick=dy.dataset.day;tab="list";render();window.scrollTo(0,0);return}
  if(t.closest("[data-day-clear]")){dayPick=null;render();return}
  const f=t.closest("[data-f]"); if(f){filter=f.dataset.f;dayPick=null;render();return}
  const rg=t.closest("[data-range]"); if(rg){spaceRange=rg.dataset.range;LS.set("gs2-space",spaceRange);render();return}
  const tb=t.closest("[data-tab]"); if(tb){tab=tb.dataset.tab;dayPick=null;LS.set("gs2-tab",tab);render();window.scrollTo(0,0);return}
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.capsel){const id=e.target.dataset.capsel;e.target.checked?capSel.add(id):capSel.delete(id);renderCap();return}const id=e.target.id;if(id==="o-amt"||id==="o-park"){msgOpt[id.slice(2)]=e.target.checked;document.getElementById("msg").value=buildMsg(cur);setMailto()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.trim().toLowerCase();renderList()}if(e.target.id==="msg")setMailto()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

document.getElementById("foot").textContent=(D.asOf||"")+" · 고치는 일은 건 대장에서";
if(!["home","list","cal","todo","money","space","fac","cap"].includes(tab))tab="home";
render(); loadWeather();
const h=(location.hash||"").slice(1); if(h&&CASES.some(c=>c.id===h)) openDetail(h);
</script>

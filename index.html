<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>더숲 아카이브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d4636">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="더숲 아카이브">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first app — sticky top bar, one column of sections, fixed bottom tab bar; sheets slide up for detail and input. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --sunk:#e9ece4; --line:#d9ded3; --line-2:#c6cdbf;
  --ink:#17201b; --mute:#5b665f; --faint:#8a948c;
  --pine:#1d4636; --pine-2:#2e6a52; --pine-soft:#dfeae3; --on-pine:#ffffff;
  --hi:#b23a2f; --hi-soft:#f8e3e0; --mid:#a86a12; --mid-soft:#f7ecd9; --ok:#2e7d55; --ok-soft:#e0f0e6; --info:#2d5d89; --info-soft:#e2ebf4;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-disp:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --sunk:#141a17; --line:#2b352f; --line-2:#3a463f;
  --ink:#e8eee9; --mute:#a3afa7; --faint:#77837b;
  --pine:#6fbf98; --pine-2:#8fd3b0; --pine-soft:#20352b; --on-pine:#0e1a14;
  --hi:#f08a7e; --hi-soft:#3a201d; --mid:#e2b25c; --mid-soft:#352a17; --ok:#7fcfa2; --ok-soft:#1b3326; --info:#8db8e3; --info-soft:#1b2a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --sunk:#141a17; --line:#2b352f; --line-2:#3a463f;
  --ink:#e8eee9; --mute:#a3afa7; --faint:#77837b;
  --pine:#6fbf98; --pine-2:#8fd3b0; --pine-soft:#20352b; --on-pine:#0e1a14;
  --hi:#f08a7e; --hi-soft:#3a201d; --mid:#e2b25c; --mid-soft:#352a17; --ok:#7fcfa2; --ok-soft:#1b3326; --info:#8db8e3; --info-soft:#1b2a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--pine)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pine-2);outline-offset:2px;border-radius:8px}
a{color:var(--pine)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pine);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#16302a}}
:root[data-theme="dark"] .top{background:#16302a}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font:700 18px/1 var(--f-disp);letter-spacing:-.3px;white-space:nowrap}
.brand img{width:28px;height:28px}
.fresh{font:500 12px/1.3 var(--f-body);letter-spacing:0;color:#d8e8de;margin-top:3px}
.fresh b{color:#fff;font-weight:600}
.fresh.stale b{color:#ffd28a}
.fresh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.ibtn:active{background:rgba(255,255,255,.22)}
.ibtn svg{width:20px;height:20px}
.ibtn.upd{width:auto;display:flex;align-items:center;gap:6px;padding:0 12px;background:#fff;color:#1d4636;font-size:14px;font-weight:700}
.ibtn.upd:active{background:#e6efe9}
.ibtn.upd:disabled{opacity:.6}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}

/* main tabs (top, inside the sticky header) */
.tabs{background:var(--pine);padding:0 max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs{background:#16302a}}
:root[data-theme="dark"] .tabs{background:#16302a}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px}
.tab{display:flex;align-items:center;justify-content:center;gap:4px;min-height:46px;border-radius:10px;font-size:15px;font-weight:700;color:#fff;text-align:center;position:relative}
.tab svg{width:19px;height:19px;flex:none}
.tab b{font-weight:700}
.tab[aria-current="page"]{background:#fff;color:#1d4636;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tab .badge{position:absolute;top:-4px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#e5484d;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--pine)}
@media (max-width:380px){.tab{font-size:14px;gap:3px}.tab svg{width:17px;height:17px}}

/* sections */
main{padding-top:14px}
.view{display:grid;gap:18px}
.sec{display:grid;gap:8px;scroll-margin-top:calc(140px + env(safe-area-inset-top,0px))}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{margin:0;font:700 17px/1.3 var(--f-disp);letter-spacing:-.2px}
.sec-h .cnt{color:var(--mute);font-size:13px}
.sec-h .more{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--pine);padding:4px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:18px;color:var(--mute);text-align:center;font-size:14px}
.note{color:var(--mute);font-size:12.5px;margin:0}

/* today hero */
.dayline{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dayline h1{margin:0;font:700 26px/1.15 var(--f-disp);letter-spacing:-.6px}
.dayline .wx{color:var(--mute);font-size:14px;padding-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:2px}
.stat span{font-size:12.5px;color:var(--mute)}
.stat b{font:700 22px/1.1 var(--f-disp)}
.stat.alert b{color:var(--hi)}
.stat small{font-size:11.5px;color:var(--faint)}

/* group card */
.g{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px;width:100%;border-bottom:1px solid var(--line)}
.g:last-child{border-bottom:0}
.g:active{background:var(--sunk)}
.dt{width:46px;text-align:center;border-radius:10px;background:var(--sunk);padding:6px 0 5px;line-height:1.1}
.dt .m{display:block;font-size:11px;color:var(--mute)}
.dt .d{display:block;font:700 20px/1.1 var(--f-disp)}
.dt .w{display:block;font-size:11px;color:var(--mute)}
.dt.now{background:var(--pine);color:var(--on-pine)}
.dt.now .m,.dt.now .w{color:inherit;opacity:.85}
.dt.none .d{font-size:13px;padding:6px 0}
.g .body{min-width:0;display:grid;gap:4px}
.g .nm{font-weight:700;font-size:16px;line-height:1.3;word-break:keep-all}
.g .nm small{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:5px}
.g .sub{font-size:13px;color:var(--mute);word-break:keep-all}
.g .flags{display:flex;flex-wrap:wrap;gap:4px}
.g .side{display:grid;justify-items:end;gap:6px}
.pax{display:inline-block;background:var(--pine);color:var(--on-pine);font-weight:700;font-size:12.5px;border-radius:6px;padding:1px 7px;line-height:1.5;white-space:nowrap}
.own{display:inline-block;background:var(--hi);color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px;line-height:1.5;white-space:nowrap}
.own.none{background:var(--sunk);color:var(--mute)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--sunk);color:var(--mute)}
.p-conf{background:var(--ok-soft);color:var(--ok)}
.p-hold{background:var(--mid-soft);color:var(--mid)}
.p-mix{background:var(--info-soft);color:var(--info)}
.p-quote{background:var(--sunk);color:var(--mute)}
.p-done{background:var(--sunk);color:var(--faint)}
.dd{font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.dd.now{color:var(--pine)}
.flag{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--sunk);color:var(--mute)}
.flag.hi{background:var(--hi-soft);color:var(--hi)}
.flag.mid{background:var(--mid-soft);color:var(--mid)}
.flag.money{background:var(--info-soft);color:var(--info)}

/* today big card */
.tg{padding:14px;display:grid;gap:10px;width:100%;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tg .nm{font:700 18px/1.3 var(--f-disp);letter-spacing:-.3px;word-break:keep-all}
.tg .slots{display:grid;gap:4px}
.slot{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px}
.slot .t{font-weight:700;color:var(--pine);font-variant-numeric:tabular-nums}
.slot .s{color:var(--ink);word-break:keep-all}
.hold-tag{font-size:11px;font-weight:700;color:var(--mid);margin-left:4px}

/* timeline */
.tl{padding:12px 14px;display:grid;gap:7px;overflow-x:auto}
.tl-axis,.tl-row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;min-width:420px}
.tl-axis .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}
.tl-row .sp{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:26px;background:var(--sunk);border-radius:6px}
.bar{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--pine);color:var(--on-pine);font-size:11.5px;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.bar.hold{background:var(--mid);color:#fff}
.nowline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--hi);border-radius:1px}

/* actions */
.act{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 0;width:100%;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act i{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line-2)}
.act.hi i{background:var(--hi)}
.act.mid i{background:var(--mid)}
.act .t{font-weight:700;font-size:14.5px;display:block;word-break:keep-all}
.act .w{font-size:12.5px;color:var(--mute);display:block}
.okline{padding:16px;color:var(--ok);font-weight:600;font-size:14px}

/* week list */
.wkday{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.wkday:last-child{border-bottom:0}
.wkday .h{font-weight:700;font-size:14px;line-height:1.25}
.wkday .h small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.wkday.sun .h{color:var(--hi)}
.wkday.sat .h{color:var(--info)}
.wkday .items{display:grid;gap:4px;min-width:0}
.wkday .it{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;text-align:left}
.wkday .it b{font-weight:600}
.wkday .none{color:var(--faint);font-size:13px}

/* controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{text-align:center;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip b{margin-left:5px;color:var(--mute);font-weight:700}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:inherit;padding:11px 0;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line);background:var(--surface);text-align:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.grp{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mute);padding:6px 2px 0}

/* calendar */
.cal{padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}
.cal-h b{font:700 17px var(--f-disp)}
.cal-h button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-size:18px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-g .wh{font-size:11.5px;text-align:center;color:var(--mute);padding:2px 0}
.cd{min-height:64px;border-radius:8px;padding:4px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;overflow:hidden;text-align:left}
.cd.out{opacity:.35}
.cd.today{outline:2px solid var(--pine);outline-offset:-2px}
.cd.pick{background:var(--pine-soft)}
.cd .n{font-size:12px;font-weight:700}
.cd.sun .n{color:var(--hi)}
.cd.sat .n{color:var(--info)}
.cd .e{font-size:10.5px;line-height:1.25;background:var(--surface);border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .e.h{color:var(--mid)}
.cd .more{font-size:10px;color:var(--mute)}

/* space */
.sp-blk{padding:12px 14px;border-bottom:1px solid var(--line)}
.sp-blk:last-child{border-bottom:0}
.sp-blk h3{margin:0 0 6px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between}
.sp-blk h3 span{color:var(--mute);font-weight:500;font-size:12.5px}
.sp-it{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13.5px;padding:3px 0;width:100%}
.sp-it .d{font-weight:700;font-variant-numeric:tabular-nums}

/* money */
.mhero{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mhero span{display:block;font-size:12.5px;color:var(--mute)}
.mhero b{display:block;font:700 22px/1.25 var(--f-disp)}
.mhero .late b{color:var(--hi)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;width:100%;border-bottom:1px solid var(--line);align-items:center}
.mrow:last-child{border-bottom:0}
.mrow .n{font-weight:700;display:block}
.mrow .s{font-size:12.5px;color:var(--mute);display:block}
.mrow .a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mrow .a small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.mrow.late .a{color:var(--hi)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font:700 18px var(--f-disp)}
.monthnav button{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.stot{padding:16px;display:grid;gap:12px}
.stot .big{font:700 28px/1.1 var(--f-disp);letter-spacing:-.5px}
.stot .lab{font-size:12.5px;color:var(--mute)}
.dbar{display:grid;grid-template-columns:72px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.dbar .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.dbar .tr{display:flex}
.dbar .tr i{display:block;height:100%;background:var(--pine)}
.dbar .tr i.pp{background:var(--line-2)}
.mo{display:grid;grid-template-columns:64px 1fr 84px;gap:8px;align-items:center;padding:9px 14px;width:100%;border-bottom:1px solid var(--line);font-size:13.5px}
.mo:last-child{border-bottom:0}
.mo[aria-pressed="true"]{background:var(--pine-soft)}
.mo .tr{display:flex;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.mo .tr i{background:var(--pine)}.mo .tr i.pp{background:var(--line-2)}
.mo .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.fc{padding:10px 0;border-bottom:1px solid var(--line)}.fc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px}.fc-h span{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.fc-t{display:flex;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}.fc-t i{background:var(--pine)}.fc-t i.mid{background:var(--pine-2);opacity:.6}.fc-t i.pp{background:var(--line-2)}
.ins{margin:0;padding:12px 14px 12px 32px;display:grid;gap:5px;font-size:14px}
.revc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px;width:100%;align-items:center}
.revc .l{font-size:12.5px;color:var(--mute);grid-column:1/-1}.revc b{font:700 24px/1.2 var(--f-disp);letter-spacing:-.4px}.revc .go{font-size:13.5px;font-weight:700;color:var(--pine)}.revc .s{grid-column:1/-1;font-size:12.5px;color:var(--mute)}
.daybar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:4px}
.nn{display:grid;gap:1px;border-radius:var(--r);overflow:hidden;background:#1d4636;box-shadow:var(--shadow)}
.nn-r{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px 14px;width:100%;color:#fff;background:rgba(0,0,0,.12)}
.nn-r .k{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.2)}
.nn-r .k.live{background:#e5484d}
.nn-r .v{font-size:15px;min-width:0;word-break:keep-all}.nn-r .v em{font-style:normal;opacity:.8;font-size:13px;margin-left:4px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:10px}.qa .btn{padding:10px 4px;font-size:13px}
.chip-l{flex:none;align-self:center;font-size:12.5px;color:var(--mute);padding-right:2px}
.pill.pin.on{background:var(--mid-soft);color:var(--mid)}
.fr .p{display:grid;gap:4px;justify-items:end}
.pb{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:8px;background:var(--sunk);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

  L.push("안녕하세요, 더숲 아카데미하우스입니다.",`${c.name} 이용 안내드립니다.`,"",`■ 일정  ${when}${c.pax?` · ${c.pax}명`:""}`);if(sched.length)L.push("■ 공간",...sched);
  c.rooms.forEach(r=>L.push(`■ 숙박  ${r[2].length}실 (${r[1]})`,"  입실 16:00 · 퇴실 11:00"));
  if(msgOpt.amt&&c.final){L.push("",`■ 이용 금액  ${won(c.final)}원 (부가세 포함)`);if(c.paid)L.push(`  받은 금액  ${won(c.paid)}원`);if(c.due>0){const np=(c.amt.pay||[]).find(p=>!/확인|입금/.test(p[4]||""));L.push(`  남은 금액  ${won(c.due)}원${np&&np[1]?` (${md(np[1])}까지)`:""}`)}}
  if(msgOpt.park)L.push("","■ 오시는 길  서울 강북구 4.19로 135 (수유동, 아카데미하우스)","■ 주차  이용금액 1만 원당 1시간, 최대 3시간 무료");
  L.push("","문의  02-904-0206 · biz@deosup.com","감사합니다.");return L.join("\n")}

let sheetKind="";
function openSheet(html,kind){sheetKind=kind;$("sheetIn").innerHTML=html;$("sheet").scrollTop=0;$("sheet").classList.add("on");$("scrim").classList.add("on");document.body.style.overflow="hidden";

/* ===== render ===== */
function render(){
  if(!UNLOCKED)return;
  document.querySelectorAll(".tab").forEach(b=>{b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false");b.querySelector(".badge")?.remove()});
  const hiN=actions().filter(x=>x.a.lv==="hi").length;if(hiN){const b=document.querySelector('.tab[data-tab="today"]');b.insertAdjacentHTML("beforeend",`<span class="badge">${hiN}</span>`)}
  $("view").innerHTML=tab==="today"?renderToday():tab==="plan"?renderPlan():tab==="money"?renderMoney():tab==="book"?renderBook():renderInfo();

/* ===== update buttons ===== */
let UNLOCKED=false,pinBuf="";
const PIN_H=1106894297;
const pinHash=s=>{let x=5381;for(const ch of "deosup-biz:"+s)x=(((x*33)>>>0)^ch.charCodeAt(0))>>>0;return x};
function paintPin(msg){$("pinDots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("");$("pinMsg").textContent=msg||""}
function pinKey(k){if(UNLOCKED)return;if(k==="del")pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;paintPin();
  if(pinBuf.length===4){if(pinHash(pinBuf)===PIN_H){LS.set("ds-ok",PIN_H+"|"+Date.now());pinBuf="";start()}else{pinBuf="";paintPin("비밀번호가 다릅니다. 다시 눌러 주세요.")}}}
let busy=false;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=()=>{s.remove();ok()};s.onerror=()=>{s.remove();no()};document.head.appendChild(s)})}
async function pullLatest(silent){
  const before=D.asOf;
  try{await loadScript("data.js?t="+Date.now());prep();try{await loadScript("sales.js?t="+Date.now())}catch(e){}loadSnapshot();render();if(cur){const c=CASES.find(x=>x.id===cur.id);if(c){cur=c;$("sheetIn").innerHTML=detailHTML();drawPane()}}
    if(!silent)toast(D.asOf!==before?"새 데이터로 바꿨습니다":"이미 최신 데이터입니다 · "+(parseAsOf(D.asOf)?ago(parseAsOf(D.asOf)):""));return true}
  catch(e){if(!silent)toast("불러오지 못했습니다. 인터넷 연결을 확인해 주세요");return false}}
async function runUpdate(){
  if(busy)return;busy=true;const b=$("btnRefresh");b.classList.add("spin");
  try{
    if(MCP){
      try{await MCP.callTool("Claude Code Remote","fire_trigger",{trigger_id:TRIGGER_ID,text:"화면의 「지금 업데이트」 버튼으로 실행됨."});
        LS.set("ds-fired",String(Date.now()));toast("업데이트를 시작했습니다 · 10~15분 뒤 저절로 바뀝니다");return}
      catch(e){const code=e&&e.code;
        if(code==="approval_required"||code==="not_granted"){toast("실행하려면 이 페이지에 권한을 허락해 주세요")}
        else if(code==="server_not_connected"||code==="needs_reauth"){toast("Claude Code Remote 연결이 필요합니다 (설정 → 커넥터)")}
        else if(code==="blocked_by_policy"){toast("이 계정에서는 업데이트 실행이 막혀 있습니다")}
        else if(code==="tool_error"){toast("업데이트 작업을 찾지 못했습니다. 관리자에게 알려 주세요")}
        else toast("업데이트 요청 결과를 확인하지 못했습니다. 10분 뒤 화면을 확인해 주세요");
        return}
    }
    await pullLatest(false);
  }finally{busy=false;b.classList.remove("spin")}
}

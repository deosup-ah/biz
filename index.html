<title>더숲 단체 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 사유의숲: 칠판 같은 깊은 숲빛 초록 + 분필 흰 선 그림, 조용한 명조 제목
   Layout: one-column phone app shell (max 480px) — app bar, filter chips, date-grouped list, slide-up detail screen, bottom tab bar */
:root{
  --bg:#edf0eb; --surface:#fbfcfa; --surface-2:#f1f4ef; --line:#d9e0d8;
  --fg:#17261f; --muted:#5b6b62; --faint:#8a978f;
  --brand:#1d4a3b; --brand-fg:#f4f6f1; --brand-soft:#dfe9e3; --chalk:#f4f6f1;
  --f-head:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --red:#c2392b; --red-soft:#fbeae7; --amber:#b86e0b; --amber-soft:#fbf0de; --blue:#2a5d9f; --blue-soft:#e6eef8;
  --ok:#1f7a45; --ok-soft:#e2f2e8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1612; --surface:#14211b; --surface-2:#1a2a22; --line:#27392f;
  --fg:#e7eee9; --muted:#9aaba0; --faint:#6f8076;
  --brand:#1f4d3e; --brand-fg:#eef2ec; --brand-soft:#1d3326;
  --red:#ff7a6b; --red-soft:#3a1d19; --amber:#f0a947; --amber-soft:#382a14; --blue:#7fb0f0; --blue-soft:#18273a;
  --ok:#5cc98a; --ok-soft:#173022; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1612; --surface:#14211b; --surface-2:#1a2a22; --line:#27392f;
  --fg:#e7eee9; --muted:#9aaba0; --faint:#6f8076;
  --brand:#1f4d3e; --brand-fg:#eef2ec; --brand-soft:#1d3326;
  --red:#ff7a6b; --red-soft:#3a1d19; --amber:#f0a947; --amber-soft:#382a14; --blue:#7fb0f0; --blue-soft:#18273a;
  --ok:#5cc98a; --ok-soft:#173022; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-fg);padding-block:14px 12px}
.bar-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.bar h1{font-family:var(--f-head);font-size:22px;font-weight:700;letter-spacing:-.2px}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
.brandrow img{width:46px;height:46px;flex:none}
.brandrow small{display:block;font-size:11.5px;opacity:.75;letter-spacing:.3px}

.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.75}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:14px 4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.tile.hot b{color:var(--red)}
.tile[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* list */
main{flex:1;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.grp{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.4px;padding-block:16px 8px;display:flex;align-items:center;gap:10px}
.grp::before{content:"";order:2;flex:1;border-top:1.5px dashed var(--line)}
.grp span:last-child{order:3}
.card{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
.card:active{transform:scale(.99)}
.card.sev-hi{border-left:4px solid var(--red)}
.card.sev-mid{border-left:4px solid var(--amber)}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);border-radius:10px;padding-block:6px;font-variant-numeric:tabular-nums}
.date .m{font-size:11px;color:var(--muted)}
.date .d{font-size:20px;font-weight:700;line-height:1.1}
.date .w{font-size:11px;color:var(--muted)}
.date.today{background:var(--brand);color:var(--brand-fg)}
.date.today .m,.date.today .w{color:var(--brand-fg);opacity:.85}
.mid{min-width:0}
.nm{font-family:var(--f-head);font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dd{font-size:12.5px;font-weight:600;font-family:var(--f-mono);color:var(--muted)}
.dd.now{color:var(--brand)}
.pill{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
.p-conf{background:var(--ok-soft);color:var(--ok)}
.p-hold{background:var(--blue-soft);color:var(--blue)}
.p-mix{background:var(--amber-soft);color:var(--amber)}
.p-done{background:var(--surface-2);color:var(--faint)}
.flag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted)}
.flag.hi{background:var(--red-soft);color:var(--red)}
.flag.mid{background:var(--amber-soft);color:var(--amber)}
.empty{text-align:center;color:var(--muted);padding:48px 0}

/* space view */
.sp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sp h3{font-family:var(--f-head);font-size:16px;font-weight:700;padding:12px 14px 8px;display:flex;justify-content:space-between;gap:8px}
.sp h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.sp-row{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;text-align:left;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.sp-row .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sp-row .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;color:var(--faint);position:relative}
.tab[aria-selected="true"]{color:var(--brand)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center}

/* detail screen */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{max-width:480px;margin:0 auto;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.hero{background:var(--brand);color:var(--brand-fg);padding-block:calc(10px + env(safe-area-inset-top,0px)) 20px}
.back{display:flex;align-items:center;gap:4px;font-size:15px;padding:6px 0;color:var(--brand-fg);opacity:.9}

.hero-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.hero .pill{background:rgba(255,255,255,.18);color:var(--brand-fg)}
.case-no{font-family:var(--f-mono);font-size:12.5px;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 8px;color:var(--brand-fg)}
.sec{margin-top:18px}
.sec h4{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin-bottom:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.al{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14.5px}
.al:first-child{border-top:0}
.al i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--faint)}
.al.hi i{background:var(--red)} .al.mid i{background:var(--amber)}
.al.hi b{color:var(--red)} .al.mid b{color:var(--amber)}
.al small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.ok-line{padding:12px 14px;color:var(--ok);font-size:14.5px}
.tl{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .dt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.tl .dt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tl .what{min-width:0}
.tl .sp-n{font-weight:600}
.tl .tm{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tl .st{margin-left:6px}
.rooms{padding:12px 14px;border-top:1px solid var(--line)}
.rooms:first-child{border-top:0}
.rooms .rh{display:flex;justify-content:space-between;font-size:14px;font-weight:600;gap:8px}
.rooms .rh span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.rgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rgrid span{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.note{padding:12px 14px;font-size:14px;color:var(--muted)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;padding:12px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.copy{margin-left:auto;font-size:12.5px;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 8px;color:var(--brand-fg)}
.foot{font-size:12px;color:var(--faint);text-align:center;padding:18px 0 4px}
</style>

C({no:"GS-2610-017",name:"(재) 평화재단",st:"hold",s:"2026-12-17",e:"2026-12-17",
 sch:[["2026-12-17","09:00–18:00","C301+C302 통합"],["2026-12-17","12:00–16:00","대화의 집"]],al:[]}),
C({no:"GS-2610-010",name:"이제이컴퍼니",st:"hold",s:"2026-12-18",e:"2026-12-19",hold:"2026-10-13",
 sch:[["2026-12-18","12:00–18:00","여해의 집 세미나룸"],["2026-12-19","09:00–12:00","여해의 집 세미나룸"]],al:[]}),
C({no:"GS-2609-045",name:"혜화여고",st:"hold",s:"2026-12-18",e:"2026-12-18",hold:"2026-09-18",
 sch:[["2026-12-18","13:00–17:00","대화의 집"]],al:[["mid","담당자 없음"]]}),
C({no:"GS-2610-027",name:"에포케책방",st:"hold",s:"2026-12-19",e:"2026-12-20",
 sch:[["2026-12-19","15:00–23:00","대화의 집"],["2026-12-20","08:00–12:00","대화의 집"]],al:[]}),
C({no:"—",name:"무빙싸이클",st:"hold",s:null,e:null,hold:"2026-10-14",
 sch:[],al:[["mid","GSP에는 가예약인데 공간 보드에 블록 없음 — 날짜·공간 미확인"]]}),
C({no:"—",name:"상생마을관리사회적협동조합",tag:"GS-2609-038",st:"hold",s:null,e:null,
 sch:[],al:[["hi","회신 지연 742시간 — 가장 오래됨","10/11 기준 · 공간 블록 없음"]]})
];

/* ---------- helpers ---------- */
const WD="일월화수목금토";
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const now=new Date(); const TODAY=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const diff=s=>Math.round((pd(s)-TODAY)/864e5);
const md=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}`};
const mdw=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={conf:["확정","p-conf"],hold:["가예약","p-hold"],mix:["확정+가예약","p-mix"]};
const keyOf=c=>c.no!=="—"?c.no+(c.tag&&c.no2?"":""):("X-"+c.name);

CASES.forEach((c,i)=>{
  c.id = (c.no!=="—"?c.no:"X"+i);
  c.past = c.e && diff(c.e)<0;
  const alerts=c.al.map(a=>({lv:a[0],t:a[1],n:a[2]||""}));
  // 가예약 기한은 오늘 날짜로 다시 계산
  if(c.hold && (c.st==="hold"||c.st==="mix") && !c.past){
    const h=diff(c.hold);
    const soon = c.s ? diff(c.s) : 999;
    if(h<0) alerts.unshift({lv: soon<=14?"hi":"mid", t:`가예약 기한 지남 (${md(c.hold)}) — 자리가 아직 막혀 있음`, n:"연장하거나 풀어야 함"});
    else if(h===0) alerts.unshift({lv:"hi",t:"가예약 기한 오늘 — 오늘 결정",n:""});
    else if(h<=3) alerts.unshift({lv:"mid",t:`가예약 ${h}일 뒤 풀림 (${md(c.hold)})`,n:""});
  }
  if(c.past) alerts.forEach(a=>{ if(a.lv==="hi") a.lv="mid"; });
  c.alerts=alerts;
  c.sev = alerts.some(a=>a.lv==="hi")?"hi":alerts.some(a=>a.lv==="mid")?"mid":"";
  c.spaces=[...new Set([...c.sch.map(s=>s[2]),...(c.rooms||[]).map(r=>r[0].replace(/ \(.*\)/,""))])];
});

/* ---------- state ---------- */
let tab="list", filter="up", q="";
try{ tab=localStorage.getItem("gs-tab")||"list"; filter=localStorage.getItem("gs-filter")||"up"; }catch(e){}
const FILTERS=[["up","다가오는"],["week","7일 안"],["check","체크 필요"],["hold","가예약"],["conf","확정"],["past","지난 건"]];

const match=c=>!q || (c.name+c.no+(c.tag||"")+c.spaces.join(" ")).toLowerCase().includes(q);
function pick(f){
  return CASES.filter(c=>{
    if(!match(c)) return false;
    if(f==="past") return c.past;
    if(c.past) return false;
    if(f==="week") return c.s && diff(c.s)<=7 && diff(c.e)>=0;
    if(f==="check") return !!c.sev;
    if(f==="hold") return c.st==="hold"||c.st==="mix";
    if(f==="conf") return c.st==="conf"||c.st==="mix";
    return true;
  });
}
const byDate=(a,b)=>(a.s||"9999").localeCompare(b.s||"9999")||a.name.localeCompare(b.name,"ko");
const sevRank={hi:0,mid:1,"":2};

function ddLabel(c){
  if(!c.s) return "날짜 없음";
  const a=diff(c.s), b=diff(c.e);
  if(b<0) return "끝남";
  if(a<=0) return "진행 중";
  if(a===0) return "오늘";
  return "D-"+a;
}
function cardHTML(c){
  const d=c.s?pd(c.s):null;
  const isNow=c.s && diff(c.s)<=0 && diff(c.e)>=0;
  const span=c.s&&c.e&&c.s!==c.e?` ~ ${md(c.e)}`:"";
  const st=ST[c.st];
  const flags=c.alerts.slice(0,2).map(a=>`<span class="flag ${a.lv}">${esc(a.t.split(" — ")[0])}</span>`).join("")+(c.alerts.length>2?`<span class="flag">+${c.alerts.length-2}</span>`:"");
  return `<button class="card ${c.sev?"sev-"+c.sev:""}" data-id="${c.id}">
    <div class="date ${isNow?"today":""}">${d?`<span class="m">${d.getMonth()+1}월</span><span class="d">${d.getDate()}</span><span class="w">${WD[d.getDay()]}${span?"~":""}</span>`:`<span class="d">?</span>`}</div>
    <div class="mid"><div class="nm">${esc(c.name)}${c.tag&&!/^GS/.test(c.tag)?` <span style="color:var(--faint);font-weight:500">${esc(c.tag)}</span>`:""}</div>
      <div class="sub">${c.spaces.length?esc(c.spaces.join(" · ")):"공간 미정"}${span?` · ${md(c.s)}${span}`:""}</div>
      ${flags?`<div class="meta">${flags}</div>`:""}</div>
    <div class="right"><span class="pill ${c.past?"p-done":st[1]}">${c.past?"완료":st[0]}</span><span class="dd ${isNow?"now":""}">${ddLabel(c)}</span></div>
  </button>`;
}
function groupName(c){
  if(!c.s) return "날짜 미정";
  const a=diff(c.s), b=diff(c.e);
  if(b<0) return "지난 건";
  if(a<=0) return "오늘 · 진행 중";
  if(a<=7) return "이번 7일";
  if(a<=31) return "한 달 안";
  const d=pd(c.s); return `${d.getMonth()+1}월`;
}

/* ---------- render ---------- */
function renderSum(){
  const up=CASES.filter(c=>!c.past);
  const t=up.filter(c=>c.s&&diff(c.s)<=0&&diff(c.e)>=0).length;
  const w=up.filter(c=>c.s&&diff(c.s)<=7).length;
  const ck=up.filter(c=>c.sev==="hi").length;
  document.getElementById("sum").innerHTML=
   `<button class="tile" data-f="week" aria-pressed="${filter==="week"}"><b>${t}</b><span>오늘 진행</span></button>
    <button class="tile" data-f="week" aria-pressed="false"><b>${w}</b><span>7일 안 시작</span></button>
    <button class="tile hot" data-f="check" aria-pressed="${filter==="check"}"><b>${ck}</b><span>위험 체크</span></button>`;
  document.getElementById("badge").textContent=ck||"";
  document.getElementById("badge").hidden=!ck;
}
function renderChips(){
  document.getElementById("chips").innerHTML=FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
}
function renderList(){
  const listEl=document.getElementById("list");
  let rows=pick(filter);
  if(tab==="check"){ rows=CASES.filter(c=>!c.past&&c.sev&&match(c)).sort((a,b)=>sevRank[a.sev]-sevRank[b.sev]||byDate(a,b)); }
  else if(filter==="past") rows.sort((a,b)=>byDate(b,a)); else rows.sort(byDate);
  if(!rows.length){ listEl.innerHTML=`<p class="empty">${q?"찾는 단체가 없습니다.":"해당하는 건이 없습니다."}</p>`; return; }
  let html="", last="";
  rows.forEach(c=>{
    const g = tab==="check" ? (c.sev==="hi"?"위험 — 먼저 처리":"주의") : groupName(c);
    if(g!==last){ const n=rows.filter(r=>(tab==="check"?(r.sev==="hi"?"위험 — 먼저 처리":"주의"):groupName(r))===g).length; html+=`<div class="grp"><span>${g}</span><span>${n}건</span></div>`; last=g; }
    html+=cardHTML(c);
  });
  listEl.innerHTML=html;
}
function renderSpace(){
  const map={};
  CASES.filter(c=>!c.past&&match(c)).forEach(c=>{
    c.sch.forEach(s=>{ (map[s[2]]=map[s[2]]||[]).push({c,date:s[0],time:s[1],hold:s[3]==="hold"||c.st==="hold"}); });
    (c.rooms||[]).forEach(r=>{ const k="내일을위한집 객실"; (map[k]=map[k]||[]).push({c,date:c.s,time:`${r[2].length}실 · ${r[1]}`,hold:c.st==="hold"}); });
  });
  const order=["대화의 집","새벽의 집","여해의 집 전체","여해의 집 세미나룸","명상센터","C300","C301+C302 통합","C303","C202 통합 · C203 통합","C202-1","C204","내일을위한집 객실"];
  const keys=Object.keys(map).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  const el=document.getElementById("v-space");
  if(!keys.length){el.innerHTML=`<p class="empty">해당하는 공간이 없습니다.</p>`;return;}
  el.innerHTML=`<div class="grp" style="padding-top:16px"><span>공간별 예약</span><span>${keys.length}곳</span></div>`+keys.map(k=>{
    const list=map[k].sort((a,b)=>a.date.localeCompare(b.date));
    return `<div class="sp"><h3>${esc(k)}<small>${list.length}건</small></h3>${list.map(x=>
      `<button class="sp-row" data-id="${x.c.id}"><span class="t">${mdw(x.date).replace(" ","<br>")}</span><span class="n">${esc(x.c.name)} <span style="color:var(--muted);font-size:12.5px">${esc(x.time)}</span></span><span class="pill ${x.hold?"p-hold":"p-conf"}">${x.hold?"가예약":"확정"}</span></button>`).join("")}</div>`;
  }).join("");
}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.getElementById("v-list").hidden = tab==="space";
  document.getElementById("v-space").hidden = tab!=="space";
  document.getElementById("sum").hidden = tab!=="list";
  document.getElementById("chips").hidden = tab!=="list";
  renderSum(); renderChips();
  if(tab==="space") renderSpace(); else renderList();
}

/* ---------- detail ---------- */
function openDetail(id, push=true){
  const c=CASES.find(x=>x.id===id); if(!c) return;
  const st=ST[c.st];
  const when=c.s?(c.s===c.e?mdw(c.s):`${mdw(c.s)} ~ ${mdw(c.e)}`):"날짜 미정";
  const alerts=c.alerts.length?c.alerts.map(a=>`<div class="al ${a.lv}"><i></i><div><b>${esc(a.t)}</b>${a.n?`<small>${esc(a.n)}</small>`:""}</div></div>`).join("")
    :`<div class="ok-line">걸리는 것 없음</div>`;
  const byDay={}; c.sch.forEach(s=>(byDay[s[0]]=byDay[s[0]]||[]).push(s));
  const sch=Object.keys(byDay).sort().map(d=>`<div class="tl"><div class="dt">${md(d)}<small>${WD[pd(d).getDay()]}요일</small></div><div class="what">${byDay[d].map(s=>
     `<div><span class="sp-n">${esc(s[2])}</span>${s[3]==="hold"&&c.st!=="hold"?`<span class="pill p-hold st">가예약</span>`:""}<div class="tm">${esc(s[1])}</div></div>`).join('<div style="height:8px"></div>')}</div></div>`).join("");
  const rooms=(c.rooms||[]).map(r=>`<div class="rooms"><div class="rh">${esc(r[0])}<span>${esc(r[1])}</span></div><div class="rgrid">${r[2].map(n=>`<span>${n}</span>`).join("")}</div></div>`).join("");
  const nos=[c.no,c.no2].filter(x=>x&&x!=="—");
  document.getElementById("detail").innerHTML=`
   <div class="hero gut">
     <button class="back" id="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>목록</button>
     <h2 id="d-name">${esc(c.name)}${c.tag&&!/^GS/.test(c.tag)?` <span style="opacity:.7;font-weight:500">${esc(c.tag)}</span>`:""}</h2>
     <div class="when">${when}${c.pax?` · ${c.pax}명`:""}</div>
     <div class="hero-row"><span class="pill">${c.past?"완료":st[0]}</span><span class="pill">${ddLabel(c)}</span>
       ${nos.map(n=>`<span class="case-no">${n}</span>`).join("")}${c.tag&&/^GS/.test(c.tag)?`<span class="case-no">${c.tag}</span>`:""}
       ${nos[0]?`<button class="copy" id="copy" data-no="${nos[0]}">번호 복사</button>`:""}</div>
   </div>
   <div class="gut">
     <div class="sec"><h4>체크할 것 ${c.alerts.length?`· ${c.alerts.length}`:""}</h4><div class="box">${alerts}</div></div>
     ${sch?`<div class="sec"><h4>공간 일정</h4><div class="box">${sch}</div></div>`:""}
     ${c.stay?`<div class="sec"><h4>북스테이</h4><div class="box"><div class="note">${esc(c.stay)}</div></div></div>`:""}
     ${rooms?`<div class="sec"><h4>내일을위한집 객실 · 입실 16:00 / 퇴실 11:00</h4><div class="box">${rooms}</div></div>`:""}
     ${c.memo?`<div class="sec"><h4>메모</h4><div class="box"><div class="note">${esc(c.memo)}</div></div></div>`:""}
     ${c.hold?`<div class="sec"><h4>가예약</h4><div class="box"><dl class="kv"><dt>기한</dt><dd>${mdw(c.hold)}</dd><dt>오늘 기준</dt><dd>${diff(c.hold)<0?`${-diff(c.hold)}일 지남`:diff(c.hold)===0?"오늘":`${diff(c.hold)}일 남음`}</dd></dl></div></div>`:""}
     <p class="foot">${AS_OF}</p>
   </div>`;
  const sh=document.getElementById("sheet"); sh.scrollTop=0; sh.classList.add("open");
  document.getElementById("back").onclick=()=>closeDetail();
  const cp=document.getElementById("copy");
  if(cp) cp.onclick=()=>{ const t=cp.dataset.no; const done=()=>{cp.textContent="복사됨";setTimeout(()=>cp.textContent="번호 복사",1500)};
    try{ navigator.clipboard.writeText(t).then(done,()=>{cp.textContent=t}); }catch(e){ cp.textContent=t; } };
  if(push){ try{ history.replaceState(null,"","#"+id); }catch(e){} }
  document.getElementById("back").focus({preventScroll:true});
}
function closeDetail(){
  document.getElementById("sheet").classList.remove("open");
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const card=e.target.closest("[data-id]"); if(card){ openDetail(card.dataset.id); return; }
  const f=e.target.closest("[data-f]"); if(f){ filter=f.dataset.f; tab="list"; try{localStorage.setItem("gs-filter",filter);localStorage.setItem("gs-tab",tab)}catch(_){} render(); window.scrollTo(0,0); return; }
  const t=e.target.closest("[data-tab]"); if(t){ tab=t.dataset.tab; try{localStorage.setItem("gs-tab",tab)}catch(_){} render(); window.scrollTo(0,0); }
});
document.getElementById("q").addEventListener("input",e=>{ q=e.target.value.trim().toLowerCase(); render(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });

document.getElementById("today").textContent=`${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 (${WD[TODAY.getDay()]})`;
document.getElementById("foot").textContent=`${AS_OF} · 이후 변경은 반영 안 됨`;
render();
const h=(location.hash||"").slice(1); if(h) openDetail(h,false);
</script>

</body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4a3b">
<meta name="robots" content="noindex,nofollow">
<title>더숲 단체 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 사유의숲: 칠판 같은 깊은 숲빛 초록 + 분필 흰 선 그림, 조용한 명조 제목.
   Layout: phone app shell (max 520px) — 앱 바 + 담당자 스위치, 탭 5개(홈·일정·할 일·수금·공간), 아래서 올라오는 상세 화면(요약·금액·이력·안내문) */
:root{
  --bg:#edf0eb; --surface:#fbfcfa; --surface-2:#f1f4ef; --line:#d9e0d8; --line-2:#c9d3c8;
  --fg:#17261f; --muted:#5b6b62; --faint:#8a978f;
  --brand:#1d4a3b; --brand-2:#2c6650; --brand-fg:#f4f6f1; --brand-soft:#dfe9e3; --chalk:#f4f6f1;
  --red:#c2392b; --red-soft:#fbeae7; --amber:#b16a0a; --amber-soft:#fbf0de; --blue:#2a5d9f; --blue-soft:#e6eef8;
  --ok:#1f7a45; --ok-soft:#e2f2e8; --gold:#a8822a; --gold-soft:#f7f0dc;
  --f-head:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --shadow:0 1px 0 rgba(23,38,31,.04),0 6px 18px -12px rgba(23,38,31,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1612; --surface:#14211b; --surface-2:#1a2a22; --line:#27392f; --line-2:#33493c;
  --fg:#e7eee9; --muted:#9aaba0; --faint:#6f8076;
  --brand:#1f4d3e; --brand-2:#2c6650; --brand-fg:#eef2ec; --brand-soft:#1d3326;
  --red:#ff7a6b; --red-soft:#3a1d19; --amber:#f0a947; --amber-soft:#382a14; --blue:#7fb0f0; --blue-soft:#18273a;
  --ok:#5cc98a; --ok-soft:#173022; --gold:#e3c06b; --gold-soft:#332a14; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1612; --surface:#14211b; --surface-2:#1a2a22; --line:#27392f; --line-2:#33493c;
  --fg:#e7eee9; --muted:#9aaba0; --faint:#6f8076;
  --brand:#1f4d3e; --brand-2:#2c6650; --brand-fg:#eef2ec; --brand-soft:#1d3326;
  --red:#ff7a6b; --red-soft:#3a1d19; --amber:#f0a947; --amber-soft:#382a14; --blue:#7fb0f0; --blue-soft:#18273a;
  --ok:#5cc98a; --ok-soft:#173022; --gold:#e3c06b; --gold-soft:#332a14; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── app bar ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--brand-fg);padding-block:12px 10px;overflow:hidden}
.bar::after{content:"";position:absolute;right:-22px;top:-14px;width:150px;height:150px;background:url(logo.png) no-repeat center/contain;opacity:.12;pointer-events:none}
.bar>*{position:relative;z-index:1}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:42px;height:42px;flex:none}
.brand small{display:block;font-size:11px;opacity:.75;letter-spacing:.3px}
.brand h1{margin:0;font-family:var(--f-head);font-size:21px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.quick{display:flex;gap:6px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;text-decoration:none;color:var(--brand-fg);opacity:.92;min-width:44px}
.qbtn span.i{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.qbtn:active span.i{background:rgba(255,255,255,.22)}
.owners{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;padding-bottom:2px}
.owners::-webkit-scrollbar{display:none}
.ow{flex:none;border-radius:999px;padding:5px 11px;font-size:13px;background:rgba(255,255,255,.1);color:var(--brand-fg);white-space:nowrap}
.ow[aria-pressed="true"]{background:var(--chalk);color:#1d4a3b;font-weight:600}
.ow small{opacity:.7;margin-left:3px}

main{flex:1;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.sec{margin-top:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h2{margin:0;font-family:var(--f-head);font-size:17px;font-weight:700}
.sec-h .more{font-size:13px;color:var(--brand-2);font-weight:600}
.dark .sec-h .more{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ── today strip: weather + fortunes ── */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:14px 2px}
.strip::-webkit-scrollbar{display:none}
.wx,.ft{flex:none;scroll-snap-align:start;border-radius:18px;padding:12px 14px;min-height:118px;display:flex;flex-direction:column;text-align:left}
.wx{text-decoration:none;width:152px;background:linear-gradient(160deg,#2a6a8f,#1f4d6b);color:#f1f6fa}
.wx .t{font-size:34px;font-weight:600;line-height:1;margin-top:6px;letter-spacing:-1px}
.wx .d{font-size:13px;opacity:.9;margin-top:4px}
.wx .s{font-size:11.5px;opacity:.8;margin-top:auto}
.wx .ico{font-size:24px;line-height:1}
.ft{width:200px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.ft .ani{position:absolute;right:8px;top:6px;font-size:40px;opacity:.9}
.ft .nm{font-family:var(--f-head);font-weight:700;font-size:16px}
.ft .tt{font-size:12px;color:var(--muted)}
.ft p{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ft.open p{-webkit-line-clamp:unset}
.ft .lk{margin-top:auto;padding-top:6px;font-size:11.5px;color:var(--gold)}
.ft-title{font-size:11px;letter-spacing:.4px;color:var(--faint);margin-top:2px}

/* ── compact today strip ── */
.tstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px 0}
.tstrip::-webkit-scrollbar{display:none}
.tchip{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.tchip.w{background:#245a7a;border-color:#245a7a;color:#f1f6fa}
.tchip b{font-weight:700}
.tchip .e{font-size:17px;line-height:1}
.tchip small{color:var(--muted);font-size:11.5px}
.tchip.w small{color:#d4e4ee}
.tchip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.ftbox{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font-size:13.5px;line-height:1.5}
.ftbox b{font-weight:700}
.ftbox small{display:block;color:var(--gold);font-size:12px;margin-top:2px}
.ftbox a{color:inherit}
.fp{padding:6px 0;border-top:1px dashed rgba(168,130,42,.35)}
.fp:first-of-type{border-top:0;padding-top:0}
.fp summary{cursor:pointer;list-style:none}
.fp summary::-webkit-details-marker{display:none}
.fp .sx{font-size:11px;color:var(--gold);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:2px}
.fr{display:grid;grid-template-columns:34px 1fr;gap:6px;margin-top:4px;font-size:13px}
.fr span{color:var(--gold);font-weight:600}
.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mbti-grid button{padding:7px 0;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.mbti-grid button[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.ftbox>div:first-child{margin-top:0!important}
/* ── kpis ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:1px}
.kpi b{font-size:21px;font-weight:700;line-height:1.15;white-space:nowrap}
.kpi.amb b{font-size:17px;padding-top:3px}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.red b{color:var(--red)} .kpi.amb b{color:var(--amber)}
.kpi small{font-size:10.5px;color:var(--faint)}

/* ── today timeline ── */
.tl-card{padding:12px 14px}
.tl-day{display:flex;align-items:baseline;gap:8px}
.tl-day b{font-family:var(--f-head);font-size:18px}
.tl-day span{color:var(--muted);font-size:13px}
.tline{position:relative;margin-top:10px}
.tl-axis{display:grid;grid-template-columns:repeat(8,1fr);font-size:10.5px;color:var(--faint);font-family:var(--f-mono);margin-bottom:4px}
.tl-row{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin-top:6px}
.tl-row .sp{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:26px;background:var(--surface-2);border-radius:8px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:12.5% 100%}
.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--brand-2);color:#fff;font-size:11px;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:6px}
.tl-bar.hold{background:repeating-linear-gradient(45deg,var(--blue),var(--blue) 6px,#3a6fb3 6px,#3a6fb3 12px)}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);border-radius:2px}
.tl-empty{color:var(--muted);font-size:14px;padding:6px 0}
.stay-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.stay-row b{color:var(--fg);font-weight:600}

/* ── week strip ── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{padding:8px 4px 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd .w{font-size:11px;color:var(--muted)}
.wd .d{font-size:17px;font-weight:700}
.wd .c{display:flex;gap:2px;height:7px;margin-top:2px}
.wd .c i{width:6px;height:6px;border-radius:50%;background:var(--brand-2)}
.wd .c i.h{background:var(--blue)}
.wd.today{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.wd.today .w{color:var(--brand-fg);opacity:.8}
.wd.today .c i{background:var(--chalk)}
.wd.sun .w{color:var(--red)} .wd.today.sun .w{color:#ffc9c2}
.wd[aria-pressed="true"]{outline:2px solid var(--brand-2);outline-offset:1px}

/* ── action list ── */
.act{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px 11px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .bar4{align-self:stretch;border-radius:0 4px 4px 0;background:var(--amber)}
.act.hi .bar4{background:var(--red)}
.act .t,.act .w{display:block}
.act .t{font-size:14.5px;font-weight:600;line-height:1.35}
.act .w{font-size:12.5px;color:var(--muted);margin-top:1px}
.act .dd{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* ── search / chips ── */
.search{position:relative;margin-top:14px}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 38px;font:inherit;font-size:15px;background:var(--surface);color:var(--fg)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-weight:600;margin-left:3px}

/* ── case cards ── */
.grp{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.3px;padding-block:16px 8px;display:flex;align-items:center;gap:10px}
.grp::before{content:"";order:2;flex:1;border-top:1.5px dashed var(--line-2)}
.grp span:last-child{order:3}
.cc{width:100%;display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;position:relative;box-shadow:var(--shadow)}
.cc:active{transform:scale(.99)}
.cc.sev-hi{box-shadow:inset 4px 0 0 var(--red),var(--shadow)}
.cc.sev-mid{box-shadow:inset 4px 0 0 var(--amber),var(--shadow)}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);border-radius:12px;padding-block:6px}
.date .m{font-size:10.5px;color:var(--muted)}
.date .d{font-size:20px;font-weight:700;line-height:1.1}
.date .w{font-size:10.5px;color:var(--muted)}
.date.now{background:var(--brand);color:var(--brand-fg)}
.date.now .m,.date.now .w{color:var(--brand-fg);opacity:.85}
.date.none .d{font-size:15px;color:var(--faint)}
.mid{min-width:0}
.nm{font-family:var(--f-head);font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--faint);margin-left:4px}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dday{font-size:12px;font-weight:600;font-family:var(--f-mono);color:var(--muted)}
.dday.now{color:var(--brand-2)}
.pill{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
.p-conf{background:var(--ok-soft);color:var(--ok)}
.p-hold{background:var(--blue-soft);color:var(--blue)}
.p-mix{background:var(--amber-soft);color:var(--amber)}
.p-quote{background:var(--surface-2);color:var(--muted)}
.p-done{background:var(--surface-2);color:var(--faint)}
.flag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag.hi{background:var(--red-soft);color:var(--red)}
.flag.mid{background:var(--amber-soft);color:var(--amber)}
.flag.money{background:var(--gold-soft);color:var(--gold)}
.own{font-size:11.5px;color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* ── money tab ── */
.mhero{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mhero div span{display:block;font-size:12px;color:var(--muted)}
.mhero div b{font-size:22px;font-weight:700}
.mhero .r b{color:var(--red)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .n,.mrow .s{display:block}
.mrow .n{font-weight:600}
.mrow .s{font-size:12.5px;color:var(--muted)}
.mrow .a{text-align:right;font-weight:700}
.mrow .a small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.mrow.late .a{color:var(--red)}

/* ── space tab ── */
.sp-card{margin-bottom:10px;overflow:hidden}
.sp-card h3{margin:0;font-family:var(--f-head);font-size:16px;padding:12px 14px 8px;display:flex;justify-content:space-between}
.sp-card h3 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12.5px}
.sp-row{width:100%;display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center;text-align:left;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.sp-row .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.3}
.sp-row .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-row .n small{color:var(--muted);font-size:12px;margin-left:4px}

/* ── tab bar ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;color:var(--faint);position:relative}
.tab[aria-selected="true"]{color:var(--brand-2);font-weight:600}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:var(--ok)}}
.badge{position:absolute;top:4px;left:calc(50% + 7px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center}

/* ── detail sheet ── */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{max-width:520px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.hero{background:var(--brand);color:var(--brand-fg);padding-block:calc(8px + env(safe-area-inset-top,0px)) 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:210px;height:210px;background:url(logo.png) no-repeat center/contain;opacity:.15;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.back{display:flex;align-items:center;gap:2px;font-size:15px;padding:8px 0;color:var(--brand-fg)}
.hero h2{margin:6px 0 0;font-family:var(--f-head);font-size:25px;font-weight:700;letter-spacing:-.3px;text-wrap:balance}
.hero .when{font-size:14.5px;opacity:.92;margin-top:4px}
.hero-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hero .pill{background:rgba(255,255,255,.16);color:var(--brand-fg)}
.cno{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 8px}
.stages{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:14px}
.stages i{height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.stages i.on{background:var(--chalk)}
.stages i.cur{background:#f0c86a}
.stage-l{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-top:5px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-14px;position:relative;z-index:2}
.fact{padding:10px 12px}
.fact span{display:block;font-size:11.5px;color:var(--muted)}
.fact b{font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact.due b{color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:14px;position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:5}
.seg button{padding:8px 0;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.pane{margin-top:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.h4{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin:18px 0 8px}
.h4:first-child{margin-top:0}
.al{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14.5px}
.al:first-child{border-top:0}
.al i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--faint)}
.al.hi i{background:var(--red)} .al.mid i{background:var(--amber)}
.al.hi b{color:var(--red)} .al.mid b{color:var(--amber)}
.al b{font-weight:600}
.al small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.okline{padding:12px 14px;color:var(--ok);font-size:14.5px}
.prog{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.prog span{font-size:12.5px;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--faint)}
.prog span.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.prog span.now{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-weight:600}
.todo{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.todo:first-child{border-top:0}
.todo i{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);margin-top:2px}
.todo.now i{border-color:var(--amber);background:var(--amber-soft)}
.sch{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.sch:first-child{border-top:0}
.sch .dt{font-weight:700;font-size:14px}
.sch .dt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sch .w{min-width:0;display:flex;flex-direction:column;gap:6px}
.sch .sp{font-weight:600}
.sch .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.rooms{padding:12px 14px;border-top:1px solid var(--line)}
.rooms:first-child{border-top:0}
.rooms .rh{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.rooms .rh span{font-weight:400;color:var(--muted)}
.rgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rgrid span{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.money-top{padding:16px 16px 14px}
.money-top .big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.money-top .lbl{font-size:12.5px;color:var(--muted)}
.mbar{height:10px;border-radius:6px;background:var(--red-soft);overflow:hidden;margin-top:12px}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.mleg{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px}
.mleg .p{color:var(--ok);font-weight:600} .mleg .d{color:var(--red);font-weight:600}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li small{display:block;color:var(--muted);font-size:12px}
.li .a{font-weight:600;text-align:right}
.li.neg .a{color:var(--red)}
.li.tot{background:var(--surface-2);font-weight:700}
.pay{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.pay:first-child{border-top:0}
.pay .a{font-weight:700;text-align:right}
.pay small{color:var(--muted);font-size:12px}
.hist{position:relative;padding:4px 14px 6px 34px}
.hist::before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:2px;background:var(--line)}
.hi-item{position:relative;padding:9px 0}
.hi-item::before{content:"";position:absolute;left:-19px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand-2)}
.hi-item.money::before{border-color:var(--gold);background:var(--gold-soft)}
.hi-item.stage::before{background:var(--brand-2)}
.hi-item .t{font-weight:600;font-size:14px}
.hi-item .d{font-size:12.5px;color:var(--muted);margin-top:1px;word-break:keep-all}
.hi-item .w{font-size:11.5px;color:var(--faint);font-family:var(--f-mono);margin-top:2px}
.hi-day{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 0 -2px}
.msg-opts{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.msg-opts label{display:flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--surface-2)}
.msg-opts input{accent-color:var(--brand-2);margin:0}
.msg-kind{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 14px 0}
.msg-kind button{border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:13.5px;color:var(--muted);background:var(--surface-2)}
.msg-kind button[aria-pressed="true"]{border-color:var(--brand-2);color:var(--fg);background:var(--brand-soft);font-weight:600}
textarea.msg{display:block;width:calc(100% - 28px);margin:0 14px;min-height:260px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;line-height:1.55;background:var(--surface-2);color:var(--fg);resize:vertical}
.msg-act{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:12px 14px 14px}
.btn{border-radius:12px;padding:12px;font-weight:700;font-size:15px;text-align:center;text-decoration:none;display:block}
.btn.pri{background:var(--brand);color:var(--brand-fg)}
.btn.sec{background:var(--surface-2);border:1px solid var(--line);color:var(--fg)}
.note{font-size:12.5px;color:var(--muted);padding:0 14px 14px;line-height:1.5}
.guard{display:flex;gap:8px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);font-size:12.5px;padding:10px 12px;border-radius:10px;margin:12px 14px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{font-size:12px;color:var(--faint);text-align:center;padding:20px 0 4px}
.copy-sm{margin-left:auto;font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:2px 8px;color:var(--brand-fg)}
</style>
</head>
<body>
<div class="app">
  <header class="bar gut">
    <div class="bar-row">
      <div class="brand"><img src="logo.png" alt="더숲 숲 그림 로고"><div><small>더숲 아카데미하우스</small><h1>단체 일정</h1></div></div>
      <nav class="quick" aria-label="바로가기">
        <a class="qbtn" href="https://mail.google.com/mail/u/?authuser=biz@deosup.com" target="_blank" rel="noopener"><span class="i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg></span>biz 메일</a>
        <a class="qbtn" href="https://academyhouse.deosup.com/" target="_blank" rel="noopener"><span class="i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>홈페이지</a>
        <a class="qbtn" href="https://academyhouse.deosup.com/admin-cases" target="_blank" rel="noopener"><span class="i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>건 대장</a>
      </nav>

  </header>

  <main>
    <section id="v-home" class="gut"></section>
    <section id="v-list" class="gut" hidden>
      <label class="search" for="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="단체명 · 건번호 · 공간" autocomplete="off"></label>

  </main>

  <nav class="tabs" aria-label="화면"><div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>홈</button>
    <button class="tab" role="tab" data-tab="list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</button>
    <button class="tab" role="tab" data-tab="todo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>할 일<span class="badge" id="b-todo" hidden></span></button>
    <button class="tab" role="tab" data-tab="money"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5v6M18 9.5v6"/></svg>수금<span class="badge" id="b-money" hidden></span></button>

  </div></nav>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name"><div class="sheet-in" id="detail"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="data.js"></script>
<script>
"use strict";
const D = window.APP_DATA || {cases:[],asOf:"",fortune:null,weather:null};
const WD="일월화수목금토";
const now=new Date(); const TODAY=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY_S=ymd(TODAY);
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const diff=s=>Math.round((pd(s)-TODAY)/864e5);
const md=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}`};
const mdw=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`};
const won=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("ko-KR");
const manwon=n=>{n=Number(n)||0;if(n>=1e8)return (n/1e8).toFixed(1).replace(/\.0$/,"")+"억";if(n>=1e4)return Math.round(n/1e4).toLocaleString("ko-KR")+"만";return won(n)};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAGES=["문의","상담","가예약","견적","계약","확정","이용","정산","매출"];
const ST={conf:["확정","p-conf"],hold:["가예약","p-hold"],mix:["확정+가예약","p-mix"],quote:["견적 중","p-quote"]};
const OWN={"최형근 부장":"최형근","":"미지정","SALES":"영업"};
const ownName=o=>OWN[o]!==undefined?OWN[o]:o;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- prepare cases ---------- */
const CASES=D.cases.map((c,i)=>{
  c.id=c.no||("X"+i);
  c.sch=c.sch||[]; c.rooms=c.rooms||[]; c.al=(c.al||[]).map(a=>({lv:a[0],t:a[1],n:a[2]||""}));
  c.amt=c.amt||{}; c.hist=c.hist||[]; c.todo=c.todo||[];
  c.past=!!(c.e && diff(c.e)<0);
  if(c.hold && (c.st==="hold"||c.st==="mix"||c.st==="quote") && !c.past){
    const h=diff(c.hold), soon=c.s?diff(c.s):999;
    if(h<0) c.al.unshift({lv:soon<=14?"hi":"mid",t:`가예약 기한 지남 (${md(c.hold)})`,n:"자리가 계속 막혀 있음 — 연장하거나 풀기"});
    else if(h===0) c.al.unshift({lv:"hi",t:"가예약 기한 오늘",n:"오늘 연장·확정·해제 결정"});
    else if(h<=3) c.al.unshift({lv:"mid",t:`가예약 ${h}일 뒤 기한 (${md(c.hold)})`,n:""});
  }
  if(c.past) c.al.forEach(a=>{if(a.lv==="hi"&&!/입금/.test(a.t))a.lv="mid"});
  c.sev=c.al.some(a=>a.lv==="hi")?"hi":c.al.some(a=>a.lv==="mid")?"mid":"";
  c.spaces=[...new Set([...c.sch.map(s=>s[2]),...c.rooms.map(r=>"내일을위한집 "+r[2].length+"실")])];
  c.due=Number(c.amt.due)||0; c.final=Number(c.amt.final)||0; c.paid=Number(c.amt.paid)||0;
  c.late=c.al.some(a=>/입금 지연/.test(a.t));
  return c;
});

/* ---------- state ---------- */
let tab=LS.get("gs2-tab","home"), owner="전체", filter="up", q="", dayPick=null;
const mine=c=>owner==="전체"||ownName(c.owner)===owner;
const live=()=>CASES.filter(c=>!c.past&&mine(c));

/* ---------- owners ---------- */
function renderOwners(){
  const counts={};CASES.filter(c=>!c.past).forEach(c=>{const o=ownName(c.owner);counts[o]=(counts[o]||0)+1});
  const order=["최형근","허윤정","신효근","KIM-YW","JIN-IJ","영업","미지정"];
  const list=["전체",...order.filter(o=>counts[o]),...Object.keys(counts).filter(o=>!order.includes(o))];
  if(!list.includes(owner))owner="전체";
  document.getElementById("owners").innerHTML=list.map(o=>`<button class="ow" data-owner="${esc(o)}" aria-pressed="${o===owner}">${o==="전체"?"전체 담당":esc(o)}<small>${o==="전체"?CASES.filter(c=>!c.past).length:counts[o]}</small></button>`).join("");
}

/* ---------- weather & fortune ---------- */
const WMO={0:["맑음","☀️"],1:["대체로 맑음","🌤️"],2:["구름 조금","⛅"],3:["흐림","☁️"],45:["안개","🌫️"],48:["안개","🌫️"],51:["이슬비","🌦️"],53:["이슬비","🌦️"],55:["이슬비","🌦️"],61:["비","🌧️"],63:["비","🌧️"],65:["강한 비","🌧️"],71:["눈","🌨️"],73:["눈","🌨️"],75:["많은 눈","❄️"],80:["소나기","🌦️"],81:["소나기","🌧️"],82:["강한 소나기","⛈️"],95:["뇌우","⛈️"]};
let WX=D.weather&&D.weather.date===TODAY_S?D.weather:null;
function wxHTML(){
  const w=WX?(WMO[WX.code]||[WX.desc||"","🌤️"]):["","🌳"];
  return `<button class="tchip w" id="wx" data-pop="wx" aria-pressed="${pop==="wx"}"><span class="e">${w[1]}</span><b class="num">${WX?Math.round(WX.t)+"°":"날씨"}</b>${WX?esc(w[0]):""}</button>`;
}
function wxBox(){
  if(!WX) return `<div class="ftbox">날씨를 불러오지 못했습니다. <a href="https://www.weather.go.kr/w/index.do" target="_blank" rel="noopener">기상청 날씨 보기 ›</a></div>`;
  const w=WMO[WX.code]||[WX.desc||"",""];
  return `<div class="ftbox"><b>수유동 · ${esc(w[0])} ${Math.round(WX.t)}°</b> 최고 ${Math.round(WX.hi)}° · 최저 ${Math.round(WX.lo)}° · 비 올 확률 ${WX.pop??"—"}%<small><a href="https://www.weather.go.kr/w/index.do" target="_blank" rel="noopener">기상청에서 자세히 ›</a></small></div>`;
}
async function loadWeather(){
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.66&longitude=127.0&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1");
    if(!r.ok) return; const j=await r.json();
    WX={date:TODAY_S,t:j.current.temperature_2m,code:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0],pop:j.daily.precipitation_probability_max[0]};
    const el=document.getElementById("wx"); if(el) el.outerHTML=wxHTML();
  }catch(e){}
}
let pop="";
function fortuneHTML(){
  const F=D.fortune; if(!F||!F.items) return "";
  return `<button class="tchip" data-pop="ft" aria-pressed="${pop==="ft"}"><b>${F.items.map(f=>esc(f.name)).join(", ")}</b> 오늘의 운세</button>`
   +(F.mbti?`<button class="tchip" data-pop="mbti" aria-pressed="${pop==="mbti"}"><b>MBTI</b> 운세</button>`:"")
   +`<a class="tchip" href="https://search.naver.com/search.naver?query=${encodeURIComponent("사주 운세")}" target="_blank" rel="noopener"><b>사주</b> 검색 ↗</a>`;
}
function ftBox(){
  const F=D.fortune; if(!F||!F.items) return "";
  const stale=F.date!==TODAY_S;
  const row=(k,v)=>v?`<div class="fr"><span>${k}</span>${esc(v)}</div>`:"";

const FILTERS=[["up","다가오는"],["week","7일 안"],["hold","가예약"],["conf","확정"],["nodate","날짜 미정"],["past","지난 건"]];
const byDate=(a,b)=>(a.s||"9999").localeCompare(b.s||"9999")||a.name.localeCompare(b.name,"ko");
const match=c=>!q||(c.name+c.no+(c.tag||"")+c.spaces.join(" ")).toLowerCase().includes(q);
function pick(){
  return CASES.filter(c=>{
    if(!mine(c)||!match(c)) return false;
    if(dayPick) return c.s&&c.s<=dayPick&&(c.e||c.s)>=dayPick;
    if(filter==="past") return c.past;
    if(c.past) return false;
    if(filter==="week") return c.s&&diff(c.s)<=7;
    if(filter==="hold") return c.st==="hold"||c.st==="mix"||c.st==="quote";
    if(filter==="conf") return c.st==="conf"||c.st==="mix";
    if(filter==="nodate") return !c.s;
    return true;
  });
}
function grpName(c){
  if(!c.s) return "날짜 미정"; const a=diff(c.s), b=diff(c.e||c.s);
  if(b<0) return "지난 건"; if(a<=0) return "오늘 · 진행 중"; if(a===1) return "내일"; if(a<=7) return "이번 7일"; if(a<=31) return "한 달 안";
  const d=pd(c.s); return `${d.getFullYear()!==TODAY.getFullYear()?d.getFullYear()+"년 ":""}${d.getMonth()+1}월`;
}
function renderList(){
  const counts=Object.fromEntries(FILTERS.map(([k])=>{const f0=filter,d0=dayPick;filter=k;dayPick=null;const n=pick().length;filter=f0;dayPick=d0;return[k,n]}));
  document.getElementById("chips").innerHTML=(dayPick?`<button class="chip" data-day-clear aria-pressed="true">${mdw(dayPick)} ✕</button>`:"")+FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${!dayPick&&filter===k}">${l}<b>${counts[k]}</b></button>`).join("");
  let rows=pick(); rows.sort(filter==="past"&&!dayPick?(a,b)=>byDate(b,a):byDate);
  const el=document.getElementById("list");
  if(!rows.length){el.innerHTML=`<p class="empty">${q?"찾는 단체가 없습니다.":"해당하는 건이 없습니다."}</p>`;return}
  let h="",last="";rows.forEach(c=>{const g=dayPick?mdw(dayPick):grpName(c);if(g!==last){h+=`<div class="grp"><span>${g}</span><span>${rows.filter(r=>(dayPick?mdw(dayPick):grpName(r))===g).length}건</span></div>`;last=g}h+=card(c)});
  el.innerHTML=h;
}

      ${c.todo.length?`<div class="h4">시스템 남은 일</div><div class="box">${c.todo.map(t=>`<div class="todo ${t.startsWith("!")?"now":""}"><i></i><span>${esc(t.replace(/^!/,""))}</span></div>`).join("")}</div>`:""}
      ${prog?`<div class="h4">진행 체크</div><div class="box"><div class="prog">${prog}</div></div>`:""}
      ${Object.keys(byDay).length?`<div class="h4">공간 일정</div><div class="box">${Object.keys(byDay).sort().map(d=>`<div class="sch"><div class="dt">${md(d)}<small>${WD[pd(d).getDay()]}요일</small></div><div class="w">${byDay[d].map(s=>`<div><span class="sp">${esc(s[2])}</span> ${s[3]==="hold"&&c.st!=="hold"?`<span class="pill p-hold">가예약</span>`:""}<div class="tm">${esc(s[1])}</div></div>`).join("")}</div></div>`).join("")}</div>`:""}
      ${c.rooms.length?`<div class="h4">내일을위한집 객실 · 입실 16:00 / 퇴실 11:00</div><div class="box">${c.rooms.map(r=>`<div class="rooms"><div class="rh">${r[2].length}실<span>${esc(r[1])}</span></div><div class="rgrid">${r[2].map(n=>`<span>${esc(n)}</span>`).join("")}</div></div>`).join("")}</div>`:""}
      ${c.memo?`<div class="h4">메모</div><div class="box"><div class="note" style="padding-top:12px">${esc(c.memo)}</div></div>`:""}`;
  }else if(pane==="amt"){
    const a=c.amt, items=a.items||[], chg=a.chg||[], pay=a.pay||[];
    const pct=c.final?Math.min(100,Math.round(c.paid/c.final*100)):0;
    el.innerHTML=c.final||items.length?`
      <div class="box money-top"><div class="lbl">최종 청구액 (부가세 포함)</div><div class="big num">${won(c.final)}원</div>
        <div class="mbar"><i style="width:${pct}%"></i></div><div class="mleg num"><span class="p">받은 돈 ${won(c.paid)}</span><span class="d">받을 돈 ${won(c.due)}</span></div></div>
      ${items.length?`<div class="h4">견적 구성</div><div class="box">${items.map(r=>`<div class="li"><span>${esc(r[0])}<small>${esc(r[1]||"")}${r[2]?" · "+esc(r[2]):""}</small></span><span class="a num">${esc(r[3])}</span></div>`).join("")}${a.base?`<div class="li tot"><span>계약 기준선</span><span class="a num">${won(a.base)}</span></div>`:""}</div>`:""}
      ${chg.length?`<div class="h4">계약 후 변경</div><div class="box">${chg.map(r=>`<div class="li ${/^-|−/.test(r[3])?"neg":""}"><span>${esc(r[0])}<small>${esc(r[1]||"")}${r[2]?" · "+esc(r[2]):""}</small></span><span class="a num">${esc(r[3])}</span></div>`).join("")}</div>`:""}
      ${pay.length?`<div class="h4">결제 단계</div><div class="box">${pay.map(p=>{const ok=/확인|입금/.test(p[4]);return `<div class="pay"><span><b>${esc(p[0])}</b> <span class="pill ${ok?"p-conf":/지연|지남/.test(p[4])?"p-hold":"p-quote"}">${ok?"받음":"예정"}</span><br><small>${esc(p[1]||"")} · ${esc(p[3]||"")}${ok&&p[4]?" · "+esc(p[4].replace("결제 확인","").trim()):""}</small></span><span class="a num">${esc(p[2])}</span></div>`}).join("")}</div>`:""}
      <p class="note" style="padding:10px 2px 0">금액은 건 대장 기준입니다. 고치는 일은 건 대장에서 합니다.</p>`
      :`<div class="box"><div class="note" style="padding-top:12px">아직 견적 금액이 없습니다.</div></div>`;
  }else if(pane==="hist"){
    if(!c.hist.length){el.innerHTML=`<div class="box"><div class="note" style="padding-top:12px">이력이 없습니다.</div></div>`;return}
    let last="";
    el.innerHTML=`<div class="box"><div class="hist">${c.hist.map(h=>{const [day,tm]=(h[0]||"").split(" ");const head=day!==last?`<div class="hi-day">${esc(day)}</div>`:"";last=day;
      const cls=/결제|입금|정산|금액|청구|기준선/.test(h[1])?"money":/상태 변경|확정|계약/.test(h[1])?"stage":"";
      return head+`<div class="hi-item ${cls}"><div class="t">${esc(h[1])}</div>${h[2]?`<div class="d">${esc(h[2])}</div>`:""}<div class="w">${esc(tm||"")}${h[3]?" · "+esc(h[3]):""}</div></div>`}).join("")}</div></div>
      <p class="note" style="padding:10px 2px 0">최근 ${c.hist.length}건 · 같은 내용 반복 저장은 접었습니다.</p>`;
  }else{
    el.innerHTML=`
      <div class="box">
        <div class="msg-kind"><button data-kind="guest" aria-pressed="${msgKind==="guest"}">단체 담당자에게</button><button data-kind="front" aria-pressed="${msgKind==="front"}">현장·프론트 전달</button></div>
        ${msgKind==="guest"?`<div class="msg-opts"><label><input type="checkbox" id="o-amt" ${msgOpt.amt?"checked":""}> 금액·잔금</label><label><input type="checkbox" id="o-acct" ${msgOpt.acct?"checked":""}> 입금 계좌</label><label><input type="checkbox" id="o-park" ${msgOpt.park?"checked":""}> 주차·오시는 길</label></div>`:`<div style="height:12px"></div>`}
        <textarea class="msg" id="msg" aria-label="보낼 안내문">${esc(buildMsg(c))}</textarea>
        <div class="guard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:none;margin-top:1px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>${msgKind==="guest"?"이 단체 정보만 들어갑니다. 다른 단체·내부 체크·이력·메모는 빠집니다.":"금액은 빠집니다. 프론트·F&B에 바로 붙여 넣으세요."}</span></div>
        <div class="msg-act"><button class="btn pri" data-copymsg>안내문 복사</button><a class="btn sec" id="mailto" href="#">메일 앱</a></div>
        <p class="note">복사한 뒤 카카오톡·문자·메일에 붙여 넣으면 됩니다. 보내기 전에 위 칸에서 바로 고칠 수 있습니다.</p>
      </div>`;
    setMailto();
  }
}
function buildMsg(c){
  const L=[]; const when=c.s?(c.s===c.e||!c.e?mdw(c.s):`${mdw(c.s)} ~ ${mdw(c.e)}`):"일정 협의 중";
  const byDay={};c.sch.forEach(s=>(byDay[s[0]]=byDay[s[0]]||[]).push(s));
  const sched=Object.keys(byDay).sort().map(d=>`· ${mdw(d)} ${byDay[d].map(s=>`${s[2].replace(/ 통합$/,"")} ${s[1]}`).join(", ")}`);
  if(msgKind==="front"){
    L.push(`[현장 전달] ${c.name} (${c.no})`,`일정: ${when}${c.pax?` · ${c.pax}명`:""}`);
    if(sched.length)L.push("","공간",...sched);
    c.rooms.forEach(r=>L.push("",`객실 ${r[2].length}실 (${r[1]}) 입실 16:00 · 퇴실 11:00`,r[2].join(", ")));
    const meal=(c.amt.items||[]).filter(r=>/식|조식|중식|석식|다이닝|커피|다과/.test(r[0]));
    if(meal.length)L.push("","식음",...meal.map(r=>`· ${r[0]} ${r[1]||""}${r[2]?" "+r[2]:""}`));
    if(c.memo)L.push("","메모: "+c.memo);
    return L.join("\n");
  }
  L.push(`안녕하세요, 더숲 아카데미하우스입니다.`,`${c.name} 이용 안내드립니다.`,"",`■ 일정  ${when}${c.pax?` · ${c.pax}명`:""}`);
  if(sched.length)L.push("■ 공간",...sched);
  c.rooms.forEach(r=>L.push(`■ 숙박  ${r[2].length}실 (${r[1]})`,"  입실 16:00 · 퇴실 11:00"));
  if(msgOpt.amt&&c.final){
    L.push("",`■ 이용 금액  ${won(c.final)}원 (부가세 포함)`);
    if(c.paid)L.push(`  받은 금액  ${won(c.paid)}원`);
    if(c.due>0){const np=(c.amt.pay||[]).find(p=>!/확인|입금/.test(p[4]));L.push(`  남은 금액  ${won(c.due)}원${np&&np[1]?` (${md(np[1])}까지)`:""}`);}
  }
  if(msgOpt.acct&&c.due>0)L.push("",`■ 입금 계좌  하나은행 247-910039-43404`,`  예금주 더숲 아카데미하우스`,`  입금자명에 「${c.name}」을 적어 주세요.`);
  if(msgOpt.park)L.push("",`■ 오시는 길  서울 강북구 4.19로 135 (수유동, 아카데미하우스)`,`■ 주차  행사 시간 + 30분 무료, 이후 10분당 1,300원`,`  숙박 객실당 1대 무료 · 주차 공간이 한정되어 있어 대중교통을 권해 드립니다.`);
  L.push("",`문의  02-904-0206 · biz@deosup.com`,`감사합니다.`);
  return L.join("\n");
}
function setMailto(){const a=document.getElementById("mailto");if(!a)return;const t=document.getElementById("msg").value;a.href=`mailto:?subject=${encodeURIComponent("[더숲 아카데미하우스] "+cur.name+" 이용 안내")}&body=${encodeURIComponent(t)}`}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target;
  const mb=t.closest("[data-mbti]"); if(mb){myMbti=mb.dataset.mbti;LS.set("gs2-mbti",myMbti);renderHome();return}
  const pp=t.closest("[data-pop]"); if(pp){pop=pop===pp.dataset.pop?"":pp.dataset.pop;renderHome();return}
  if(t.closest("[data-close]")){closeDetail();return}
  const cn=t.closest("[data-copyno]"); if(cn){if(!await copyText(cn.dataset.copyno))toast(cn.dataset.copyno);return}
  if(t.closest("[data-copymsg]")){const ta=document.getElementById("msg");if(!await copyText(ta.value)){ta.focus();ta.select();toast("선택했습니다 · 길게 눌러 복사")}return}
  const pn=t.closest(".seg [data-pane]"); if(pn){pane=pn.dataset.pane;drawDetail();return}
  const k=t.closest("[data-kind]"); if(k){msgKind=k.dataset.kind;drawPane();return}
  const card=t.closest("[data-id]"); if(card){openDetail(card.dataset.id,card.dataset.pane);return}
  const ow=t.closest("[data-owner]"); if(ow){owner=ow.dataset.owner;LS.set("gs2-owner",owner);render();return}
  const go=t.closest("[data-go]"); if(go){const [tb,f]=go.dataset.go.split(":");tab=tb;if(f){filter=f;dayPick=null}LS.set("gs2-tab",tab);render();window.scrollTo(0,0);return}
  const dy=t.closest("[data-day]"); if(dy){dayPick=dy.dataset.day;tab="list";render();window.scrollTo(0,0);return}
  if(t.closest("[data-day-clear]")){dayPick=null;render();return}
  const f=t.closest("[data-f]"); if(f){filter=f.dataset.f;dayPick=null;render();return}
  const rg=t.closest("[data-range]"); if(rg){spaceRange=rg.dataset.range;LS.set("gs2-space",spaceRange);render();return}
  const tb=t.closest("[data-tab]"); if(tb){tab=tb.dataset.tab;dayPick=null;LS.set("gs2-tab",tab);render();window.scrollTo(0,0);return}
});
document.addEventListener("change",e=>{const id=e.target.id;if(id==="o-amt"||id==="o-acct"||id==="o-park"){msgOpt[id.slice(2)]=e.target.checked;document.getElementById("msg").value=buildMsg(cur);setMailto()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.trim().toLowerCase();renderList()}if(e.target.id==="msg")setMailto()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

document.getElementById("foot").textContent=(D.asOf||"")+" · 고치는 일은 건 대장에서";
if(!["home","list","todo","money","space"].includes(tab))tab="home";
render(); loadWeather();
const h=(location.hash||"").slice(1); if(h&&CASES.some(c=>c.id===h)) openDetail(h);
</script>
</body>
</html>
